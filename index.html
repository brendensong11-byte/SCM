<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPROJECT SCM System</title>
    <style>
        /* =========================================================
           JPROJECT SCM — DESIGN SYSTEM
           ========================================================= */
        :root {
            --bg:#f4f7fa; --card:#ffffff; --navy:#17324a; --blue:#315f86; 
            --blue-soft:#edf4f9; --line:#d9e2ea; --line-soft:#e9eef3; --text:#17212b; 
            --muted:#718096; --green:#46705c; --green-soft:#eff6f1; --amber:#916f32; 
            --amber-soft:#fbf7ed; --red:#a84c4c; --red-soft:#fff3f3; 
            --shadow:0 8px 24px rgba(24,50,75,.06);
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
        body{background:var(--bg);color:var(--text);line-height:1.5;padding:22px;font-size:13px}
        .container{max-width:1500px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
        header{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px;gap:16px}
        .logo{font-size:21px;font-weight:850;color:var(--navy);letter-spacing:-.6px}.logo span{color:var(--blue);font-weight:500;margin-left:5px}
        .brand-select{padding:9px 12px;border:1px solid #b9c7d4;border-radius:8px;background:#fff;color:var(--navy);font-weight:700;outline:none}
        .alert-bar{background:#fff8f8;border:1px solid #e8caca;border-radius:99px;padding:11px 15px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.15s}.alert-bar:hover{background:var(--red-soft)}
        .alert-title{color:var(--red);font-weight:750;display:flex;align-items:center;gap:8px}.alert-badge{background:var(--red);color:#fff;padding:3px 7px;border-radius:999px;font-size:10px}
        .nav-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);align-items:flex-end}.tab-btn{padding:10px 15px;border:1px solid transparent;border-bottom:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;border-radius:8px 8px 0 0}.tab-btn.active{color:var(--navy);background:var(--blue-soft);border-color:var(--line);border-bottom-color:var(--blue-soft)}.tab-btn .badge{background:#f2f5f8;color:var(--muted);padding:2px 7px;border-radius:999px;font-size:10px;margin-left:5px}.tab-btn.active .badge{background:var(--navy);color:#fff}
        .btn-action,.btn-secondary,.btn-danger{border-radius:7px;font-weight:750;cursor:pointer;transition:.15s}.btn-action{background:var(--navy);color:#fff;border:1px solid var(--navy);padding:8px 12px;font-size:12px}.btn-action:hover{background:#24465f}.btn-secondary{background:#fff;color:var(--navy);border:1px solid #bdcad6;padding:6px 10px;font-size:11px}.btn-secondary:hover{background:var(--blue-soft);border-color:#91acc1}.btn-danger{background:#fff;color:var(--red);border:1px solid #d8a9a9;padding:5px 9px;font-size:11px}.btn-danger:hover{background:var(--red-soft)}
        .table-container{overflow-x:auto;border:1px solid var(--line);border-radius:9px;margin-bottom:10px}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{background:#f8fafc;color:#607184;font-weight:750;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px;letter-spacing:.2px}td{padding:11px 12px;border-bottom:1px solid var(--line-soft);color:#263746;vertical-align:middle}
        
        /* 아코디언 행 스타일 */
        .accordion-row{cursor:pointer;transition:background .15s}.accordion-row:hover{background:var(--blue-soft)}
        .accordion-row.expanded{background:#edf4f9;font-weight:bold}
        .accordion-content-td{padding:0!important;border-bottom:2px solid var(--blue)}
        .accordion-box{background:#f8fafc;padding:18px;border-top:1px solid var(--line)}

        .status-badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.status-in-progress{background:var(--blue-soft);color:var(--blue);border:1px solid #bfd2e1}.status-partial{background:var(--amber-soft);color:var(--amber);border:1px solid #dfcda6}.status-completed{background:var(--green-soft);color:var(--green);border:1px solid #bdd2c3}.status-danger{background:var(--red-soft);color:var(--red);border:1px solid #e4bcbc}
        .section-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(24,50,75,.025)}.section-title{font-size:12px;font-weight:850;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line-soft);padding-bottom:8px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.info-item label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:750}.info-item span{font-weight:800;color:var(--navy);font-size:13px}
        .action-group{display:flex;gap:5px;align-items:center;justify-content:flex-start;flex-wrap:wrap}
        .shipment-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fbfcfd;border:1px solid var(--line-soft);padding:6px 8px;margin-bottom:4px;border-radius:6px}.shipment-actions{display:flex;gap:4px;white-space:nowrap}.issue-item{font-size:11px;color:var(--red);margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--red-soft);padding:5px 8px;border-radius:6px;border:1px solid #f0d6d6}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(16,31,45,.48);justify-content:center;align-items:center;z-index:1000;padding:18px}.modal-content{background:#fff;padding:21px;border-radius:12px;width:100%;max-width:580px;border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.18)}.modal-header{font-size:15px;font-weight:850;margin-bottom:15px;display:flex;justify-content:space-between;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:10px}.form-group{margin-bottom:12px}.form-group label{display:block;font-size:11px;font-weight:800;margin-bottom:5px;color:#425466}.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 10px;border:1px solid #c3d0dc;border-radius:7px;font-size:13px;outline:none;background:#fff}.modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
        .step-flow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:10px;color:var(--muted)}
        .step-pill{padding:2px 6px;border-radius:4px;background:#f0f4f8;border:1px solid var(--line-soft)}
        .step-pill.current{background:var(--navy);color:#fff;font-weight:bold}
        .type-radio-group{display:flex;gap:12px;margin-bottom:10px;background:var(--blue-soft);padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
        .type-radio-group label{display:flex;align-items:center;gap:4px;font-weight:800;cursor:pointer;color:var(--navy);font-size:12px}
        .clickable-name{color:var(--navy);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.clickable-name:hover{color:var(--blue)}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">JPROJECT <span>SCM</span></div>
            <div>
                <select class="brand-select" id="brandFilter" onchange="renderMainList()">
                    <option value="ALL">전체 브랜드</option>
                    <option value="스노야">스노야</option>
                    <option value="모브온">모브온</option>
                </select>
            </div>
        </header>

        <div class="alert-bar" onclick="openAlertModal()">
            <div class="alert-title">
                <span class="alert-badge" id="alertCountBadge">0건</span> 지연 및 이슈 항목 확인 필요
            </div>
            <span style="font-size:12px; color:#7f1d1d; text-decoration: underline;">클릭하여 이슈 세부사항 확인 →</span>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" id="tabActive" onclick="switchMainTab('ACTIVE')">
                진행 중 <span class="badge" id="countActive">0</span>
            </button>
            <button class="tab-btn" id="tabCompleted" onclick="switchMainTab('COMPLETED')">
                완료 (보관함) <span class="badge" id="countCompleted">0</span>
            </button>
            <div style="margin-left: auto;">
                <button class="btn-action" onclick="openStyleModal()">+ 신규 STYLE 등록</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px;"></th>
                        <th>브랜드</th>
                        <th>시즌</th>
                        <th>Style No.</th>
                        <th>상품명</th>
                        <th>진행 단계</th>
                        <th>목표일</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody id="styleTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- [모달 모음] -->
    <!-- 신규 Style 등록 모달 -->
    <div class="modal-overlay" id="styleModal">
        <div class="modal-content">
            <div class="modal-header">신규 Style 등록</div>
            <div class="form-group"><label>브랜드</label><select id="newBrand"><option value="스노야">스노야</option><option value="모브온">모브온</option></select></div>
            <div class="form-group"><label>시즌</label><input type="text" id="newSeason" value="26SS"></div>
            <div class="form-group"><label>Style No.</label><input type="text" id="newStyleNo" placeholder="예: ST26002"></div>
            <div class="form-group"><label>상품명</label><input type="text" id="newStyleName" placeholder="예: 데일리 오버핏 셔츠"></div>
            <div class="form-group"><label>목표 납기일</label><input type="date" id="newTargetDate"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('styleModal')">취소</button>
                <button class="btn-action" onclick="saveNewStyle()">등록</button>
            </div>
        </div>
    </div>

    <!-- 입고/공정 기록 모달 -->
    <div class="modal-overlay" id="partialInModal">
        <div class="modal-content">
            <div class="modal-header">누적 입고 수량 및 현재 공정 기록</div>
            <div class="form-group"><label>현재까지 실제 입고된 누적 수량</label><input type="number" id="partialInQty" placeholder="예: 2000"></div>
            <div class="form-group"><label>현재 진행 중인 공정 단계</label><select id="itemProcessStep"></select></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('partialInModal')">취소</button>
                <button class="btn-action" onclick="savePartialIn()">저장</button>
            </div>
        </div>
    </div>

    <!-- 자재(원사/원단/부자재) 등록/수정 모달 -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal-content">
            <div class="modal-header" id="itemModalHeader">자재 정보 등록/수정</div>
            <div class="type-radio-group" id="materialTypeRadioGroup">
                <label id="lblOptYarn"><input type="radio" name="materialType" value="YARN" onchange="toggleMaterialFormFields('YARN')"> 원사</label>
                <label id="lblOptFabric"><input type="radio" name="materialType" value="FABRIC" onchange="toggleMaterialFormFields('FABRIC')"> 원단</label>
                <label id="lblOptTrim" style="display:none;"><input type="radio" name="materialType" value="TRIM" onchange="toggleMaterialFormFields('TRIM')"> 부자재</label>
            </div>

            <div class="form-group" id="fgName"><label id="lblItemName">품목/자재명</label><input type="text" id="newItemName" placeholder="예: 30수 면 원사"></div>
            <div class="form-group" id="fgSpec"><label id="lblItemSpec">규격 / 혼용률</label><input type="text" id="newItemSpec" placeholder="예: 면 100% / 코마사"></div>
            <div class="form-group" id="fgSupplier"><label id="lblItemSupplier">공급/제조 업체명</label><input type="text" id="newItemSupplier" placeholder="예: 중국 A 원사방적"></div>
            <div class="form-group" id="fgUnit"><label id="lblItemUnit">단위 / 발주 수량</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="newItemUnit" style="width:30%;" placeholder="단위(kg, y, 개)" value="kg">
                    <input type="number" id="newItemTotalQty" style="width:70%;" placeholder="예: 10000">
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('itemModal')">취소</button>
                <button class="btn-danger" id="btnDeleteItem" style="display:none; margin-right:auto;" onclick="deleteCurrentItem()">삭제</button>
                <button class="btn-action" onclick="saveNewItem()">저장</button>
            </div>
        </div>
    </div>

    <!-- 자재 세부 히스토리 모달 -->
    <div class="modal-overlay" id="materialDetailModal">
        <div class="modal-content">
            <div class="modal-header">자재 세부 정보 및 히스토리</div>
            <div style="font-size:12px; line-height:1.7;">
                <div class="form-group"><label>구분 / 자재명</label><div id="mdName" style="font-weight:bold; font-size:14px; color:var(--navy);">-</div></div>
                <div class="form-group"><label>규격 및 혼용률</label><div id="mdSpec">-</div></div>
                <div class="form-group"><label>공급 업체명</label><div id="mdSupplier">-</div></div>
                <div class="form-group"><label>발주 수량 / 누적 입고량 (달성률)</label><div id="mdQtyInfo" style="font-weight:bold; color:var(--blue);">-</div></div>
                <div class="form-group"><label>현재 세부 공정 단계</label><div id="mdStep" style="font-weight:bold; color:var(--amber);">-</div></div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('materialDetailModal')">닫기</button>
            </div>
        </div>
    </div>

    <!-- 봉제 공장 모달 -->
    <div class="modal-overlay" id="sewingModal">
        <div class="modal-content">
            <div class="modal-header">봉제 공장 추가</div>
            <div class="form-group"><label>국가</label><input type="text" id="newFacCountry" placeholder="예: 베트남"></div>
            <div class="form-group"><label>공장명</label><input type="text" id="newFacName" placeholder="예: ABCD 공장"></div>
            <div class="form-group"><label>목표 생산 수량</label><input type="number" id="newFacTarget" placeholder="10000"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('sewingModal')">취소</button>
                <button class="btn-action" onclick="saveNewSewingFactory()">등록</button>
            </div>
        </div>
    </div>

    <!-- 출고 모달 -->
    <div class="modal-overlay" id="shipmentModal">
        <div class="modal-content">
            <div class="modal-header" id="shipmentModalHeader">완제품 출고 등록</div>
            <div class="form-group"><label>출고 일자</label><input type="date" id="shipmentDate"></div>
            <div class="form-group"><label>출고 수량</label><input type="number" id="shipmentQty" placeholder="예: 2000"></div>
            <div class="form-group"><label>비고/차수</label><input type="text" id="shipmentNote" placeholder="예: 1차 선출고"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('shipmentModal')">취소</button>
                <button class="btn-action" onclick="saveShipment()">저장</button>
            </div>
        </div>
    </div>

    <!-- 생산 이슈 모달 -->
    <div class="modal-overlay" id="issueModal">
        <div class="modal-content">
            <div class="modal-header">봉제/생산 이슈 등록</div>
            <div class="form-group"><label>이슈 내용</label><textarea id="issueText" rows="3" placeholder="예: 원단 입고 지연으로 라인 가동 2일 차질 발생"></textarea></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('issueModal')">취소</button>
                <button class="btn-action" onclick="saveIssue()">이슈 저장</button>
            </div>
        </div>
    </div>

    <!-- QC 모달 -->
    <div class="modal-overlay" id="qcModal">
        <div class="modal-content">
            <div class="modal-header">QC 검사 정보 설정</div>
            <div class="form-group"><label>검사 대행업체</label><input type="text" id="qcInputCompany" placeholder="예: KATRI"></div>
            <div class="form-group"><label>검사 예정일</label><input type="date" id="qcInputDate"></div>
            <div class="form-group"><label>불량률 (%)</label><input type="text" id="qcInputRate" placeholder="예: 0.8%"></div>
            <div class="form-group"><label>판정</label>
                <select id="qcInputStatus">
                    <option value="WAITING">검사 대기</option>
                    <option value="PASSED">합격 (PASSED)</option>
                    <option value="FAILED">불합격 (FAILED)</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('qcModal')">취소</button>
                <button class="btn-action" onclick="saveQc()">저장</button>
            </div>
        </div>
    </div>

    <!-- 전체 이슈 모달 -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <div class="modal-header">전체 생산 이슈 및 지연 현황</div>
            <div id="alertListContainer" style="max-height: 300px; overflow-y: auto; font-size:12px;"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('alertModal')">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const PROCESS_STEPS = {
            YARN: ['발주', '입고', '편직', '염색', '가공', '검사완료'],
            FABRIC: ['원단발주', '염색/가공', '검단(QC)', '공장입고'],
            TRIM: ['발주', '샘플승인', '본발주', '공장입고']
        };

        let currentTab = 'ACTIVE';
        let expandedStyleId = null; // 아코디언이 펼쳐진 Style ID
        let selectedMaterialId = null;
        let selectedMaterialType = 'FABRIC';
        let selectedFactoryId = null;
        let editingShipmentIndex = null;
        let editingItemId = null;

        const STORAGE_KEY = 'JPROJECT_SCM_DATA_V6';

        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(stylesData)); }
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch(e) {}
            return null;
        }

        let stylesData = [
            {
                id: 1, brand: '스노야', season: '26SS', styleNo: 'ST26001', name: '쫀쫀슬림팬츠', targetDate: '2026-08-25', status: 'ACTIVE',
                materials: [
                    { id: 101, subType: 'YARN', name: '30수 코튼 면사', spec: '면 100%', supplier: '중국 A 방적사', unit: 'kg', totalQty: 5000, currentQty: 5000, processStep: '가공' },
                    { id: 102, subType: 'FABRIC', name: '쫀쫀 스판 원단', spec: '면 95% 스판 5%', supplier: '중국 B 염색공장', unit: 'y', totalQty: 10000, currentQty: 7000, processStep: '검단(QC)' },
                    { id: 201, subType: 'TRIM', name: 'YKK 지퍼 5호', spec: '블랙 / 20cm', supplier: '중국 C 라벨', unit: '개', totalQty: 10000, currentQty: 10000, processStep: '공장입고' }
                ],
                factories: [
                    {
                        id: 301, country: '베트남', name: 'ABCD 공장', totalTarget: 10000,
                        shipments: [{ date: '2026-08-10', qty: 2000, note: '1차 선출고' }, { date: '2026-08-13', qty: 5000, note: '2차 출고' }],
                        issues: ['원단 입고 지연으로 라인 가동 2일 차질 발생']
                    }
                ],
                qcCompany: 'KATRI', qcDate: '2026-08-22', qcRate: '0.8%', qcStatus: 'WAITING'
            }
        ];

        const loaded = loadData();
        if (loaded) stylesData = loaded;

        function switchMainTab(tab) {
            currentTab = tab;
            document.getElementById('tabActive').classList.toggle('active', tab === 'ACTIVE');
            document.getElementById('tabCompleted').classList.toggle('active', tab === 'COMPLETED');
            renderMainList();
        }

        function toggleAccordion(id) {
            expandedStyleId = (expandedStyleId === id) ? null : id;
            renderMainList();
        }

        function renderMainList() {
            const brandFilter = document.getElementById('brandFilter').value;
            const tbody = document.getElementById('styleTableBody');
            tbody.innerHTML = '';

            let activeCount = 0;
            let completedCount = 0;
            let totalAlerts = 0;

            stylesData.forEach(item => {
                if (item.status === 'ACTIVE') activeCount++;
                if (item.status === 'COMPLETED') completedCount++;

                let hasIssue = false;
                if (item.factories) {
                    item.factories.forEach(f => { if(f.issues && f.issues.length > 0) hasIssue = true; });
                }
                if (item.qcStatus === 'FAILED') hasIssue = true;
                if (hasIssue && item.status === 'ACTIVE') totalAlerts++;

                if (item.status !== currentTab) return;
                if (brandFilter !== 'ALL' && item.brand !== brandFilter) return;

                let currentStage = '자재 준비 중';
                if (item.factories && item.factories.length > 0) {
                    const totalShip = item.factories.reduce((acc, f) => acc + (f.shipments ? f.shipments.reduce((sAcc, s) => sAcc + Number(s.qty), 0) : 0), 0);
                    const totalTarget = item.factories.reduce((acc, f) => acc + Number(f.totalTarget), 0);
                    if (totalShip > 0) currentStage = `봉제/출고 중 (${Math.round((totalShip/totalTarget)*100)}%)`;

                                        부자재 관리 (TRIMS)

        function getQcBadgeHtml(status) {
            if (status === 'PASSED') return '<span class="status-badge status-completed">합격 (PASSED)</span>';
            if (status === 'FAILED') return '<span class="status-badge status-danger">불합격 (FAILED)</span>';
            return '<span class="status-badge status-in-progress">검사 대기</span>';
        }

        /* =========================================================
           SUB TABLES RENDER (MATERIALS & SEWING)
           ========================================================= */
        function renderAccordionSubTables(item) {
            const fabricTbody = document.getElementById(`fabricTbody_${item.id}`);
            const trimTbody = document.getElementById(`trimTbody_${item.id}`);
            const sewingTbody = document.getElementById(`sewingTbody_${item.id}`);

            if (fabricTbody) fabricTbody.innerHTML = '';
            if (trimTbody) trimTbody.innerHTML = '';
            if (sewingTbody) sewingTbody.innerHTML = '';

            // 1. 자재 렌더링
            (item.materials || []).forEach(mat => {
                const total = Number(mat.totalQty) || 1;
                const current = Number(mat.currentQty) || 0;
                const pct = Math.min(100, Math.round((current / total) * 100));

                let badgeClass = 'status-danger';
                let statusText = '미입고';
                if (pct >= 100) { badgeClass = 'status-completed'; statusText = '입고 완료'; }
                else if (pct > 0) { badgeClass = 'status-partial'; statusText = `부분 입고 (${pct}%)`; }

                const steps = PROCESS_STEPS[mat.subType] || [];
                let stepHtml = '<div class="step-flow">';
                steps.forEach(st => {
                    const isCurrent = mat.processStep === st;
                    stepHtml += `<span class="step-pill ${isCurrent ? 'current' : ''}">${st}</span>`;
                });
                stepHtml += '</div>';

                const tr = document.createElement('tr');
                if (mat.subType === 'YARN' || mat.subType === 'FABRIC') {
                    const subBadge = mat.subType === 'YARN' 
                        ? '<span style="background:#e0f2fe; color:#0369a1; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:10px;">원사</span>'
                        : '<span style="background:#fef3c7; color:#92400e; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:10px;">원단</span>';

                    tr.innerHTML = `
                        <td>${subBadge}</td>
                        <td><span class="clickable-name" onclick="openMaterialDetailModal(${item.id}, ${mat.id})">${mat.name}</span></td>
                        <td>${mat.spec || '-'}</td>
                        <td>${mat.supplier || '-'}</td>
                        <td>${total.toLocaleString()} ${mat.unit || 'y'}</td>
                        <td><strong>${current.toLocaleString()}</strong> ${mat.unit || 'y'}</td>
                        <td><span class="status-badge ${badgeClass}">${statusText}</span></td>
                        <td>${stepHtml}</td>
                        <td>
                            <div class="action-group">
                                <button class="btn-action" style="font-size:10px; padding:3px 7px; background:var(--blue);" onclick="openPartialInModal(${item.id}, ${mat.id})">+ 입고/공정 기록</button>
                                <button class="btn-secondary" style="font-size:10px; padding:3px 6px;" onclick="openEditItemModal(${item.id}, ${mat.id})">자재정보 수정</button>
                            </div>
                        </td>
                    `;
                    if (fabricTbody) fabricTbody.appendChild(tr);
                } else {
                    tr.innerHTML = `
                        <td><span style="background:#f3e8ff; color:#6b21a8; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:10px;">부자재</span></td>
                        <td><span class="clickable-name" onclick="openMaterialDetailModal(${item.id}, ${mat.id})">${mat.name}</span></td>
                        <td>${mat.supplier || '-'}</td>
                        <td>${total.toLocaleString()} ${mat.unit || '개'}</td>
                        <td><strong>${current.toLocaleString()}</strong> ${mat.unit || '개'}</td>
                        <td><span class="status-badge ${badgeClass}">${statusText}</span></td>
                        <td>${stepHtml}</td>
                        <td>
                            <div class="action-group">
                                <button class="btn-action" style="font-size:10px; padding:3px 7px; background:var(--blue);" onclick="openPartialInModal(${item.id}, ${mat.id})">+ 입고/공정 기록</button>
                                <button class="btn-secondary" style="font-size:10px; padding:3px 6px;" onclick="openEditItemModal(${item.id}, ${mat.id})">자재정보 수정</button>
                            </div>
                        </td>
                    `;
                    if (trimTbody) trimTbody.appendChild(tr);
                }
            });

            // 2. 봉제/출고 렌더링
            (item.factories || []).forEach(fac => {
                const totalTarget = Number(fac.totalTarget) || 1;
                const shipments = fac.shipments || [];
                const totalShip = shipments.reduce((acc, s) => acc + Number(s.qty), 0);
                const pct = Math.min(100, Math.round((totalShip / totalTarget) * 100));

                let badgeClass = 'status-in-progress';
                let statusText = '생산 준비';
                if (pct >= 100) { badgeClass = 'status-completed'; statusText = '출고 완료'; }
                else if (pct > 0) { badgeClass = 'status-partial'; statusText = `분할 출고 중 (${pct}%)`; }

                let shipmentHtml = '';
                shipments.forEach((s, idx) => {
                    shipmentHtml += `
                        <div class="shipment-item">
                            <span><strong>${s.date}</strong> | ${Number(s.qty).toLocaleString()}개 (${s.note || '차수출고'})</span>
                            <div class="shipment-actions">
                                <button class="btn-secondary" style="padding:1px 4px; font-size:9px;" onclick="openEditShipmentModal(${item.id}, ${fac.id}, ${idx})">수정</button>
                                <button class="btn-danger" style="padding:1px 4px; font-size:9px;" onclick="deleteShipment(${item.id}, ${fac.id}, ${idx})">삭제</button>
                            </div>
                        </div>
                    `;
                });

                if (fac.issues) {
                    fac.issues.forEach((iss, iIdx) => {
                        shipmentHtml += `
                            <div class="issue-item">
                                <span>🚨 ${iss}</span>
                                <button class="btn-danger" style="padding:1px 4px; font-size:9px;" onclick="deleteIssue(${item.id}, ${fac.id}, ${iIdx})">삭제</button>
                            </div>
                        `;
                    });
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>[${fac.country}]</strong><br>${fac.name}</td>
                    <td>${totalTarget.toLocaleString()}개</td>
                    <td><strong>${totalShip.toLocaleString()}</strong>개</td>
                    <td><span class="status-badge ${badgeClass}">${statusText}</span></td>
                    <td>${shipmentHtml || '<span style="color:var(--muted); font-size:11px;">출고 내역 없음</span>'}</td>
                    <td>
                        <div class="action-group">
                            <button class="btn-secondary" style="font-size:10px;" onclick="openAddShipmentModal(${item.id}, ${fac.id})">+ 출고 추가</button>
                            <button class="btn-danger" style="font-size:10px;" onclick="openAddIssueModal(${item.id}, ${fac.id})">+ 이슈 등록</button>
                        </div>
                    </td>
                `;
                if (sewingTbody) sewingTbody.appendChild(tr);
            });
        }

        /* =========================================================
           MODAL LOGICS & HANDLERS
           ========================================================= */

        function openTrimOnlyModal(styleId) {

            document.getElementById('newItemSpec').value = '';
            document.getElementById('newItemSupplier').value = '';

        function openEditItemModal(styleId, matId) {
            activeStyleId = styleId;
            editingItemId = matId;
            const item = stylesData.find(s => s.id === styleId);
            const mat = item.materials.find(m => m.id === matId);

            document.getElementById('btnDeleteItem').style.display = 'inline-block';
            document.getElementById('itemModalHeader').innerText = '자재 정보 수정';
            document.getElementById('newItemName').value = mat.name;
            document.getElementById('newItemSpec').value = mat.spec || '';
            document.getElementById('newItemSupplier').value = mat.supplier || '';
            document.getElementById('newItemUnit').value = mat.unit || 'y';
            document.getElementById('newItemTotalQty').value = mat.totalQty;

            document.getElementById('lblOptYarn').style.display = 'flex';
            document.getElementById('lblOptFabric').style.display = 'flex';
            document.getElementById('lblOptTrim').style.display = 'flex';

            const radios = document.getElementsByName('materialType');
            if (mat.subType === 'YARN') radios[0].checked = true;
            else if (mat.subType === 'FABRIC') radios[1].checked = true;
            else radios[2].checked = true;

            toggleMaterialFormFields(mat.subType);
            openModal('itemModal');
        }

        function toggleMaterialFormFields(type) {
            selectedMaterialType = type;
            const fgSpec = document.getElementById('fgSpec');
            const lblName = document.getElementById('lblItemName');
            const lblSupplier = document.getElementById('lblItemSupplier');
            const unitInput = document.getElementById('newItemUnit');

            if (type === 'YARN') {
                lblName.innerText = '원사명';
                lblSupplier.innerText = '방적사/원사 공급업체';
                fgSpec.style.display = 'block';
                if (!unitInput.value || unitInput.value === '개' || unitInput.value === 'y') unitInput.value = 'kg';
            } else if (type === 'FABRIC') {
                lblName.innerText = '원단명';
                lblSupplier.innerText = '원단/염색 공장명';
                fgSpec.style.display = 'block';
                if (!unitInput.value || unitInput.value === '개' || unitInput.value === 'kg') unitInput.value = 'y';
            } else {
                lblName.innerText = '부자재명 (라벨/지퍼/단추 등)';
                lblSupplier.innerText = '부자재 공급업체';
                fgSpec.style.display = 'none';
                if (!unitInput.value || unitInput.value === 'kg' || unitInput.value === 'y') unitInput.value = '개';
            }
        }

        function saveNewItem() {
            const item = stylesData.find(s => s.id === activeStyleId);
            const name = document.getElementById('newItemName').value.trim();
            const spec = document.getElementById('newItemSpec').value.trim();
            const supplier = document.getElementById('newItemSupplier').value.trim();
            const unit = document.getElementById('newItemUnit').value.trim() || 'y';
            const totalQty = Number(document.getElementById('newItemTotalQty').value) || 0;

            if (!name) { alert('자재명을 입력해 주세요.'); return; }
            if (!item.materials) item.materials = [];

            if (editingItemId) {
                const mat = item.materials.find(m => m.id === editingItemId);
                if (mat) {
                    mat.subType = selectedMaterialType;
                    mat.name = name;
                    mat.spec = spec;
                    mat.supplier = supplier;
                    mat.unit = unit;
                    mat.totalQty = totalQty;
                }
            } else {
                item.materials.push({
                    id: Date.now(), subType: selectedMaterialType, name, spec, supplier, unit, totalQty, currentQty: 0,
                    processStep: PROCESS_STEPS[selectedMaterialType][0]
                });
            }

            saveData();
            closeModal('itemModal');
            renderMainList();
        }

        function deleteCurrentItem() {
            if (!editingItemId || !confirm('이 자재 항목을 삭제하시겠습니까?')) return;
            const item = stylesData.find(s => s.id === activeStyleId);
            item.materials = item.materials.filter(m => m.id !== editingItemId);
            saveData();
            closeModal('itemModal');
            renderMainList();
        }

        function openPartialInModal(styleId, matId) {
            activeStyleId = styleId;
            selectedMaterialId = matId;
            const item = stylesData.find(s => s.id === styleId);
            const mat = item.materials.find(m => m.id === matId);

            document.getElementById('partialInQty').value = mat.currentQty;
            const processSelect = document.getElementById('itemProcessStep');
            processSelect.innerHTML = '';
            (PROCESS_STEPS[mat.subType] || []).forEach(st => {
                const opt = document.createElement('option');
                opt.value = st; opt.innerText = st;
                if (mat.processStep === st) opt.selected = true;
                processSelect.appendChild(opt);
            });

            openModal('partialInModal');
        }

        function savePartialIn() {
            const item = stylesData.find(s => s.id === activeStyleId);
            const mat = item.materials.find(m => m.id === selectedMaterialId);
            mat.currentQty = Number(document.getElementById('partialInQty').value) || 0;
            mat.processStep = document.getElementById('itemProcessStep').value;

            saveData();
            closeModal('partialInModal');
            renderMainList();
        }

        function openMaterialDetailModal(styleId, matId) {
            const item = stylesData.find(s => s.id === styleId);
            const mat = item.materials.find(m => m.id === matId);

            const total = Number(mat.totalQty) || 1;
            const current = Number(mat.currentQty) || 0;
            const pct = Math.min(100, Math.round((current / total) * 100));

            let typeTitle = mat.subType === 'YARN' ? '[원사]' : (mat.subType === 'FABRIC' ? '[원단]' : '[부자재]');
            document.getElementById('mdName').innerText = `${typeTitle} ${mat.name}`;
            document.getElementById('mdSpec').innerText = mat.spec || '규격 정보 없음';
            document.getElementById('mdSupplier').innerText = mat.supplier || '공급처 정보 없음';
            document.getElementById('mdQtyInfo').innerText = `${current.toLocaleString()} / ${total.toLocaleString()} ${mat.unit} (${pct}% 입고 달성)`;
            document.getElementById('mdStep').innerText = mat.processStep || '진행 정보 없음';

            openModal('materialDetailModal');
        }

        /* 봉제 공장 및 출고/이슈 핸들러 */
        function openSewingFactoryModal(styleId) {
            activeStyleId = styleId;
            document.getElementById('newFacCountry').value = '';
            document.getElementById('newFacName').value = '';
            document.getElementById('newFacTarget').value = '';
            openModal('sewingModal');
        }

        function saveNewSewingFactory() {
            const item = stylesData.find(s => s.id === activeStyleId);
            const country = document.getElementById('newFacCountry').value.trim();
            const name = document.getElementById('newFacName').value.trim();
            const target = Number(document.getElementById('newFacTarget').value) || 0;

            if (!name) return;
            if (!item.factories) item.factories = [];

            item.factories.push({ id: Date.now(), country: country || '국내', name, totalTarget: target, shipments: [], issues: [] });
            saveData();
            closeModal('sewingModal');
            renderMainList();
        }

        function openAddShipmentModal(styleId, facId) {
            activeStyleId = styleId;
            selectedFactoryId = facId;
            editingShipmentIndex = null;
            document.getElementById('shipmentModalHeader').innerText = '완제품 출고 등록';
            document.getElementById('shipmentDate').value = new Date().toISOString().substring(0,10);
            document.getElementById('shipmentQty').value = '';
            document.getElementById('shipmentNote').value = '';
            openModal('shipmentModal');
        }

        function openEditShipmentModal(styleId, facId, idx) {
            activeStyleId = styleId;
            selectedFactoryId = facId;
            editingShipmentIndex = idx;
            const item = stylesData.find(s => s.id === styleId);
            const fac = item.factories.find(f => f.id === facId);
            const ship = fac.shipments[idx];

            document.getElementById('shipmentModalHeader').innerText = '완제품 출고 수정';
            document.getElementById('shipmentDate').value = ship.date;
            document.getElementById('shipmentQty').value = ship.qty;
            document.getElementById('shipmentNote').value = ship.note;
            openModal('shipmentModal');
        }

        function saveShipment() {
            const item = stylesData.find(s => s.id === activeStyleId);
            const fac = item.factories.find(f => f.id === selectedFactoryId);
            const date = document.getElementById('shipmentDate').value;
            const qty = Number(document.getElementById('shipmentQty').value) || 0;
            const note = document.getElementById('shipmentNote').value.trim();

            if (!date || qty <= 0) return;

            if (editingShipmentIndex !== null) fac.shipments[editingShipmentIndex] = { date, qty, note };
            else { if (!fac.shipments) fac.shipments = []; fac.shipments.push({ date, qty, note }); }

            saveData();
            closeModal('shipmentModal');
            renderMainList();
        }

        function deleteShipment(styleId, facId, idx) {
            if (!confirm('출고 기록을 삭제하시겠습니까?')) return;
            const item = stylesData.find(s => s.id === styleId);
            const fac = item.factories.find(f => f.id === facId);
            fac.shipments.splice(idx, 1);
            saveData();
            renderMainList();
        }

        function openAddIssueModal(styleId, facId) {
            activeStyleId = styleId;
            selectedFactoryId = facId;
            document.getElementById('issueText').value = '';
            openModal('issueModal');
        }

        function saveIssue() {
            const item = stylesData.find(s => s.id === activeStyleId);
            const fac = item.factories.find(f => f.id === selectedFactoryId);
            const text = document.getElementById('issueText').value.trim();
            if (!text) return;

            if (!fac.issues) fac.issues = [];
            fac.issues.push(text);
            saveData();
            closeModal('issueModal');
            renderMainList();
        }

        function deleteIssue(styleId, facId, idx) {
            const item = stylesData.find(s => s.id === styleId);
            const fac = item.factories.find(f => f.id === facId);
            fac.issues.splice(idx, 1);
            saveData();
            renderMainList();
        }

        /* QC 및 Style 제어 */
        function openQcModal(styleId) {
            activeStyleId = styleId;
            const item = stylesData.find(s => s.id === styleId);
            document.getElementById('qcInputCompany').value = item.qcCompany || '';
            document.getElementById('qcInputDate').value = item.qcDate || '';
            document.getElementById('qcInputRate').value = item.qcRate || '';
            document.getElementById('qcInputStatus').value = item.qcStatus || 'WAITING';
            openModal('qcModal');
        }

        function saveQc() {
            const item = stylesData.find(s => s.id === activeStyleId);
            item.qcCompany = document.getElementById('qcInputCompany').value.trim();
            item.qcDate = document.getElementById('qcInputDate').value;
            item.qcRate = document.getElementById('qcInputRate').value.trim();
            item.qcStatus = document.getElementById('qcInputStatus').value;

            saveData();
            closeModal('qcModal');
            renderMainList();
        }

        function openStyleModal() {
            document.getElementById('newStyleNo').value = '';
            document.getElementById('newStyleName').value = '';
            document.getElementById('newTargetDate').value = '';
            openModal('styleModal');
        }

        function saveNewStyle() {
            const brand = document.getElementById('newBrand').value;
            const season = document.getElementById('newSeason').value.trim();
            const styleNo = document.getElementById('newStyleNo').value.trim();
            const name = document.getElementById('newStyleName').value.trim();
            const targetDate = document.getElementById('newTargetDate').value;

            if (!styleNo || !name) return;

            stylesData.push({
                id: Date.now(), brand, season, styleNo, name, targetDate, status: 'ACTIVE',
                materials: [], factories: [], qcCompany: '', qcDate: '', qcRate: '', qcStatus: 'WAITING'
            });

            saveData();
            closeModal('styleModal');
            renderMainList();
        }

        function tryCompleteStyle(id) {
            const item = stylesData.find(s => s.id === id);
            item.status = (item.status === 'ACTIVE') ? 'COMPLETED' : 'ACTIVE';
            saveData();
            renderMainList();
        }

        function openAlertModal() {
            const container = document.getElementById('alertListContainer');
            container.innerHTML = '';
            let count = 0;

            stylesData.forEach(s => {
                if (s.status !== 'ACTIVE') return;
                let issuesList = [];
                if (s.factories) {
                    s.factories.forEach(f => {
                        if (f.issues) f.issues.forEach(i => issuesList.push(`[${f.name}] ${i}`));
                    });
                }
                if (s.qcStatus === 'FAILED') issuesList.push(`[QC] 불합격 (FAILED)`);

                if (issuesList.length > 0) {
                    count++;
                    const div = document.createElement('div');
                    div.style.cssText = 'background:#fff3f3; border:1px solid #f87171; padding:8px 10px; border-radius:8px; margin-bottom:6px; cursor:pointer;';
                    div.onclick = () => { closeModal('alertModal'); expandedStyleId = s.id; renderMainList(); };
                    div.innerHTML = `
                        <div style="font-weight:bold; color:#991b1b; margin-bottom:2px;">${s.brand} | ${s.styleNo} - ${s.name}</div>
                        ${issuesList.map(i => `<div style="color:#b91c1c; font-size:11px;">• ${i}</div>`).join('')}
                    `;
                    container.appendChild(div);
                }
            });

            if (count === 0) container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">현재 지연 및 이슈 항목이 없습니다.</div>';
            openModal('alertModal');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // INIT
        renderMainList();
    </script>
</body>
</html>
