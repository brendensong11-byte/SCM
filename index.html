<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPROJECT SCM System</title>
    <style>
        /* =========================================================
           JPROJECT SCM — DESIGN SYSTEM (PRACTICAL REAL WORK)
           ========================================================= */
        :root {
            --bg:#f4f7fa; --card:#ffffff; --navy:#17324a; --blue:#315f86; 
            --blue-soft:#edf4f9; --line:#d9e2ea; --line-soft:#e9eef3; --text:#17212b; 
            --muted:#718096; --green:#46705c; --green-soft:#eff6f1; --amber:#916f32; 
            --amber-soft:#fbf7ed; --red:#a84c4c; --red-soft:#fff3f3; 
            --shadow:0 8px 24px rgba(24,50,75,.06);
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
        body{background:var(--bg);color:var(--text);line-height:1.5;padding:22px;font-size:13px}
        .container{max-width:1550px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
        header{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px;gap:16px}
        .logo{font-size:21px;font-weight:850;color:var(--navy);letter-spacing:-.6px}.logo span{color:var(--blue);font-weight:500;margin-left:5px}
        .brand-select{padding:9px 12px;border:1px solid #b9c7d4;border-radius:8px;background:#fff;color:var(--navy);font-weight:700;outline:none}
        
        /* 알림 바 */
        .alert-bar{display:none; background:#fff8f8;border:1px solid #e8caca;border-radius:99px;padding:11px 15px;margin-bottom:18px;justify-content:space-between;align-items:center;cursor:pointer;transition:.15s}.alert-bar:hover{background:var(--red-soft)}
        .alert-title{color:var(--red);font-weight:750;display:flex;align-items:center;gap:8px}.alert-badge{background:var(--red);color:#fff;padding:3px 7px;border-radius:999px;font-size:10px}
        
        .nav-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);align-items:flex-end}
        .tab-btn{padding:10px 15px;border:1px solid transparent;border-bottom:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;border-radius:8px 8px 0 0}
        .tab-btn.active{color:var(--navy);background:var(--blue-soft);border-color:var(--line);border-bottom-color:var(--blue-soft)}
        .tab-btn .badge{background:#f2f5f8;color:var(--muted);padding:2px 7px;border-radius:999px;font-size:10px;margin-left:5px}
        .tab-btn.active .badge{background:var(--navy);color:#fff}
        
        .btn-action,.btn-secondary,.btn-danger,.btn-disabled{border-radius:7px;font-weight:750;cursor:pointer;transition:.15s}
        .btn-action{background:var(--navy);color:#fff;border:1px solid var(--navy);padding:8px 12px;font-size:12px}.btn-action:hover{background:#24465f}
        .btn-secondary{background:#fff;color:var(--navy);border:1px solid #bdcad6;padding:6px 10px;font-size:11px}.btn-secondary:hover{background:var(--blue-soft);border-color:#91acc1}
        .btn-danger{background:#fff;color:var(--red);border:1px solid #d8a9a9;padding:5px 9px;font-size:11px}.btn-danger:hover{background:var(--red-soft)}
        .btn-disabled{background:#e2e8f0;color:#94a3b8;border:1px solid #cbd5e1;padding:8px 12px;font-size:12px;cursor:not-allowed;}

        .table-container{overflow-x:auto;border:1px solid var(--line);border-radius:9px;margin-bottom:10px}
        table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
        th{background:#f8fafc;color:#607184;font-weight:750;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px;letter-spacing:.2px}
        td{padding:11px 12px;border-bottom:1px solid var(--line-soft);color:#263746;vertical-align:middle}
        
        .accordion-row{cursor:pointer;transition:background .15s}.accordion-row:hover{background:var(--blue-soft)}
        .accordion-row.expanded{background:#edf4f9;font-weight:bold}
        .accordion-content-td{padding:0!important;border-bottom:2px solid var(--blue)}
        .accordion-box{background:#f8fafc;padding:20px;border-top:1px solid var(--line)}

        .status-badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
        .status-completed{background:var(--green-soft);color:var(--green);border:1px solid #bdd2c3}
        .status-danger{background:var(--red-soft);color:var(--red);border:1px solid #e4bcbc}

        .section-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px;margin-bottom:16px;box-shadow:0 3px 10px rgba(24,50,75,.025)}
        .section-title{font-size:13px;font-weight:850;color:var(--navy);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line-soft);padding-bottom:8px}
        
        /* 3단계 파이프라인 스텝바 */
        .pipeline-bar{display:flex;background:#f0f4f8;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px;justify-content:space-between;align-items:center}
        .pipe-step{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted)}
        .pipe-step.active{color:var(--navy)}
        .pipe-step.completed{color:var(--green)}
        .pipe-num{width:24px;height:24px;border-radius:50%;background:#cbd5e1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
        .pipe-step.active .pipe-num{background:var(--navy)}
        .pipe-step.completed .pipe-num{background:var(--green)}

        .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
        .info-item label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:750}
        .info-item span{font-weight:800;color:var(--navy);font-size:13px}

        .action-group{display:flex;gap:5px;align-items:center;justify-content:flex-start;flex-wrap:wrap}
        .shipment-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fbfcfd;border:1px solid var(--line-soft);padding:6px 8px;margin-bottom:4px;border-radius:6px}
        .shipment-actions{display:flex;gap:4px;white-space:nowrap}
        .issue-item{font-size:11px;color:var(--red);margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--red-soft);padding:5px 8px;border-radius:6px;border:1px solid #f0d6d6}
        
        /* 모달 시스템 */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(16,31,45,.48);justify-content:center;align-items:center;z-index:1000;padding:18px}
        .modal-content{background:#fff;padding:22px;border-radius:12px;width:100%;max-width:620px;border:1px solid var(--line);box-shadow:0 18px 45px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
        .modal-header{font-size:15px;font-weight:850;margin-bottom:15px;display:flex;justify-content:space-between;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:10px}
        .form-group{margin-bottom:12px}.form-group label{display:block;font-size:11px;font-weight:800;margin-bottom:5px;color:#425466}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 10px;border:1px solid #c3d0dc;border-radius:7px;font-size:13px;outline:none;background:#fff}
        .modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
        
        .step-flow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:10px;color:var(--muted)}
        .step-pill{padding:2px 6px;border-radius:4px;background:#f0f4f8;border:1px solid var(--line-soft)}
        .step-pill.current{background:var(--navy);color:#fff;font-weight:bold}
        
        .clickable-name{color:var(--navy);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.clickable-name:hover{color:var(--blue)}
        
        /* Color x Size SKU 매트릭스 UI */
        .matrix-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
        .matrix-table th, .matrix-table td{border:1px solid var(--line);padding:6px;text-align:center}
        .matrix-table th{background:#f1f5f9;font-weight:bold}
        .matrix-input{width:100%;text-align:center;padding:4px;border:1px solid #cbd5e1;border-radius:4px}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">JPROJECT <span>SCM</span></div>
            <div>
                <select class="brand-select" id="brandFilter" onchange="renderMainList()">
                    <option value="ALL">전체 브랜드</option>
                    <option value="스노야">스노야</option>
                    <option value="모브온">모브온</option>
                </select>
            </div>
        </header>

        <!-- 알림 바 -->
        <div class="alert-bar" id="alertBar" onclick="openAlertModal()">
            <div class="alert-title">
                <span class="alert-badge" id="alertCountBadge">0건</span> <span id="alertSummaryText">일정 및 이슈 확인 필요</span>
            </div>
            <span style="font-size:12px; color:#7f1d1d; text-decoration: underline;">클릭하여 이슈/일정 세부사항 확인 →</span>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" id="tabActive" onclick="switchMainTab('ACTIVE')">
                진행 중 <span class="badge" id="countActive">0</span>
            </button>
            <button class="tab-btn" id="tabCompleted" onclick="switchMainTab('COMPLETED')">
                완료 (보관함) <span class="badge" id="countCompleted">0</span>
            </button>
            <div style="margin-left: auto;">
                <button class="btn-action" onclick="openStyleModal()">+ 신규 STYLE 등록</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px;"></th>
                        <th>브랜드</th>
                        <th>시즌</th>
                        <th>Style No.</th>
                        <th>상품명</th>
                        <th>현재 진행 단계</th>
                        <th>목표일 (D-Day)</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody id="styleTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- [모달 모음] -->
    
    <!-- 1. 신규 Style 등록 모달 -->
    <div class="modal-overlay" id="styleModal">
        <div class="modal-content">
            <div class="modal-header">신규 Style 등록</div>
            <div class="form-group"><label>브랜드</label><select id="newBrand"><option value="스노야">스노야</option><option value="모브온">모브온</option></select></div>
            <div class="form-group"><label>시즌</label><input type="text" id="newSeason" value="26SS"></div>
            <div class="form-group"><label>Style No.</label><input type="text" id="newStyleNo" placeholder="예: ST26002"></div>
            <div class="form-group"><label>상품명</label><input type="text" id="newStyleName" placeholder="예: 데일리 슬림 와이드 팬츠"></div>
            <div class="form-group"><label>목표 납기일</label><input type="date" id="newTargetDate"></div>
            
            <div class="form-group"><label>운영 사이즈 규격 (쉼표 구분)</label><input type="text" id="newSizeOptions" value="55, 66, 77" placeholder="예: 55, 66, 77 또는 S, M, L, FREE"></div>
            <div class="form-group"><label>운영 컬러 목록 (쉼표 구분)</label><input type="text" id="newColorOptions" value="블랙, 화이트, 브라운" placeholder="예: 블랙, 화이트, 브라운"></div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('styleModal')">취소</button>
                <button class="btn-action" onclick="saveNewStyle()">등록</button>
            </div>
        </div>
    </div>

    <!-- 2. 자재(원사/원단/부자재) 등록 및 상세 오더 관리 모달 -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal-content">
            <div class="modal-header" id="itemModalHeader">자재 정보 및 실무 오더 관리</div>
            
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;"><label>자재 구분</label>
                    <select id="newItemType" onchange="toggleMaterialTypeForm()">
                        <option value="YARN">원사</option>
                        <option value="FABRIC">원단</option>
                        <option value="TRIM">부자재</option>
                    </select>
                </div>
                <div class="form-group" style="flex:2;"><label id="lblItemName">품목/자재명</label><input type="text" id="newItemName" placeholder="예: YKK 지퍼 5호 / 30수 면사"></div>
            </div>

            <div class="form-group" id="fgSpec"><label>규격 / 혼용률</label><input type="text" id="newItemSpec" placeholder="예: 면 95% 스판 5%"></div>
            <div class="form-group"><label>공급/제조 업체명</label><input type="text" id="newItemSupplier" placeholder="예: 중국 C 라벨 / A 방적사"></div>

            <!-- 실무 계약 날짜 정보 -->
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
                <div class="form-group"><label>주문일 (발주일)</label><input type="date" id="newItemOrderDate"></div>
                <div class="form-group"><label>송금일 (결제일)</label><input type="date" id="newItemPayDate"></div>
                <div class="form-group"><label>약속 납기일 (계약)</label><input type="date" id="newItemPromisedDate"></div>
            </div>

            <div class="form-group"><label>지정 입고 공장</label><input type="text" id="newItemTargetFactory" placeholder="예: 베트남 ABCD 공장"></div>

            <!-- Color x Size SKU 수량 설정 -->
            <div class="form-group">
                <label style="display:flex; justify-content:space-between; align-items:center;">
                    <span>컬러 & 사이즈별 오더 수량 설정 (SKU Matrix)</span>
                    <span style="font-size:10px; color:var(--blue);" id="matrixTotalSum">총 발주량: 0</span>
                </label>
                <div id="matrixContainer" style="max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; padding:6px; background:#fafbfc;"></div>
            </div>

            <div class="form-group"><label>단위</label><input type="text" id="newItemUnit" value="개" placeholder="개, y, kg"></div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('itemModal')">취소</button>
                <button class="btn-danger" id="btnDeleteItem" style="display:none; margin-right:auto;" onclick="deleteCurrentItem()">삭제</button>
                <button class="btn-action" onclick="saveNewItem()">저장</button>
            </div>
        </div>
    </div>

    <!-- 3. 자재 세부 클릭 상세 모달 (주문/송금/약속일/지연이슈/분할입고) -->
    <div class="modal-overlay" id="materialDetailModal">
        <div class="modal-content">
            <div class="modal-header">자재 실무 세부 정보 및 입고 히스토리</div>
            <div style="font-size:12px; line-height:1.7;">
                <div class="form-group"><label>구분 / 자재명</label><div id="mdName" style="font-weight:bold; font-size:15px; color:var(--navy);">-</div></div>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; background:#f8fafc; padding:10px; border-radius:8px; margin-bottom:12px; border:1px solid var(--line);">
                    <div><label style="font-size:10px; color:var(--muted);">주문일 (발주일)</label><div id="mdOrderDate" style="font-weight:bold;">-</div></div>
                    <div><label style="font-size:10px; color:var(--muted);">송금일 (결제일)</label><div id="mdPayDate" style="font-weight:bold;">-</div></div>
                    <div><label style="font-size:10px; color:var(--muted);">약속 납기일</label><div id="mdPromisedDate" style="font-weight:bold; color:var(--amber);">-</div></div>
                </div>
                <div class="form-group"><label>지정 입고 공장</label><div id="mdTargetFactory" style="font-weight:bold; color:var(--navy);">-</div></div>
                <div class="form-group"><label>발주 수량 / 누적 입고량</label><div id="mdQtyInfo" style="font-weight:bold; color:var(--blue); font-size:13px;">-</div></div>
                <div class="form-group"><label>컬러 x 사이즈별 오더 및 입고 현황</label><div id="mdMatrixView" style="font-size:11px;">-</div></div>
                <div class="form-group"><label>납기 연기 및 발생 이슈 히스토리</label><div id="mdIssueHistory" style="font-size:11px; color:var(--red);">-</div></div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('materialDetailModal')">닫기</button>
            </div>
        </div>
    </div>

    <!-- 4. 입고 / 공정 기록 모달 -->
    <div class="modal-overlay" id="partialInModal">
        <div class="modal-content">
            <div class="modal-header">분할 입고 수량 및 현재 공정 기록</div>
            <div class="form-group"><label>누적 실제 입고 수량</label><input type="number" id="partialInQty" placeholder="예: 8000"></div>
            <div class="form-group"><label>현재 진행 중인 세부 공정</label><select id="itemProcessStep"></select></div>
            <div class="form-group"><label>납기 변경/이슈 발생 시 사유 입력</label><textarea id="partialInIssue" rows="2" placeholder="예: 원사 공급 지연으로 2차 잔여분 2일 연기 합의"></textarea></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('partialInModal')">취소</button>
                <button class="btn-action" onclick="savePartialIn()">기록 저장</button>
            </div>
        </div>
    </div>

    <!-- 5. 봉제 공장 모달 -->
    <div class="modal-overlay" id="sewingModal">
        <div class="modal-content">
            <div class="modal-header">봉제 공장 추가</div>
            <div class="form-group"><label>국가</label><input type="text" id="newFacCountry" placeholder="예: 베트남"></div>
            <div class="form-group"><label>공장명</label><input type="text" id="newFacName" placeholder="예: ABCD 공장"></div>
            <div class="form-group"><label>목표 생산 수량</label><input type="number" id="newFacTarget" placeholder="10000"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('sewingModal')">취소</button>
                <button class="btn-action" onclick="saveNewSewingFactory()">등록</button>
            </div>
        </div>
    </div>

    <!-- 6. 출고 모달 -->
    <div class="modal-overlay" id="shipmentModal">
        <div class="modal-content">
            <div class="modal-header" id="shipmentModalHeader">완제품 분할 출고 등록</div>
            <div class="form-group"><label>출고 일자</label><input type="date" id="shipmentDate"></div>
            <div class="form-group"><label>출고 수량</label><input type="number" id="shipmentQty" placeholder="예: 2000"></div>
            <div class="form-group"><label>비고/차수</label><input type="text" id="shipmentNote" placeholder="예: 1차 선출고"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('shipmentModal')">취소</button>
                <button class="btn-action" onclick="saveShipment()">저장</button>
            </div>
        </div>
    </div>

    <!-- 7. 이슈 모달 -->
    <div class="modal-overlay" id="issueModal">
        <div class="modal-content">
            <div class="modal-header">봉제/생산 이슈 등록</div>
            <div class="form-group"><label>이슈 내용</label><textarea id="issueText" rows="3" placeholder="예: 라인 가동 2일 지연 발생"></textarea></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('issueModal')">취소</button>
                <button class="btn-action" onclick="saveIssue()">이슈 저장</button>
            </div>
        </div>
    </div>

    <!-- 8. QC 모달 -->
    <div class="modal-overlay" id="qcModal">
        <div class="modal-content">
            <div class="modal-header">QC (품질 검사) 설정</div>
            <div class="form-group"><label>검사 대행업체</label><input type="text" id="qcInputCompany" placeholder="예: KATRI / FITI"></div>
            <div class="form-group"><label>검사 예정/완료일</label><input type="date" id="qcInputDate"></div>
            <div class="form-group"><label>불량률 (%)</label><input type="text" id="qcInputRate" placeholder="예: 0.5%"></div>
            <div class="form-group"><label>최종 QC 판정</label>
                <select id="qcInputStatus">
                    <option value="WAITING">검사 진행/대기 중</option>
                    <option value="PASSED">합격 (PASSED)</option>
                    <option value="FAILED">불합격 (FAILED)</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('qcModal')">취소</button>
                <button class="btn-action" onclick="saveQc()">저장</button>
            </div>
        </div>
    </div>

    <!-- 9. 알림 모달 -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <div class="modal-header">생산 이슈 및 D-Day 일정 알림 현황</div>
            <div id="alertListContainer" style="max-height: 350px; overflow-y: auto; font-size:12px;"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('alertModal')">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const PROCESS_STEPS = {
            YARN: ['발주', '입고', '편직', '염색', '가공', '검사완료'],
            FABRIC: ['원단발주', '염색/가공', '검단(QC)', '공장입고'],
            TRIM: ['발주', '샘플승인', '본발주', '공장입고']
        };

        let currentTab = 'ACTIVE';
        let expandedStyleId = null;
        let activeStyleId = null;
        let selectedMaterialId = null;
        let selectedFactoryId = null;
        let editingShipmentIndex = null;
        let editingItemId = null;

        const STORAGE_KEY = 'JPROJECT_SCM_DATA_REAL_V10';

        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(stylesData)); }
        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch(e) {}
            return null;
        }

        let stylesData = [
            {
                id: 1, brand: '스노야', season: '26SS', styleNo: 'ST26001', name: '쫀쫀슬림팬츠', targetDate: '2026-08-25', status: 'ACTIVE',
                sizes: ['55', '66', '77'],
                colors: ['블랙', '화이트', '브라운'],
                materials: [
                    { 
                        id: 101, subType: 'YARN', name: '30수 코튼 면사', spec: '면 100%', supplier: '중국 A 방적사', unit: 'kg', totalQty: 5000, currentQty: 5000, processStep: '검사완료',
                        orderDate: '2026-07-01', payDate: '2026-07-03', promisedDate: '2026-07-20', targetFactory: '중국 B 염색공장', issues: []
                    },
                    { 
                        id: 102, subType: 'FABRIC', name: '쫀쫀 스판 원단', spec: '면 95% 스판 5%', supplier: '중국 B 염색공장', unit: 'y', totalQty: 10000, currentQty: 10000, processStep: '공장입고',
                        orderDate: '2026-07-10', payDate: '2026-07-12', promisedDate: '2026-08-05', targetFactory: '베트남 ABCD 공장', issues: ['[08/01 지연] 염색 착색 지연으로 3일 순연']
                    },
                    { 
                        id: 201, subType: 'TRIM', name: 'YKK 지퍼 5호', spec: '블랙 / 20cm', supplier: '중국 C 라벨', unit: '개', totalQty: 10000, currentQty: 10000, processStep: '공장입고',
                        orderDate: '2026-07-15', payDate: '2026-07-16', promisedDate: '2026-08-10', targetFactory: '베트남 ABCD 공장', issues: []
                    }
                ],
                factories: [
                    {
                        id: 301, country: '베트남', name: 'ABCD 공장', totalTarget: 10000,
                        shipments: [{ date: '2026-08-10', qty: 3000, note: '1차 선출고' }, { date: '2026-08-13', qty: 7000, note: '2차 전량출고' }],
                        issues: []
                    }
                ],
                qcCompany: 'KATRI', qcDate: '2026-08-14', qcRate: '0.4%', qcStatus: 'PASSED'
            }
        ];

        const loaded = loadData();
        if (loaded) stylesData = loaded;

        function getDDay(targetDateStr) {
            if (!targetDateStr) return null;
            const today = new Date(); today.setHours(0,0,0,0);
            const target = new Date(targetDateStr); target.setHours(0,0,0,0);
            return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        }

        function switchMainTab(tab) {
            currentTab = tab;
            document.getElementById('tabActive').classList.toggle('active', tab === 'ACTIVE');
            document.getElementById('tabCompleted').classList.toggle('active', tab === 'COMPLETED');
            renderMainList();
        }

        function toggleAccordion(id) {
            expandedStyleId = (expandedStyleId === id) ? null : id;
            renderMainList();
        }

        // 스마트 완료 조건 체킹 함수
        function checkStyleReadiness(item) {
            let isMaterialDone = true;
            (item.materials || []).forEach(m => {
                const steps = PROCESS_STEPS[m.subType] || [];
                const lastStep = steps[steps.length - 1];
                if ((Number(m.currentQty) < Number(m.totalQty)) || (m.processStep !== lastStep)) {
                    isMaterialDone = false;
                }
            });

            let isSewingDone = true;
            if (!item.factories || item.factories.length === 0) isSewingDone = false;
            else {
                item.factories.forEach(f => {
                    const totalShip = (f.shipments || []).reduce((acc, s) => acc + Number(s.qty), 0);
                    if (totalShip < Number(f.totalTarget)) isSewingDone = false;
                });
            }

            const isQcPassed = (item.qcStatus === 'PASSED');

            return { isMaterialDone, isSewingDone, isQcPassed, canComplete: (isMaterialDone && isSewingDone && isQcPassed) };
        }

        function renderMainList() {
            const brandFilter = document.getElementById('brandFilter').value;
            const tbody = document.getElementById('styleTableBody');
            tbody.innerHTML = '';

            let activeCount = 0;
            let completedCount = 0;
            let globalAlerts = [];

            stylesData.forEach(item => {
                if (item.status === 'ACTIVE') activeCount++;
                if (item.status === 'COMPLETED') completedCount++;

                const dday = getDDay(item.targetDate);
                let itemIssues = [];

                if (item.status === 'ACTIVE') {
                    if (dday !== null && dday <= 5) {
                        if (dday < 0) itemIssues.push(`[목표일 초과] 목표 납기일(${item.targetDate})이 ${Math.abs(dday)}일 지났습니다.`);
                        else if (dday === 0) itemIssues.push(`[D-Day 오늘] 오늘이 목표 납기일입니다!`);
                        else itemIssues.push(`[일정 임박] 목표 납기일(${item.targetDate})까지 ${dday}일 남았습니다.`);
                    }
                    (item.factories || []).forEach(f => {
                        (f.issues || []).forEach(iss => itemIssues.push(`[공장이슈-${f.name}] ${iss}`));
                    });
                    if (item.qcStatus === 'FAILED') itemIssues.push(`[QC 불합격] 품질 검사 FAILED 판정`);
                }

                if (itemIssues.length > 0) globalAlerts.push({ style: item, issues: itemIssues });

                if (item.status !== currentTab) return;
                if (brandFilter !== 'ALL' && item.brand !== brandFilter) return;

                const readiness = checkStyleReadiness(item);
                let currentStage = '1단계: 자재 및 생산 진행 중';
                if (readiness.isMaterialDone && readiness.isSewingDone) {
                    currentStage = readiness.isQcPassed ? '3단계: 완료 대기 중 (QC 통과)' : '2단계: QC 품질 검사 진행 중';
                }

                const isExpanded = (expandedStyleId === item.id);
                const hasIssue = itemIssues.length > 0;

                let ddayText = item.targetDate || '-';
                if (dday !== null) {
                    if (dday === 0) ddayText += ' <b style="color:red;">(D-Day)</b>';
                    else if (dday < 0) ddayText += ` <b style="color:red;">(D+${Math.abs(dday)})</b>`;
                    else if (dday <= 5) ddayText += ` <b style="color:var(--amber);">(D-${dday})</b>`;
                    else ddayText += ` (D-${dday})`;
                }

                const tr = document.createElement('tr');
                tr.className = `accordion-row ${isExpanded ? 'expanded' : ''}`;
                tr.onclick = () => toggleAccordion(item.id);
                tr.innerHTML = `
                    <td style="text-align:center; font-weight:bold; color:var(--blue);">${isExpanded ? '▲' : '▼'}</td>
                    <td><strong>${item.brand}</strong></td>
                    <td>${item.season}</td>
                    <td><span style="color:var(--blue); font-weight:700;">${item.styleNo}</span></td>
                    <td><strong>${item.name}</strong></td>
                    <td>${currentStage}</td>
                    <td>${ddayText}</td>
                    <td>
                        <span class="status-badge ${item.status === 'ACTIVE' ? (hasIssue ? 'status-danger' : 'status-in-progress') : 'status-completed'}">
                            ${item.status === 'ACTIVE' ? (hasIssue ? '점검/이슈' : '진행 중') : '완료 (보관함)'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);

                if (isExpanded) {
                    const detailTr = document.createElement('tr');
                    detailTr.innerHTML = `
                        <td colspan="8" class="accordion-content-td">
                            <div class="accordion-box">
                                
                                <!-- 3단계 파이프라인 프로그레스 바 -->
                                <div class="pipeline-bar">
                                    <div class="pipe-step ${readiness.isMaterialDone && readiness.isSewingDone ? 'completed' : 'active'}">
                                        <div class="pipe-num">1</div>
                                        <span>자재 입고 & 완제품 출고 (${readiness.isMaterialDone && readiness.isSewingDone ? '완료' : '진행중'})</span>
                                    </div>
                                    <span>➔</span>
                                    <div class="pipe-step ${!readiness.isMaterialDone || !readiness.isSewingDone ? '' : (readiness.isQcPassed ? 'completed' : 'active')}">
                                        <div class="pipe-num">${!readiness.isMaterialDone || !readiness.isSewingDone ? '🔒' : '2'}</div>
                                        <span>QC 품질 검사 (${readiness.isQcPassed ? 'PASSED 통과' : '대기/진행'})</span>
                                    </div>
                                    <span>➔</span>
                                    <div class="pipe-step ${readiness.canComplete ? 'completed' : ''}">
                                        <div class="pipe-num">${readiness.canComplete ? '3' : '🔒'}</div>
                                        <span>최종 완료 보관함</span>
                                    </div>
                                </div>

                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                                    <h3 style="font-size:16px; color:var(--navy);">${item.styleNo} - ${item.name} 실무 통합 관리</h3>
                                    ${readiness.canComplete || item.status === 'COMPLETED' ? 
                                        `<button class="btn-action" style="background:var(--green);" onclick="toggleCompleteStyle(${item.id})">${item.status === 'ACTIVE' ? '최종 완료 보관함으로 이동' : '진행 중으로 복원'}</button>` :
                                        `<button class="btn-disabled" title="자재/출고 100% 완료 및 QC PASSED 통과 시 활성화">🔒 완료 불가 (조건 미달성)</button>`
                                    }
                                </div>

                                <!-- 원사 및 원단 -->
                                <div class="section-card">
                                    <div class="section-title">
                                        원사 및 원단 관리 (YARN & FABRIC)
                                        <button class="btn-action" style="font-size:11px; padding:3px 8px;" onclick="openItemModalForAdd(${item.id}, 'FABRIC')">+ 원단/원사 자재 추가</button>
                                    </div>
                                    <div class="table-container">
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>구분</th>
                                                    <th>자재/품목명 (상세 모달 클릭)</th>
                                                    <th>공급 업체</th>
                                                    <th>약속 납기일</th>
                                                    <th>발주 / 누적 입고 수량</th>
                                                    <th>공정 현황</th>
                                                    <th>완료 상태</th>
                                                    <th>관리</th>
                                                </tr>
                                            </thead>
                                            <tbody id="fabricTbody_${item.id}"></tbody>
                                        </table>
                                    </div>
                                </div>

                                <!-- 부자재 -->
                                <div class="section-card">
                                    <div class="section-title">
                                        부자재 관리 (TRIMS)
                                        <button class="btn-action" style="font-size:11px; padding:3px 8px;" onclick="openItemModalForAdd(${item.id}, 'TRIM')">+ 부자재 추가</button>
                                    </div>
                                    <div class="table-container">
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>품목 구분</th>
                                                    <th>부자재명 (상세 모달 클릭)</th>
                                                    <th>공급 업체</th>
                                                    <th>약속 납기일</th>
                                                    <th>발주 / 누적 입고 수량</th>
                                                    <th>공정 현황</th>
                                                    <th>완료 상태</th>
                                                    <th>관리</th>
                                                </tr>
                                            </thead>
                                            <tbody id="trimTbody_${item.id}"></tbody>
                                        </table>
                                    </div>
                                </div>

                                <!-- 봉제/출고 -->
                                <div class="section-card">
                                    <div class="section-title">
                                        봉제 공장 및 완제품 분할 출고 (SEWING & SHIPMENT)
                                        <button class="btn-action" style="font-size:11px; padding:3px 8px;" onclick="openSewingFactoryModal(${item.id})">+ 봉제공장 추가</button>
                                    </div>
                                    <div class="table-container">
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th style="width:16%;">국가/공장</th>
                                                    <th style="width:12%;">총 생산 목표</th>
                                                    <th style="width:12%;">누적 출고량</th>
                                                    <th style="width:34%;">분할 출고 및 이슈 내역</th>
                                                    <th style="width:12%;">완료 상태</th>
                                                    <th style="width:14%;">관리</th>
                                                </tr>
                                            </thead>
                                            <tbody id="sewingTbody_${item.id}"></tbody>
                                        </table>
                                    </div>
                                </div>

                                <!-- QC 품질 검사 영역 (조건부 잠금 해제) -->
                                <div class="section-card" style="${readiness.isMaterialDone && readiness.isSewingDone ? '' : 'opacity:0.6; background:#f8fafc;'}">
                                    <div class="section-title">
                                        <span>QC (품질 검사) 관리 ${!readiness.isMaterialDone || !readiness.isSewingDone ? '<b style="color:var(--red); font-size:11px; margin-left:10px;">🔒 자재 및 봉제 출고 100% 완료 시 활성화</b>' : ''}</span>
                                        ${readiness.isMaterialDone && readiness.isSewingDone ? `<button class="btn-action" style="font-size:11px; padding:3px 8px;" onclick="openQcModal(${item.id})">QC 판정 설정</button>` : ''}
                                    </div>
                                    <div class="grid-4">
                                        <div class="info-item"><label>QC 대행업체</label><span>${item.qcCompany || '-'}</span></div>
                                        <div class="info-item"><label>검사 예정/완료일</label><span>${item.qcDate || '-'}</span></div>
                                        <div class="info-item"><label>불량률 (%)</label><span>${item.qcRate || '-'}</span></div>
                                        <div class="info-item"><label>최종 QC 판정</label><span>${getQcBadgeHtml(item.qcStatus)}</span></div>
                                    </div>
                                </div>

                            </div>
                        </td>
                    `;
                    tbody.appendChild(detailTr);

                    renderAccordionSubTables(item);
                }
            });

            document.getElementById('countActive').innerText = activeCount;
            document.getElementById('countCompleted').innerText = completedCount;

            const alertBar = document.getElementById('alertBar');
            if (globalAlerts.length > 0) {
                alertBar.style.display = 'flex';
                document.getElementById('alertCountBadge').innerText = globalAlerts.length + '건';
            } else { alertBar.style.display = 'none'; }

            window.globalAlertsCache = globalAlerts;
        }

        function getQcBadgeHtml(status) {
            if (status === 'PASSED') return '<span class="status-badge status-completed">PASSED (합격)</span>';
            if (status === 'FAILED') return '<span class="status-badge status-danger">FAILED (불합격)</span>';
            return '<span class="status-badge" style="background:#e2e8f0; color:#475569;">검사 대기/진행 중</span>';
        }

        /* SUB TABLES RENDER */
        function renderAccordionSubTables(item) {
            const fabricTbody = document.getElementById(`fabricTbody_${item.id}`);
            const trimTbody = document.getElementById(`trimTbody_${item.id}`);
            const sewingTbody = document.getElementById(`sewingTbody_${item.id}`);

            if (fabricTbody) fabricTbody.innerHTML = '';
            if (trimTbody) trimTbody.innerHTML = '';
            if (sewingTbody) sewingTbody.innerHTML = '';

            (item.materials || []).forEach(mat => {
                const total = Number(mat.totalQty) || 1;
                const current = Number(mat.currentQty) || 0;
                const pct = Math.min(100, Math.round((current / total) * 100));

                const steps = PROCESS_STEPS[mat.subType] || [];
                const lastStep = steps[steps.length - 1];
                const isFinalProcess = (mat.processStep === lastStep);
                const is100PercentDone = (pct >= 100 && isFinalProcess);

                let stepHtml = '<div class="step-flow">';
                steps.forEach(st => {
                    stepHtml += `<span class="step-pill ${mat.processStep === st ? 'current' : ''}">${st}</span>`;
                });
                stepHtml += '</div>';

                const tr = document.createElement('tr');
                const typeBadge = mat.subType === 'YARN' ? '<span style="background:#e0f2fe; color:#0369a1; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:10px;">원사</span>' :
                    (mat.subType === 'FABRIC' ? '<span style="background:#fef3c7; color:#92400e; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:10px;">원단</span>' :
                    '<span style="background:#f3e8ff; color:#6b21a8; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:10px;">부자재</span>');

                tr.innerHTML = `
                    <td>${typeBadge}</td>
                    <td><span class="clickable-name" onclick="openMaterialDetailModal(${item.id}, ${mat.id})">${mat.name}</span></td>
                    <td>${mat.supplier || '-'}</td>
                    <td><strong style="color:var(--amber);">${mat.promisedDate || '-'}</strong></td>
                    <td><strong>${current.toLocaleString()}</strong> / ${total.toLocaleString()} ${mat.unit || ''} (${pct}%)</td>
                    <td>${stepHtml}</td>
                    <td>${is100PercentDone ? '<span class="status-badge status-completed">입고 완료</span>' : '<span style="color:var(--muted); font-size:11px;">진행 중</span>'}</td>
                    <td>
                        <div class="action-group">
                            <button class="btn-action" style="font-size:10px; padding:3px 7px; background:var(--blue);" onclick="openPartialInModal(${item.id}, ${mat.id})">+ 입고/공정 기록</button>
                            <button class="btn-secondary" style="font-size:10px; padding:3px 6px;" onclick="openEditItemModal(${item.id}, ${mat.id})">수정</button>
                        </div>
                    </td>
                `;

                if (mat.subType === 'YARN' || mat.subType === 'FABRIC') { if (fabricTbody) fabricTbody.appendChild(tr); }
                else { if (trimTbody) trimTbody.appendChild(tr); }
            });

            (item.factories || []).forEach(fac => {
                const totalTarget = Number(fac.totalTarget) || 1;
                const shipments = fac.shipments || [];
                const totalShip = shipments.reduce((acc, s) => acc + Number(s.qty), 0);
                const isShipDone = (totalShip >= totalTarget);

                let shipmentHtml = '';
                shipments.forEach((s, idx) => {
                    shipmentHtml += `
                        <div class="shipment-item">
                            <span><strong>${s.date}</strong> | ${Number(s.qty).toLocaleString()}개 (${s.note || '차수출고'})</span>
                            <div class="shipment-actions">
                                <button class="btn-secondary" style="padding:1px 4px; font-size:9px;" onclick="openEditShipmentModal(${item.id}, ${fac.id}, ${idx})">수정</button>
                                <button class="btn-danger" style="padding:1px 4px; font-size:9px;" onclick="deleteShipment(${item.id}, ${fac.id}, ${idx})">삭제</button>
                            </div>
                        </div>
                    `;
                });

                if (fac.issues) {
                    fac.issues.forEach((iss, iIdx) => {
                        shipmentHtml += `
                            <div class="issue-item">
                                <span>🚨 ${iss}</span>
                                <button class="btn-danger" style="padding:1px 4px; font-size:9px;" onclick="deleteIssue(${item.id}, ${fac.id}, ${iIdx})">삭제</button>
                            </div>
                        `;
                    });
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>[${fac.country}]</strong><br>${fac.name}</td>
                    <td>${totalTarget.toLocaleString()}개</td>
                    <td><strong>${totalShip.toLocaleString()}</strong>개</td>
                    <td>${shipmentHtml || '<span style="color:var(--muted); font-size:11px;">출고 내역 없음</span>'}</td>
                    <td>${isShipDone ? '<span class="status-badge status-completed">출고 완료</span>' : '<span style="color:var(--muted); font-size:11px;">출고 진행 중</span>'}</td>
                    <td>
                        <div class="action-group">
                            <button class="btn-secondary" style="font-size:10px;" onclick="openAddShipmentModal(${item.id}, ${fac.id})">+ 출고 추가</button>
                            <button class="btn-danger" style="font-size:10px;" onclick="openAddIssueModal(${item.id}, ${fac.id})">+ 이슈</button>
                        </div>
                    </td>
                `;
                if (sewingTbody) sewingTbody.appendChild(tr);
            });
        }

        /* SKU MATRIX UI GENERATOR */
        function renderMatrixInputs(styleObj, existingMatrixData) {
            const container = document.getElementById('matrixContainer');
            container.innerHTML = '';

            const sizes = styleObj.sizes || ['55', '66', '77'];
            const colors = styleObj.colors || ['블랙', '화이트', '브라운'];

            const table = document.createElement('table');
            table.className = 'matrix-table';

            let headerTr = `<tr><th>컬러 / 사이즈</th>`;
            sizes.forEach(sz => headerTr += `<th>${sz}</th>`);
            headerTr += `</tr>`;
            table.innerHTML = headerTr;

            colors.forEach(col => {
                let tr = document.createElement('tr');
                let tdHtml = `<td><strong>${col}</strong></td>`;
                sizes.forEach(sz => {
                    const key = `${col}_${sz}`;
                    const val = (existingMatrixData && existingMatrixData[key]) ? existingMatrixData[key] : 0;
                    tdHtml += `<td><input type="number" class="matrix-input" data-key="${key}" value="${val}" onchange="calcMatrixTotal()"></td>`;
                });
                tr.innerHTML = tdHtml;
                table.appendChild(tr);
            });

            container.appendChild(table);
            calcMatrixTotal();
        }

        function calcMatrixTotal() {
            let sum = 0;
            document.querySelectorAll('.matrix-input').forEach(inp => {
                sum += Number(inp.value) || 0;
            });
            document.getElementById('matrixTotalSum').innerText = `총 발주량: ${sum.toLocaleString()}`;
            document.getElementById('newItemUnit').dataset.calculatedQty = sum;
        }

        /* MODALS LOGIC */
        function openItemModalForAdd(styleId, defaultType) {
            activeStyleId = styleId;
            editingItemId = null;
            const styleObj = stylesData.find(s => s.id === styleId);

            document.getElementById('btnDeleteItem').style.display = 'none';
            document.getElementById('newItemType').value = defaultType;
            document.getElementById('newItemName').value = '';
            document.getElementById('newItemSpec').value = '';
            document.getElementById('newItemSupplier').value = '';
            document.getElementById('newItemOrderDate').value = '';
            document.getElementById('newItemPayDate').value = '';
            document.getElementById('newItemPromisedDate').value = '';
            document.getElementById('newItemTargetFactory').value = '';

            toggleMaterialTypeForm();
            renderMatrixInputs(styleObj, null);
            openModal('itemModal');
        }

        function openEditItemModal(styleId, matId) {
            activeStyleId = styleId;
            editingItemId = matId;
            const styleObj = stylesData.find(s => s.id === styleId);
            const mat = styleObj.materials.find(m => m.id === matId);

            document.getElementById('btnDeleteItem').style.display = 'inline-block';
            document.getElementById('newItemType').value = mat.subType;
            document.getElementById('newItemName').value = mat.name;
            document.getElementById('newItemSpec').value = mat.spec || '';
            document.getElementById('newItemSupplier').value = mat.supplier || '';
            document.getElementById('newItemOrderDate').value = mat.orderDate || '';
            document.getElementById('newItemPayDate').value = mat.payDate || '';
            document.getElementById('newItemPromisedDate').value = mat.promisedDate || '';
            document.getElementById('newItemTargetFactory').value = mat.targetFactory || '';
            document.getElementById('newItemUnit').value = mat.unit || '개';

            toggleMaterialTypeForm();
            renderMatrixInputs(styleObj, mat.skuMatrix);
            openModal('itemModal');
        }

        function toggleMaterialTypeForm() {
            const type = document.getElementById('newItemType').value;
            const fgSpec = document.getElementById('fgSpec');
            const unitInput = document.getElementById('newItemUnit');

            if (type === 'TRIM') {
                fgSpec.style.display = 'none';
                unitInput.value = '개';
            } else {
                fgSpec.style.display = 'block';
                unitInput.value = type === 'YARN' ? 'kg' : 'y';
            }
        }

        function saveNewItem() {
            const styleObj = stylesData.find(s => s.id === activeStyleId);
            const subType = document.getElementById('newItemType').value;
            const name = document.getElementById('newItemName').value.trim();
            const spec = document.getElementById('newItemSpec').value.trim();
            const supplier = document.getElementById('newItemSupplier').value.trim();
            const orderDate = document.getElementById('newItemOrderDate').value;
            const payDate = document.getElementById('newItemPayDate').value;
            const promisedDate = document.getElementById('newItemPromisedDate').value;
            const targetFactory = document.getElementById('newItemTargetFactory').value.trim();
            const unit = document.getElementById('newItemUnit').value.trim() || '개';
            const totalQty = Number(document.getElementById('newItemUnit').dataset.calculatedQty) || 0;

            if (!name) { alert('자재명을 입력해주세요.'); return; }

            let skuMatrix = {};
            document.querySelectorAll('.matrix-input').forEach(inp => {
                skuMatrix[inp.dataset.key] = Number(inp.value) || 0;
            });

            if (editingItemId) {
                const mat = styleObj.materials.find(m => m.id === editingItemId);
                mat.subType = subType; mat.name = name; mat.spec = spec; mat.supplier = supplier;
                mat.orderDate = orderDate; mat.payDate = payDate; mat.promisedDate = promisedDate;
                mat.targetFactory = targetFactory; mat.unit = unit; mat.totalQty = totalQty; mat.skuMatrix = skuMatrix;
            } else {
                styleObj.materials.push({
                    id: Date.now(), subType, name, spec, supplier, orderDate, payDate, promisedDate, targetFactory, unit, totalQty,
                    currentQty: 0, processStep: PROCESS_STEPS[subType][0], skuMatrix, issues: []
                });
            }

            saveData(); closeModal('itemModal'); renderMainList();
        }

        function deleteCurrentItem() {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            const styleObj = stylesData.find(s => s.id === activeStyleId);
            styleObj.materials = styleObj.materials.filter(m => m.id !== editingItemId);
            saveData(); closeModal('itemModal'); renderMainList();
        }

        function openMaterialDetailModal(styleId, matId) {
            const styleObj = stylesData.find(s => s.id === styleId);
            const mat = styleObj.materials.find(m => m.id === matId);

            document.getElementById('mdName').innerText = `[${mat.subType}] ${mat.name} (${mat.spec || '규격없음'})`;
            document.getElementById('mdOrderDate').innerText = mat.orderDate || '-';
            document.getElementById('mdPayDate').innerText = mat.payDate || '-';
            document.getElementById('mdPromisedDate').innerText = mat.promisedDate || '-';
            document.getElementById('mdTargetFactory').innerText = mat.targetFactory || '미지정';
            document.getElementById('mdQtyInfo').innerText = `${Number(mat.currentQty).toLocaleString()} / ${Number(mat.totalQty).toLocaleString()} ${mat.unit}`;

            let matrixHtml = '<table class="matrix-table"><tr><th>컬러/사이즈</th>';
            (styleObj.sizes || []).forEach(sz => matrixHtml += `<th>${sz}</th>`);
            matrixHtml += '</tr>';

            (styleObj.colors || []).forEach(col => {
                matrixHtml += `<tr><td><strong>${col}</strong></td>`;
                (styleObj.sizes || []).forEach(sz => {
                    const key = `${col}_${sz}`;
                    const val = (mat.skuMatrix && mat.skuMatrix[key]) ? mat.skuMatrix[key] : 0;
                    matrixHtml += `<td>${val}</td>`;
                });
                matrixHtml += `</tr>`;
            });
            matrixHtml += '</table>';
            document.getElementById('mdMatrixView').innerHTML = matrixHtml;

            let issueHtml = (mat.issues && mat.issues.length > 0) ? mat.issues.map(i => `<div>• ${i}</div>`).join('') : '발생한 지연/변경 이슈 없음';
            document.getElementById('mdIssueHistory').innerHTML = issueHtml;

            openModal('materialDetailModal');
        }

        function openPartialInModal(styleId, matId) {
            activeStyleId = styleId; selectedMaterialId = matId;
            const styleObj = stylesData.find(s => s.id === styleId);
            const mat = styleObj.materials.find(m => m.id === matId);

            document.getElementById('partialInQty').value = mat.currentQty;
            document.getElementById('partialInIssue').value = '';

            const processSelect = document.getElementById('itemProcessStep');
            processSelect.innerHTML = '';
            (PROCESS_STEPS[mat.subType] || []).forEach(st => {
                const opt = document.createElement('option');
                opt.value = st; opt.innerText = st;
                if (mat.processStep === st) opt.selected = true;
                processSelect.appendChild(opt);
            });

            openModal('partialInModal');
        }

        function savePartialIn() {
            const styleObj = stylesData.find(s => s.id === activeStyleId);
            const mat = styleObj.materials.find(m => m.id === selectedMaterialId);

            mat.currentQty = Number(document.getElementById('partialInQty').value) || 0;
            mat.processStep = document.getElementById('itemProcessStep').value;

            const issueText = document.getElementById('partialInIssue').value.trim();
            if (issueText) {
                if (!mat.issues) mat.issues = [];
                mat.issues.push(`[${new Date().toISOString().substring(5,10)}] ${issueText}`);
            }

            saveData(); closeModal('partialInModal'); renderMainList();
        }

        function openSewingFactoryModal(styleId) {
            activeStyleId = styleId;
            document.getElementById('newFacCountry').value = '';
            document.getElementById('newFacName').value = '';
            document.getElementById('newFacTarget').value = '';
            openModal('sewingModal');
        }

        function saveNewSewingFactory() {
            const styleObj = stylesData.find(s => s.id === activeStyleId);
            const country = document.getElementById('newFacCountry').value.trim() || '국내';
            const name = document.getElementById('newFacName').value.trim();
            const target = Number(document.getElementById('newFacTarget').value) || 0;

            if (!name) return;
            if (!styleObj.factories) styleObj.factories = [];
            styleObj.factories.push({ id: Date.now(), country, name, totalTarget: target, shipments: [], issues: [] });

            saveData(); closeModal('sewingModal'); renderMainList();
        }

        function openAddShipmentModal(styleId, facId) {
            activeStyleId = styleId; selectedFactoryId = facId; editingShipmentIndex = null;
            document.getElementById('shipmentModalHeader').innerText = '완제품 분할 출고 등록';
            document.getElementById('shipmentDate').value = new Date().toISOString().substring(0,10);
            document.getElementById('shipmentQty').value = '';
            document.getElementById('shipmentNote').value = '';
            openModal('shipmentModal');
        }

        function openEditShipmentModal(styleId, facId, idx) {
            activeStyleId = styleId; selectedFactoryId = facId; editingShipmentIndex = idx;
            const styleObj = stylesData.find(s => s.id === styleId);
            const fac = styleObj.factories.find(f => f.id === facId);
            const ship = fac.shipments[idx];

            document.getElementById('shipmentModalHeader').innerText = '완제품 출고 수정';
            document.getElementById('shipmentDate').value = ship.date;
            document.getElementById('shipmentQty').value = ship.qty;
            document.getElementById('shipmentNote').value = ship.note;
            openModal('shipmentModal');
        }

        function saveShipment() {
            const styleObj = stylesData.find(s => s.id === activeStyleId);
            const fac = styleObj.factories.find(f => f.id === selectedFactoryId);
            const date = document.getElementById('shipmentDate').value;
            const qty = Number(document.getElementById('shipmentQty').value) || 0;
            const note = document.getElementById('shipmentNote').value.trim();

            if (!date || qty <= 0) return;
            if (editingShipmentIndex !== null) fac.shipments[editingShipmentIndex] = { date, qty, note };
            else { if (!fac.shipments) fac.shipments = []; fac.shipments.push({ date, qty, note }); }

            saveData(); closeModal('shipmentModal'); renderMainList();
        }

        function deleteShipment(styleId, facId, idx) {
            if (!confirm('출고 기록을 삭제하시겠습니까?')) return;
            const styleObj = stylesData.find(s => s.id === styleId);
            const fac = styleObj.factories.find(f => f.id === facId);
            fac.shipments.splice(idx, 1);
            saveData(); renderMainList();
        }

        function openAddIssueModal(styleId, facId) {
            activeStyleId = styleId; selectedFactoryId = facId;
            document.getElementById('issueText').value = '';
            openModal('issueModal');
        }

        function saveIssue() {
            const styleObj = stylesData.find(s => s.id === activeStyleId);
            const fac = styleObj.factories.find(f => f.id === selectedFactoryId);
            const text = document.getElementById('issueText').value.trim();
            if (!text) return;

            if (!fac.issues) fac.issues = [];
            fac.issues.push(text);
            saveData(); closeModal('issueModal'); renderMainList();
        }

        function deleteIssue(styleId, facId, idx) {
            const styleObj = stylesData.find(s => s.id === styleId);
            const fac = styleObj.factories.find(f => f.id === facId);
            fac.issues.splice(idx, 1);
            saveData(); renderMainList();
        }

        function openQcModal(styleId) {
            activeStyleId = styleId;
            const styleObj = stylesData.find(s => s.id === styleId);
            document.getElementById('qcInputCompany').value = styleObj.qcCompany || '';
            document.getElementById('qcInputDate').value = styleObj.qcDate || '';
            document.getElementById('qcInputRate').value = styleObj.qcRate || '';
            document.getElementById('qcInputStatus').value = styleObj.qcStatus || 'WAITING';
            openModal('qcModal');
        }

        function saveQc() {
            const styleObj = stylesData.find(s => s.id === activeStyleId);
            styleObj.qcCompany = document.getElementById('qcInputCompany').value.trim();
            styleObj.qcDate = document.getElementById('qcInputDate').value;
            styleObj.qcRate = document.getElementById('qcInputRate').value.trim();
            styleObj.qcStatus = document.getElementById('qcInputStatus').value;

            saveData(); closeModal('qcModal'); renderMainList();
        }

        function openStyleModal() {
            document.getElementById('newStyleNo').value = '';
            document.getElementById('newStyleName').value = '';
            document.getElementById('newTargetDate').value = '';
            openModal('styleModal');
        }

        function saveNewStyle() {
            const brand = document.getElementById('newBrand').value;
            const season = document.getElementById('newSeason').value.trim();
            const styleNo = document.getElementById('newStyleNo').value.trim();
            const name = document.getElementById('newStyleName').value.trim();
            const targetDate = document.getElementById('newTargetDate').value;

            const sizesStr = document.getElementById('newSizeOptions').value.trim();
            const colorsStr = document.getElementById('newColorOptions').value.trim();

            const sizes = sizesStr ? sizesStr.split(',').map(s => s.trim()) : ['55', '66', '77'];
            const colors = colorsStr ? colorsStr.split(',').map(c => c.trim()) : ['블랙', '화이트', '브라운'];

            if (!styleNo || !name) return;

            stylesData.push({
                id: Date.now(), brand, season, styleNo, name, targetDate, status: 'ACTIVE', sizes, colors,
                materials: [], factories: [], qcCompany: '', qcDate: '', qcRate: '', qcStatus: 'WAITING'
            });

            saveData(); closeModal('styleModal'); renderMainList();
        }

        function toggleCompleteStyle(id) {
            const styleObj = stylesData.find(s => s.id === id);
            styleObj.status = (styleObj.status === 'ACTIVE') ? 'COMPLETED' : 'ACTIVE';
            saveData(); renderMainList();
        }

        function openAlertModal() {
            const container = document.getElementById('alertListContainer');
            container.innerHTML = '';
            const alerts = window.globalAlertsCache || [];

            if (alerts.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">지연 및 이슈 항목이 없습니다.</div>';
            } else {
                alerts.forEach(a => {
                    const div = document.createElement('div');
                    div.style.cssText = 'background:#fff3f3; border:1px solid #f87171; padding:10px 12px; border-radius:8px; margin-bottom:8px; cursor:pointer;';
                    div.onclick = () => { closeModal('alertModal'); expandedStyleId = a.style.id; renderMainList(); };
                    div.innerHTML = `
                        <div style="font-weight:bold; color:#991b1b; margin-bottom:4px; font-size:13px;">${a.style.brand} | ${a.style.styleNo} - ${a.style.name}</div>
                        ${a.issues.map(iss => `<div style="color:#b91c1c; font-size:11px; margin-top:2px;">• ${iss}</div>`).join('')}
                    `;
                    container.appendChild(div);
                });
            }
            openModal('alertModal');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // INIT
        renderMainList();
    </script>
</body>
</html>
