<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPROJECT · 생산 관제</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#FAFAFA;
  --paper:#FFFFFF;
  --ink:#111111;
  --ink-soft:#6B6B6B;
  --line:#ECECEC;
  --accent:#C4372B;
  --accent-soft:#FBEAE8;
  --soon:#946200;
  --soon-soft:#FBF2E0;
  --ok:#1E7A46;
  --ok-soft:#E6F4EC;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
  --sans: 'Pretendard', -apple-system, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
::selection{background:var(--accent-soft);}

header{
  padding:32px 40px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
  position:sticky; top:0; background:rgba(250,250,250,.86); backdrop-filter:blur(14px); z-index:10;
  border-bottom:1px solid var(--line);
}
.brandmark{display:flex; align-items:center; gap:12px;}
.brandmark .mark{
  font-family:var(--sans); font-weight:800; font-size:13px; letter-spacing:0.02em;
  background:var(--ink); color:#fff; padding:6px 10px; border-radius:8px;
}
.brandmark h1{font-size:19px; margin:0; font-weight:800; letter-spacing:-0.02em;}
.brandmark .sub{font-size:12px; color:var(--ink-soft); font-weight:500; margin-top:1px;}
.stats{display:flex; gap:32px; font-size:11px; color:var(--ink-soft); font-weight:600;}
.stats b{font-size:22px; display:block; font-weight:800; color:var(--ink); letter-spacing:-0.02em;}

.toolbar{
  padding:16px 40px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
select, input[type=text], input[type=number], input[type=date], textarea{
  font-family:var(--sans); font-size:13px; border:1px solid var(--line);
  background:var(--paper); padding:9px 14px; color:var(--ink); border-radius:20px;
  transition:.15s var(--ease);
}
textarea{border-radius:12px;}
select:focus, input:focus, textarea:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(17,17,17,.06);}
.btn{
  font-family:var(--sans); font-weight:700; font-size:13px; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:#fff;
  padding:10px 20px; border-radius:24px; transition:.15s var(--ease);
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(17,17,17,.18);}
.btn.ghost{background:transparent; color:var(--ink);}
.btn.ghost:hover{background:var(--paper); box-shadow:0 2px 8px rgba(0,0,0,.06);}
.btn.danger{border-color:var(--accent); color:var(--accent); background:transparent;}
.btn.danger:hover{background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(196,55,43,.25);}
.spacer{flex:1;}

main{padding:8px 40px 80px;}
.list{display:flex; flex-direction:column; gap:8px;}
.row-item{
  display:grid;
  grid-template-columns:56px 1.6fr 1fr 140px 90px 1.4fr;
  align-items:center; gap:16px;
  padding:18px 20px; border-radius:16px;
  background:var(--paper); cursor:pointer; transition:.18s var(--ease);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.row-item:hover{transform:translateY(-2px) scale(1.002); box-shadow:0 10px 28px rgba(0,0,0,.09);}
.row-item.issue{box-shadow:0 1px 2px rgba(0,0,0,.04), inset 3px 0 0 var(--accent);}
.row-item.issue:hover{box-shadow:0 10px 28px rgba(196,55,43,.14), inset 3px 0 0 var(--accent);}
.row-item .rowno{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink-soft);}
.row-item .stagepill{
  font-size:10.5px; font-weight:700; letter-spacing:.02em; color:var(--ink-soft);
  background:var(--bg); padding:3px 9px; border-radius:20px; white-space:nowrap; width:max-content; margin-top:6px;
}
.row-item .name{font-weight:700; font-size:15px; letter-spacing:-0.01em;}
.row-item .styleno{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:3px;}
.row-item .brand-season{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
.row-item .progress-row{display:flex; align-items:center; gap:8px;}
.progress-bar{flex:1; height:4px; background:var(--line); border-radius:4px; position:relative; overflow:hidden;}
.progress-bar i{position:absolute; left:0; top:0; bottom:0; background:var(--ink); display:block; border-radius:4px; transition:width .3s var(--ease);}
.progress-pct{font-family:var(--mono); font-size:11px; width:30px; text-align:right; color:var(--ink-soft);}
.dday{font-family:var(--mono); font-size:12.5px; font-weight:700; text-align:right;}
.dday.ok{color:var(--ink-soft);}
.dday.soon{color:var(--soon);}
.dday.over{color:var(--accent); font-weight:800;}
.dday.none{color:var(--line);}
.row-item .issue-note{
  font-size:12px; color:var(--accent); font-weight:600;
  display:flex; gap:5px; align-items:flex-start; line-height:1.4;
}
.row-item .colorinfo{font-size:12.5px; color:var(--ink-soft);}
.empty{padding:60px; text-align:center; color:var(--ink-soft); font-size:14px; border-radius:16px; background:var(--paper);}
@media (max-width:900px){
  .row-item{grid-template-columns:40px 1fr; grid-template-areas:"no name" ". meta"; row-gap:6px;}
}

.overlay{
  position:fixed; inset:0; background:rgba(17,17,17,.42); display:none;
  align-items:flex-start; justify-content:center; padding:48px 20px; z-index:50; overflow-y:auto;
  backdrop-filter:blur(3px);
}
.overlay.show{display:flex;}
.modal{ background:var(--paper); width:100%; max-width:880px; border-radius:24px; margin-bottom:48px; box-shadow:0 30px 80px rgba(0,0,0,.25); overflow:hidden; }
.modal-head{
  padding:22px 30px; display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); z-index:2; border-bottom:1px solid var(--line);
}
.modal-head h2{margin:0; font-size:18px; font-weight:800; letter-spacing:-0.01em;}
.modal-head .sub{font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
.modal-head .close{cursor:pointer; font-size:14px; background:var(--bg); border:none; color:var(--ink-soft); width:30px; height:30px; border-radius:50%; transition:.15s;}
.modal-head .close:hover{background:var(--line); color:var(--ink);}
.modal-body{padding:24px 30px 4px;}
.section{margin-bottom:30px;}
.section-title{
  font-size:12px; font-weight:800; letter-spacing:.02em;
  color:var(--ink); margin-bottom:14px;
  display:flex; justify-content:space-between; align-items:center;
}
.field-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.field-grid.two{grid-template-columns:repeat(2,1fr);}
.field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field select, .field input, .field textarea{width:100%;}
.field textarea{resize:vertical; min-height:44px;}

table.dyn{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px;}
table.dyn th, table.dyn td{border-bottom:1px solid var(--line); padding:8px 8px;}
table.dyn th{background:transparent; font-weight:700; font-size:10.5px; color:var(--ink-soft); text-align:center;}
table.dyn th:first-child{text-align:left;}
table.dyn input{border:none; width:100%; padding:4px; font-size:12.5px; background:transparent; text-align:center; border-radius:6px;}
table.dyn input:focus{outline:none; background:var(--bg);}
table.dyn input.colorname{text-align:left;}
table.dyn td.total{font-family:var(--mono); font-weight:800; text-align:center;}
.row-actions{margin-top:10px; display:flex; gap:8px;}
.small-btn{
  font-size:12px; font-weight:700; border:1px solid var(--line); background:var(--paper);
  padding:6px 12px; cursor:pointer; border-radius:16px; transition:.15s var(--ease);
}
.small-btn:hover{border-color:var(--ink); background:var(--bg);}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

.stage-pills{display:flex; gap:6px; padding:14px 30px 0;}
.pill{
  font-size:12px; font-weight:700; padding:7px 14px; border:1px solid var(--line);
  cursor:pointer; background:var(--paper); border-radius:20px; transition:.15s var(--ease);
}
.pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.pill:not(.active):hover{border-color:var(--ink);}

.context-line{
  padding:10px 30px 0; font-size:12.5px; color:var(--ink-soft); font-weight:600;
  display:flex; gap:14px; flex-wrap:wrap;
}
.context-line b{color:var(--ink); font-weight:700;}

.issue-item{background:var(--bg); padding:11px 14px; margin-bottom:8px; font-size:12.5px; border-radius:12px;}
.issue-item .meta{color:var(--ink-soft); font-size:11px; margin-top:4px;}

.modal-foot{padding:18px 30px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px;}

/* file upload / preview */
.filebox{
  border:1.5px dashed var(--line); border-radius:16px; padding:18px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.filebox .thumb{
  width:84px; height:84px; border-radius:12px; object-fit:cover; cursor:zoom-in;
  background:var(--bg); border:1px solid var(--line);
}
.filebox .doc-icon{
  width:84px; height:84px; border-radius:12px; background:var(--bg); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--ink-soft);
  text-align:center; padding:6px;
}
.filebox .info{flex:1; min-width:160px;}
.filebox .fname{font-weight:700; font-size:13px; word-break:break-all;}
.filebox .fmeta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.filebox .actions{display:flex; gap:8px;}
.lightbox{
  position:fixed; inset:0; background:rgba(0,0,0,.85); display:none;
  align-items:center; justify-content:center; z-index:100; flex-direction:column; gap:14px;
}
.lightbox.show{display:flex;}
.lightbox img{max-width:88vw; max-height:76vh; transition:transform .15s var(--ease); border-radius:6px; cursor:grab;}
.lightbox .lbtools{display:flex; gap:8px;}
.lightbox .lbtools button{
  font-family:var(--mono); font-size:13px; font-weight:700; border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08); color:#fff; padding:8px 14px; border-radius:20px; cursor:pointer;
}
.lightbox .lbtools button:hover{background:rgba(255,255,255,.18);}

.badge{font-family:var(--mono); font-size:11px; font-weight:800; padding:3px 9px; border-radius:20px;}
.badge.pass{background:var(--ok-soft); color:var(--ok);}
.badge.fail{background:var(--accent-soft); color:var(--accent);}
</style>
</head>
<body>

<header>
  <div class="brandmark">
    <span class="mark">JP</span>
    <div>
      <h1>JPROJECT</h1>
      <div class="sub">생산 관제</div>
    </div>
  </div>
  <div class="stats" id="statsBar"></div>
</header>

<div class="toolbar">
  <select id="fBrand"><option value="">전체 브랜드</option></select>
  <select id="fSeason"><option value="">전체 시즌</option></select>
  <select id="fStage">
    <option value="">전체 단계</option>
    <option value="기획">기획</option>
    <option value="작지서">샘플/작업지시서</option>
    <option value="생산">생산</option>
    <option value="완료">완료</option>
  </select>
  <input type="text" id="fSearch" placeholder="아이템명 · 스타일번호 검색" style="width:200px;">
  <div class="spacer"></div>
  <button class="btn ghost" id="btnSeed">테스트 데이터 넣기</button>
  <button class="btn" id="btnNew">+ 기획 아이템 등록</button>
</div>

<main id="main"></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modalTitle">아이템</h2>
        <div class="sub" id="modalSub"></div>
      </div>
      <button class="close" id="modalClose">✕ 닫기</button>
    </div>
    <div class="stage-pills" id="stagePills"></div>
    <div class="context-line" id="contextLine"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn danger" id="btnDelete">삭제</button>
      <div>
        <button class="btn ghost" id="btnCancel">취소</button>
        <button class="btn" id="btnSave">저장</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="">
  <div class="lbtools">
    <button id="lbZoomOut">－</button>
    <button id="lbZoomReset">100%</button>
    <button id="lbZoomIn">＋</button>
    <button id="lbClose">✕ 닫기</button>
  </div>
</div>

<script>
let DATA = JSON.parse(localStorage.getItem('jproject_data') || '[]');
let editingId = null;   // id of style being edited, or null for new
let workingCopy = null; // in-memory copy of the style being edited (not yet saved)

function saveAll(){ localStorage.setItem('jproject_data', JSON.stringify(DATA)); render(); }
function uid(){ return 'S' + Math.random().toString(36).slice(2,9); }

function newStyle(){
  return {
    id: uid(), brand:'', season:'', styleNo:'',
    itemName:'', composition:'', colorComposition:'', planQty:'', totalQty:'', price:'',
    sizeRange:'', material:'', origin:'', dueInDate:'', launchDate:'',
    stage:'기획',
    planFile:{ fileDataUrl:'', fileName:'', fileType:'' },
    workOrder:{ factory:'', writtenDate:'', dueDate:'', manager:'', memo:'',
      colorSizeMatrix:[], sizeSpecRows:[], materials:[], labelMethod:'', packingMethod:'',
      fileDataUrl:'', fileName:'', fileType:'' },
    production:{
      steps:{material:'대기', sewing:'대기', qc:'대기', shipping:'대기'},
      shipments:[],
      qc:{totalQty:'', passQty:'', failQty:'', note:''}
    },
    completion:{ containerDate:'', shipDate:'', customsDate:'', logisticsCompany:'', portArrival:'', note:'' },
    issues:[]
  };
}

function seedData(){
  const s1 = newStyle();
  Object.assign(s1, {
    brand:'스노야', season:'26FW', styleNo:'',
    itemName:'베스트 판초', composition:'베스트+판초', colorComposition:'그레이/네이비',
    planQty:3400, totalQty:169000, price:99000,
    sizeRange:'FREE', material:'wool55% acrylic28% nylon17%', origin:'한국(역외)',
    dueInDate:'', launchDate:'2026-08-24', stage:'기획'
  });

  const s2 = newStyle();
  Object.assign(s2, {
    brand:'스노야', season:'26FW', styleNo:'6FW-HD-D02',
    itemName:'패딩베스트', composition:'', colorComposition:'',
    planQty:3000, totalQty:3000, price:'',
    sizeRange:'S/M/L', material:'', origin:'', dueInDate:'', launchDate:'',
    stage:'작지서'
  });
  s2.workOrder = Object.assign(s2.workOrder, {
    factory:'현송', writtenDate:'2026-08-13', dueDate:'', manager:'곽동혁 / 김혜연',
    colorSizeMatrix:[
      {color:'카키/오렌지(45%)', qtyBySize:{S:378,M:540,L:432}},
      {color:'블루/스카이블루(35%)', qtyBySize:{S:294,M:420,L:336}},
      {color:'그레이/핫핑크(20%)', qtyBySize:{S:192,M:288,L:120}}
    ],
    sizeSpecRows:[
      {measure:'총장(뒤목점)', valuesBySize:{S:60,M:61,L:62}, deviation:'1'},
      {measure:'가슴둘레', valuesBySize:{S:116,M:121,L:126}, deviation:'5'}
    ]
  });

  const s3 = newStyle();
  Object.assign(s3, {
    brand:'모브온', season:'26FW', styleNo:'6FW-MO-P02',
    itemName:'기모 세미플레어 팬츠', composition:'', colorComposition:'베이지/네이비/블랙',
    planQty:97200, totalQty:97200, price:'',
    sizeRange:'55/66/77/88/99', material:'F-92/8% Poly/Span, B-100%POLY', origin:'',
    dueInDate:'', launchDate:'', stage:'생산'
  });
  s3.workOrder = Object.assign(s3.workOrder, {
    factory:'', writtenDate:'2026-06-30', dueDate:'2026-09-20', manager:'임소연 / 백수연',
    colorSizeMatrix:[
      {color:'베이지', qtyBySize:{'55':7452,'66':12312,'77':8100,'88':2916,'99':1620}},
      {color:'네이비', qtyBySize:{'55':7452,'66':12312,'77':8100,'88':2916,'99':1620}},
      {color:'블랙', qtyBySize:{'55':7452,'66':12312,'77':8100,'88':2916,'99':1620}}
    ],
    materials:[
      {item:'겉감', spec:'58"', content:'F-92/8% Poly/Span 220G/Y', qty:'', note:''},
      {item:'밴드', spec:'70MM', content:'70MM COMEZ 중간직밴드', qty:'', note:''}
    ],
    packingMethod:'전 수량 PC 폴리백 Individual polybag'
  });
  s3.production.steps = {material:'완료', sewing:'완료', qc:'진행', shipping:'대기'};
  s3.production.shipments = [
    {type:'부분출고', qty:30000, date:'2026-09-10', note:'베이지 컬러 우선 출고'}
  ];
  s3.production.qc = {totalQty:97200, passQty:95500, failQty:1700, note:'봉제선 불량 일부 발생'};
  s3.issues.push({stage:'자재', content:'밴드 원단 입고 지연 - 공장 확인 필요', company:'COMEZ', date:'2026-08-15', resolved:false, memo:''});

  DATA = [s1, s2, s3];
  saveAll();
}

/* ---------- progress / dday ---------- */
function stageProgress(s){
  if(s.stage==='기획') return 8;
  if(s.stage==='완료') return 100;
  if(s.stage==='작지서') return 28;
  const steps = s.production.steps;
  const vals = Object.values(steps);
  const done = vals.filter(v=>v==='완료').length;
  const inprog = vals.filter(v=>v==='진행').length;
  return Math.min(96, Math.round(35 + (done*14) + (inprog*6)));
}
function ddayInfo(dateStr){
  if(!dateStr) return {label:'-', cls:'none'};
  const d = new Date(dateStr); const now = new Date();
  d.setHours(0,0,0,0); now.setHours(0,0,0,0);
  const diff = Math.round((d-now)/86400000);
  if(diff<0) return {label:`D+${-diff}`, cls:'over'};
  if(diff===0) return {label:'D-DAY', cls:'over'};
  if(diff<=7) return {label:`D-${diff}`, cls:'soon'};
  return {label:`D-${diff}`, cls:'ok'};
}
function openIssues(s){ return (s.issues||[]).filter(i=>!i.resolved); }

/* ---------- main list ---------- */
function populateFilters(){
  const brands = [...new Set(DATA.map(d=>d.brand).filter(Boolean))];
  const seasons = [...new Set(DATA.map(d=>d.season).filter(Boolean))];
  const fB = document.getElementById('fBrand'), fS = document.getElementById('fSeason');
  const curB = fB.value, curS = fS.value;
  fB.innerHTML = '<option value="">전체 브랜드</option>' + brands.map(b=>`<option ${b===curB?'selected':''}>${b}</option>`).join('');
  fS.innerHTML = '<option value="">전체 시즌</option>' + seasons.map(s=>`<option ${s===curS?'selected':''}>${s}</option>`).join('');
}

function render(){
  populateFilters();
  const fBrand = document.getElementById('fBrand').value;
  const fSeason = document.getElementById('fSeason').value;
  const fStage = document.getElementById('fStage').value;
  const q = document.getElementById('fSearch').value.trim().toLowerCase();

  let list = DATA.filter(s=>{
    if(fBrand && s.brand!==fBrand) return false;
    if(fSeason && s.season!==fSeason) return false;
    if(fStage && s.stage!==fStage) return false;
    if(q && !((s.itemName||'').toLowerCase().includes(q) || (s.styleNo||'').toLowerCase().includes(q))) return false;
    return true;
  });

  const totalIssues = DATA.reduce((a,s)=>a+openIssues(s).length,0);
  document.getElementById('statsBar').innerHTML = `
    <div><b>${DATA.length}</b>전체 스타일</div>
    <div><b>${DATA.filter(s=>s.stage==='생산').length}</b>생산중</div>
    <div><b style="color:${totalIssues?'var(--accent)':'var(--ink)'}">${totalIssues}</b>미해결 이슈</div>
  `;

  const main = document.getElementById('main');
  if(list.length===0){
    main.innerHTML = `<div class="empty">등록된 아이템이 없습니다. 우측 상단 "기획 아이템 등록" 또는 "테스트 데이터 넣기"로 시작하세요.</div>`;
    return;
  }

  const orderMap = {};
  DATA.forEach(s=>{
    const key = s.brand+'|'+s.season;
    orderMap[key] = (orderMap[key]||0)+1;
    s.__seq = orderMap[key];
  });

  main.innerHTML = `<div class="list">${list.map(rowHtml).join('')}</div>`;
  main.querySelectorAll('.row-item').forEach(c=>{
    c.addEventListener('click', ()=> openModal(c.dataset.id));
  });
}

  const prog = stageProgress(s);

  return `

/* ---------- modal ---------- */
function openModal(id){
  editingId = id;
  const base = id ? DATA.find(d=>d.id===id) : newStyle();
  workingCopy = JSON.parse(JSON.stringify(base)); // deep copy so edits don't leak until Save
  document.getElementById('modalTitle').textContent = id ? (base.itemName||'상세정보') : '새 기획 아이템 등록';
  document.getElementById('btnDelete').style.display = id ? 'inline-block' : 'none';
  renderModalStage();
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); editingId=null; workingCopy=null; }

function syncCurrentSectionIntoWorkingCopy(){
  // pull whatever inputs are currently on screen back into workingCopy, guarding for missing fields
  const s = workingCopy;
  if(!s) return;
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  if(g('f_brand')!==undefined){
    s.brand=g('f_brand'); s.season=g('f_season'); s.styleNo=g('f_styleNo');
    s.itemName=g('f_itemName'); s.composition=g('f_composition'); s.colorComposition=g('f_colorComposition');
    s.planQty=g('f_planQty'); s.totalQty=g('f_totalQty'); s.price=g('f_price');
    s.sizeRange=g('f_sizeRange'); s.material=g('f_material'); s.origin=g('f_origin');
    s.dueInDate=g('f_dueInDate'); s.launchDate=g('f_launchDate');
  }
  if(g('w_factory')!==undefined){
    s.workOrder.factory=g('w_factory'); s.workOrder.writtenDate=g('w_writtenDate');
    s.workOrder.dueDate=g('w_dueDate'); s.workOrder.manager=g('w_manager'); s.workOrder.memo=g('w_memo');
  }
  if(document.getElementById('matrixBody')){
    s.workOrder.colorSizeMatrix = readMatrixRowsFromDOM(currentSizes).filter(r=>r.color || Object.keys(r.qtyBySize).length);
  }
  if(document.getElementById('matBody')){
    s.workOrder.materials = readMatRowsFromDOM().filter(r=>r.item||r.content);
  }
  if(g('p_material')!==undefined){
    s.production.steps = { material:g('p_material'), sewing:g('p_sewing'), qc:g('p_qc'), shipping:g('p_shipping') };
  }
  if(document.getElementById('shipBody')){
    s.production.shipments = readShipRowsFromDOM();
  }
  if(g('qc_total')!==undefined){
    s.production.qc = { totalQty:g('qc_total'), passQty:g('qc_pass'), failQty:g('qc_fail'), note:g('qc_note') };
  }
  if(g('c_containerDate')!==undefined){
    s.completion = {
      containerDate:g('c_containerDate'), shipDate:g('c_shipDate'), customsDate:g('c_customsDate'),
      logisticsCompany:g('c_logisticsCompany'), portArrival:g('c_portArrival'), note:g('c_note')
    };
  }
  // issues checkboxes
  document.querySelectorAll('.issueResolved').forEach(cb=>{
    const idx = +cb.dataset.idx;
    if(s.issues[idx]) s.issues[idx].resolved = cb.checked;
  });
}

function renderModalStage(){
  const s = workingCopy;
  document.getElementById('modalSub').textContent = `${s.brand||'브랜드 미정'} · ${s.season||'시즌 미정'}`;
  document.getElementById('stagePills').innerHTML = ['기획','작지서','생산','완료'].map(st=>
    `<div class="pill ${s.stage===st?'active':''}" data-stage="${st}">${st}</div>`).join('');
  document.getElementById('contextLine').innerHTML = s.stage==='기획' ? '' : `
    <span><b>${s.styleNo || '스타일번호 미정'}</b></span>
    <span>${s.itemName||'(이름 없음)'}</span>
    <span>${s.brand||'-'} / ${s.season||'-'}</span>
  `;
  document.getElementById('modalBody').innerHTML = stageBodyHtml(s);

  wireStageWidgets(s);
}

// event delegation: one listener on the pills container survives re-renders,
// and errors in one field's sync never block switching tabs
document.getElementById('stagePills').addEventListener('click', (e)=>{
  const p = e.target.closest('.pill');
  if(!p || !workingCopy) return;
  try{ syncCurrentSectionIntoWorkingCopy(); }
  catch(err){ console.error('sync error (ignored, tab switch continues):', err); }
  workingCopy.stage = p.dataset.stage;
  renderModalStage();
});

}

function readMatrixRowsFromDOM(sizes){
  const rows = [];
  document.querySelectorAll('#matrixBody tr').forEach(tr=>{
    const color = tr.querySelector('.mColor').value;
    const qtyBySize = {};
    tr.querySelectorAll('.mCell').forEach(inp=>{
      if(inp.value!=='') qtyBySize[inp.dataset.size] = inp.value;
    });
    rows.push({color, qtyBySize});
  });
  return rows;
}
function readMatRowsFromDOM(){
  const rows = [];
  document.querySelectorAll('#matBody tr').forEach(tr=>{
    rows.push({
      item: tr.querySelector('.matItem').value, spec: tr.querySelector('.matSpec').value,
      content: tr.querySelector('.matContent').value, qty: tr.querySelector('.matQty').value,
      note: tr.querySelector('.matNote').value
    });
  });
  return rows;
}
function readShipRowsFromDOM(){
  const rows = [];
  document.querySelectorAll('#shipBody tr').forEach(tr=>{
    rows.push({
      type: tr.querySelector('.shipType').value, qty: tr.querySelector('.shipQty').value,
      date: tr.querySelector('.shipDate').value, note: tr.querySelector('.shipNote').value
    });
  });
  return rows.filter(r=>r.qty || r.date || r.note);
}

function rebuildMatrix(sizes, colorNames){
  const existing = readMatrixRowsFromDOM(currentSizes);
  const byColor = {};
  existing.forEach(r=>{ if(r.color) byColor[r.color] = r.qtyBySize; });
  currentSizes = sizes;
  let rows;
  if(colorNames && colorNames.length){
    rows = colorNames.map(c=> ({ color:c, qtyBySize: byColor[c] || {} }));
  } else {
    rows = existing.length ? existing : [{color:'', qtyBySize:{}}];
  }
  document.getElementById('matrixHeadRow').innerHTML = matrixHeadHtml(currentSizes);
  document.getElementById('matrixBody').innerHTML = rows.map(r=>matrixRowHtml(r, currentSizes)).join('');
  bindMatrixRowEvents();
}
function bindMatrixRowEvents(){
  document.querySelectorAll('#matrixBody .delRow').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.target.closest('tr').remove(); recalcTotals(); });
  });
  document.querySelectorAll('#matrixBody .mCell').forEach(inp=>{
    inp.addEventListener('input', recalcTotals);
  });
}
function recalcTotals(){
  document.querySelectorAll('#matrixBody tr').forEach(tr=>{
    let total = 0;
    tr.querySelectorAll('.mCell').forEach(inp=> total += Number(inp.value)||0 );
    tr.querySelector('.total').textContent = total || '';
  });
}
function bindMatRowEvents(){
  document.querySelectorAll('#matBody .delRow').forEach(btn=>{
    btn.addEventListener('click', (e)=> e.target.closest('tr').remove());
  });
}
function bindShipRowEvents(){
  document.querySelectorAll('#shipBody .delRow').forEach(btn=>{
    btn.addEventListener('click', (e)=> e.target.closest('tr').remove());
  });
}

function wireFileUpload(s){
  const fileInput = document.getElementById('fileInput');
  const rewire = ()=>{
    const btnUp = document.getElementById('btnUploadFile');
    if(btnUp) btnUp.addEventListener('click', ()=> fileInput.click());
    const btnDown = document.getElementById('btnDownloadFile');
    if(btnDown) btnDown.addEventListener('click', ()=>{
      const a = document.createElement('a');
      a.href = s.workOrder.fileDataUrl; a.download = s.workOrder.fileName || 'file';
      document.body.appendChild(a); a.click(); a.remove();
    });
    const thumb = document.getElementById('woThumb');
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(s.workOrder.fileDataUrl));
  };
  rewire();
  fileInput.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      s.workOrder.fileDataUrl = reader.result;
      s.workOrder.fileName = f.name;
      s.workOrder.fileType = f.type;
      document.getElementById('fileBox').innerHTML = fileBoxInnerHtml(s);
      rewire();
    };
    reader.readAsDataURL(f);
  });
}
function planFileBoxInnerHtml(s){
  const pf = s.planFile || {};
  if(!pf.fileDataUrl){
    return `
      <div class="doc-icon">파일<br>없음</div>
      <div class="info">
        <div class="fname">기획서 파일이 없습니다</div>
        <div class="fmeta">엑셀(xlsx/csv) 또는 이미지 파일을 올려주세요</div>
      </div>
      <div class="actions"><button type="button" class="small-btn" id="btnUploadPlanFile">파일 선택</button></div>
    `;
  }
  const isImg = pf.fileType && pf.fileType.startsWith('image/');
  const thumb = isImg
    ? `<img class="thumb" id="planThumb" src="${pf.fileDataUrl}">`
    : `<div class="doc-icon">EXCEL</div>`;
  return `
    ${thumb}
    <div class="info">
      <div class="fname">${esc(pf.fileName)}</div>
      <div class="fmeta">${isImg ? '클릭하면 확대해서 볼 수 있어요' : '엑셀 파일 - 업로드 시 아래 항목에 자동 반영됩니다'}</div>
    </div>
    <div class="actions"><button type="button" class="small-btn" id="btnUploadPlanFile">다시 업로드</button></div>
  `;
}
const PLAN_FIELD_ALIASES = {
  itemName: ['아이템/용도','아이템명','아이템','품목','상품명'],
  composition: ['구성'],
  colorComposition: ['컬러구성','컬러'],
  planQty: ['기획수량'],
  totalQty: ['총수량'],
  price: ['판매가','가격'],
  sizeRange: ['사이즈'],
  material: ['소재'],
  origin: ['원산지'],
  dueInDate: ['입고예정일','입고일'],
  launchDate: ['런칭희망일','런칭일']
};
function applyPlanExcelToFields(rowObj){
  Object.entries(PLAN_FIELD_ALIASES).forEach(([field, aliases])=>{
    for(const alias of aliases){
      if(rowObj[alias]!==undefined && rowObj[alias]!==''){
        const el = document.getElementById('f_'+field);
        if(el) el.value = rowObj[alias];
        break;
      }
    }
  });
}
function wirePlanFileUpload(s){
  const rewire = ()=>{
    const btn = document.getElementById('btnUploadPlanFile');
    if(btn) btn.addEventListener('click', ()=> document.getElementById('planFileInput').click());
    const thumb = document.getElementById('planThumb');
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(s.planFile.fileDataUrl));
  };
  rewire();
  const input = document.getElementById('planFileInput');
  input.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const isExcel = /\.(xlsx|xls|csv)$/i.test(f.name);
    const reader = new FileReader();
    reader.onload = ()=>{
      s.planFile = { fileDataUrl: isExcel ? '' : reader.result, fileName: f.name, fileType: f.type || (isExcel?'application/excel':'') };
      if(isExcel){
        try{
          const wb = XLSX.read(reader.result, { type:'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { defval:'' });
          if(rows.length){
            applyPlanExcelToFields(rows[0]);
            alert('엑셀 내용을 읽어 아래 항목에 채웠습니다. 내용을 확인하고 필요하면 직접 수정해주세요.');
          } else {
            alert('엑셀에서 데이터 행을 찾지 못했습니다. 직접 입력해주세요.');
          }
        }catch(err){
          alert('엑셀 파일을 읽는 중 문제가 발생했습니다. 직접 입력해주세요.');
        }
      }
      document.getElementById('planFileBox').innerHTML = planFileBoxInnerHtml(s);
      rewire();
    };
    if(isExcel) reader.readAsArrayBuffer(f); else reader.readAsDataURL(f);
  });
}

let lbScale = 1;
function openLightbox(src){
  lbScale = 1;
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxImg').style.transform = 'scale(1)';
  document.getElementById('lightbox').classList.add('show');
}
document.getElementById('lbClose').addEventListener('click', ()=> document.getElementById('lightbox').classList.remove('show'));
document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') document.getElementById('lightbox').classList.remove('show'); });
document.getElementById('lbZoomIn').addEventListener('click', ()=>{ lbScale=Math.min(4,lbScale+.25); document.getElementById('lightboxImg').style.transform=`scale(${lbScale})`; });
document.getElementById('lbZoomOut').addEventListener('click', ()=>{ lbScale=Math.max(.4,lbScale-.25); document.getElementById('lightboxImg').style.transform=`scale(${lbScale})`; });
document.getElementById('lbZoomReset').addEventListener('click', ()=>{ lbScale=1; document.getElementById('lightboxImg').style.transform='scale(1)'; });

/* ---------- wire per-stage widgets ---------- */
function wireStageWidgets(s){
  if(s.stage==='기획'){
    wirePlanFileUpload(s);
    wireIssueAdd(s);
    return;
  }
  if(s.stage==='작지서'){
    let sizes = (s.sizeRange||'').split('/').map(x=>x.trim()).filter(Boolean);
    if(sizes.length===0 && s.workOrder.colorSizeMatrix.length){
      const keySet = new Set();
      s.workOrder.colorSizeMatrix.forEach(r=> Object.keys(r.qtyBySize||{}).forEach(k=>keySet.add(k)));
      sizes = [...keySet];
    }
    currentSizes = sizes;
    document.getElementById('matrixHeadRow').innerHTML = matrixHeadHtml(currentSizes);
    document.getElementById('matrixBody').innerHTML = (s.workOrder.colorSizeMatrix||[]).map(r=>matrixRowHtml(r, currentSizes)).join('');
    bindMatrixRowEvents();

    document.getElementById('matBody').innerHTML = (s.workOrder.materials||[]).map(matRowHtml).join('');
    bindMatRowEvents();

    document.getElementById('applySizes').addEventListener('click', ()=>{
      const sizes2 = (document.getElementById('f_sizeRange').value||'').split('/').map(x=>x.trim()).filter(Boolean);
      const colors2 = (document.getElementById('f_colorComposition').value||'').split('/').map(x=>x.trim()).filter(Boolean);
      rebuildMatrix(sizes2, colors2);
    });
    document.getElementById('addMatrixRow').addEventListener('click', ()=>{
      const existing = readMatrixRowsFromDOM(currentSizes);
      existing.push({color:'', qtyBySize:{}});
      document.getElementById('matrixBody').innerHTML = existing.map(r=>matrixRowHtml(r, currentSizes)).join('');
      bindMatrixRowEvents();
    });
    document.getElementById('addMatRow').addEventListener('click', ()=>{
      const existing = readMatRowsFromDOM();
      existing.push({item:'', spec:'', content:'', qty:'', note:''});
      document.getElementById('matBody').innerHTML = existing.map(matRowHtml).join('');
      bindMatRowEvents();
    });
    wireFileUpload(s);
    wireIssueAdd(s);
    return;
  }
  if(s.stage==='생산'){
    bindShipRowEvents();
    document.getElementById('addShipRow').addEventListener('click', ()=>{
      const existing = readShipRowsFromDOM();
      existing.push({type:'부분출고', qty:'', date:'', note:''});
      document.getElementById('shipBody').innerHTML = existing.map(shipRowHtml).join('');
      bindShipRowEvents();
    });
    ['qc_total','qc_fail'].forEach(id=>{
      document.getElementById(id).addEventListener('input', ()=>{
        const total = Number(document.getElementById('qc_total').value)||0;
        const fail = Number(document.getElementById('qc_fail').value)||0;
        const badgeHost = document.getElementById('qc_note').closest('.section').querySelector('div[style*="margin-top:10px"]:last-child');
      });
    });
    wireIssueAdd(s);
    return;
  }
  if(s.stage==='완료'){
    wireIssueAdd(s);
    return;
  }
}
function wireIssueAdd(s){
  const btn = document.getElementById('addIssue');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    const inp = document.getElementById('newIssueContent');
    const val = inp.value.trim();
    if(!val) return;
    s.issues = s.issues || [];
    s.issues.push({stage:s.stage, content:val, company:'', date:new Date().toISOString().slice(0,10), resolved:false, memo:''});
    document.getElementById('issueList').innerHTML = s.issues.map(issueHtml).join('');
    inp.value='';
  });
}

/* ---------- save / delete ---------- */
document.getElementById('btnSave').addEventListener('click', ()=>{
  syncCurrentSectionIntoWorkingCopy();
  const s = workingCopy;
  if(editingId){
    const idx = DATA.findIndex(d=>d.id===editingId);
    DATA[idx] = s;
  } else {
    DATA.push(s);
  }
  saveAll();
  closeModal();
});
document.getElementById('btnDelete').addEventListener('click', ()=>{
  if(!editingId) return;
  if(!confirm('이 스타일을 삭제하시겠습니까? (완료 처리를 원하면 삭제 대신 "완료" 단계로 변경하세요)')) return;
  DATA = DATA.filter(d=>d.id!==editingId);
  saveAll(); closeModal();
});
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
document.getElementById('btnNew').addEventListener('click', ()=> openModal(null));
document.getElementById('btnSeed').addEventListener('click', ()=>{
  if(DATA.length && !confirm('기존 데이터가 있습니다. 테스트 데이터를 추가하시겠습니까?')) return;
  seedData();
});

['fBrand','fSeason','fStage','fSearch'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

render();
</script>
