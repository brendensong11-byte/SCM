<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERSO SCM - 패션 공급망 관리 시스템</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --border-color: #e1e4e8;
      --primary-color: #2563eb;
      --text-color: #1f2937;
      --text-muted: #6b7280;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --success-color: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; line-height: 1.5; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; font-weight: bold; }

    /* Controls & Filters */
    .controls-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; background: var(--card-bg); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    select, input { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem; }

    .btn { padding: 8px 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background-color: #6c757d; }

    /* Dashboard Summary */
    .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card { background: var(--card-bg); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .card .title { font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
    .card .value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
    .card.danger { border-left: 4px solid var(--danger-color); }
    .card.warning { border-left: 4px solid var(--warning-color); }
    .card.success { border-left: 4px solid var(--success-color); }

    /* Data Table */
    .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); }
    th { background-color: #f8fafc; font-weight: 600; color: var(--text-muted); }
    tr.clickable:hover { background-color: #f1f5f9; cursor: pointer; }

    /* Status Badges */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .badge-danger { background-color: #fee2e2; color: #991b1b; }
    .badge-warning { background-color: #fef3c7; color: #92400e; }
    .badge-success { background-color: #d1fae5; color: #065f46; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-body { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>VERSO SCM <span style="font-size: 0.9rem; color: var(--text-muted); font-weight: normal;">| 통합 공급망 관제</span></h1>
    <button class="btn" onclick="openModal('styleModal')">+ 신규 Style 등록</button>
  </header>

  <!-- 필터 관제 바 -->
  <div class="controls-bar">
    <div class="filter-group">
      <label for="seasonFilter">시즌</label>
      <select id="seasonFilter" onchange="renderTable()">
        <option value="ALL">전체 시즌</option>
        <option value="2026 FW" selected>2026 FW</option>
        <option value="2027 SS">2027 SS</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="brandFilter">브랜드</label>
      <select id="brandFilter" onchange="renderTable()">
        <option value="ALL">전체 브랜드</option>
        <option value="Brand A">Brand A</option>
        <option value="Brand B">Brand B</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="statusFilter">상태</label>
      <select id="statusFilter" onchange="renderTable()">
        <option value="ALL">전체 상태</option>
        <option value="🔴 지연">🔴 지연</option>
        <option value="🟡 진행">🟡 진행</option>
        <option value="🟢 완료">🟢 완료</option>
      </select>
    </div>
  </div>

  <!-- 대시보드 요약 -->
  <div class="summary-cards">
    <div class="card danger">
      <span class="title">지연 건수</span>
      <span class="value" id="cnt-delay">0</span>
    </div>
    <div class="card warning">
      <span class="title">진행중 건수</span>
      <span class="value" id="cnt-progress">0</span>
    </div>
    <div class="card success">
      <span class="title">완료 건수</span>
      <span class="value" id="cnt-complete">0</span>
    </div>
    <div class="card">
      <span class="title">총 관리 스타일</span>
      <span class="value" id="cnt-total">0</span>
    </div>
  </div>

  <!-- 스타일 목록 테이블 -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>스타일 번호</th>
          <th>상품명</th>
          <th>브랜드</th>
          <th>시즌</th>
          <th>현재 단계</th>
          <th>다음 주요 일정</th>
          <th>상태</th>
          <th>작업</th>
        </tr>
      </thead>
      <tbody id="styleTableBody">
        <!-- JS Dynamic Rendering -->
      </tbody>
    </table>
  </div>

  <!-- Modal: 신규 Style 등록 -->
  <div class="modal-overlay" id="styleModal">
    <div class="modal">
      <div class="modal-header">
        <h3>신규 Style 등록</h3>
        <button onclick="closeModal('styleModal')" style="border:none; background:none; cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>스타일 번호 (Style No)</label>
          <input type="text" id="newStyleNo" placeholder="예: ST26005">
        </div>
        <div class="form-group">
          <label>상품명</label>
          <input type="text" id="newProductName" placeholder="예: 헤비 코튼 후드">
        </div>
        <div class="form-group">
          <label>브랜드</label>
          <select id="newBrand">
            <option value="Brand A">Brand A</option>
            <option value="Brand B">Brand B</option>
          </select>
        </div>
        <div class="form-group">
          <label>시즌</label>
          <select id="newSeason">
            <option value="2026 FW">2026 FW</option>
            <option value="2027 SS">2027 SS</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('styleModal')">취소</button>
        <button class="btn" onclick="saveStyle()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Modal: 작업/발주 추가 -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="taskModalTitle">+ 작업/발주 추가</h3>
        <button onclick="closeModal('taskModal')" style="border:none; background:none; cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="taskTargetStyleId">
        <div class="form-group">
          <label>작업 구분</label>
          <select id="taskType">
            <option value="원사 발주">원사 발주</option>
            <option value="원단 발주">원단 발주</option>
            <option value="부자재 발주">부자재 발주</option>
            <option value="샘플 검토">샘플 검토</option>
            <option value="봉제 공정">봉제 공정</option>
            <option value="QC 검사">QC 검사</option>
          </select>
        </div>
        <div class="form-group">
          <label>거래처 / 공장명</label>
          <input type="text" id="taskSupplier" placeholder="예: 광저우 A 원단공장">
        </div>
        <div class="form-group">
          <label>다음 일정 (Target Date)</label>
          <input type="date" id="taskDate">
        </div>
        <div class="form-group">
          <label>진행 상태</label>
          <select id="taskStatus">
            <option value="🟡 진행">🟡 정상 진행</option>
            <option value="🔴 지연">🔴 지연</option>
            <option value="🟢 완료">🟢 완료</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('taskModal')">취소</button>
        <button class="btn" onclick="saveTask()">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Initial Mock Data Structure (독립 데이터 객체 구조 반영)
    const initialData = [
      { id: 'ST26001', name: '쫀쫀팬츠', brand: 'Brand A', season: '2026 FW', step: 'QC 검사', nextDate: '2026-08-14', status: '🟢 완료' },
      { id: 'ST26002', name: '와이드 슬랙스', brand: 'Brand A', season: '2026 FW', step: '원단 발주', nextDate: '2026-08-16', status: '🟡 진행' },
      { id: 'ST26003', name: '니트탑', brand: 'Brand B', season: '2026 FW', step: '샘플 수정', nextDate: '2026-08-12', status: '🔴 지연' },
      { id: 'ST26004', name: '옥스포드 셔츠', brand: 'Brand B', season: '2027 SS', step: '봉제 준비', nextDate: '2026-08-20', status: '🟡 진행' }
    ];

    // LocalStorage 초기화
    function loadStyles() {
      const stored = localStorage.getItem('verso_styles');
      if (!stored) {
        localStorage.setItem('verso_styles', JSON.stringify(initialData));
        return initialData;
      }
      return JSON.parse(stored);
    }

    // 2. Render Function (필터링 & UI 업데이트)
    function renderTable() {
      const styles = loadStyles();
      const seasonVal = document.getElementById('seasonFilter').value;
      const brandVal = document.getElementById('brandFilter').value;
      const statusVal = document.getElementById('statusFilter').value;

      const tbody = document.getElementById('styleTableBody');
      tbody.innerHTML = '';

      let cntDelay = 0, cntProgress = 0, cntComplete = 0;

      const filtered = styles.filter(item => {
        const matchSeason = seasonVal === 'ALL' || item.season === seasonVal;
        const matchBrand = brandVal === 'ALL' || item.brand === brandVal;
        const matchStatus = statusVal === 'ALL' || item.status === statusVal;
        return matchSeason && matchBrand && matchStatus;
      });

      filtered.forEach(item => {
        // Count Status
        if (item.status === '🔴 지연') cntDelay++;
        else if (item.status === '🟡 진행') cntProgress++;
        else if (item.status === '🟢 완료') cntComplete++;

        let badgeClass = 'badge-warning';
        if (item.status === '🔴 지연') badgeClass = 'badge-danger';
        if (item.status === '🟢 완료') badgeClass = 'badge-success';

        const tr = document.createElement('tr');
        tr.className = 'clickable';
        tr.innerHTML = `
          <td><strong>${item.id}</strong></td>
          <td>${item.name}</td>
          <td>${item.brand}</td>
          <td>${item.season}</td>
          <td>${item.step}</td>
          <td>${item.nextDate}</td>
          <td><span class="badge ${badgeClass}">${item.status}</span></td>
          <td>
            <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="openTaskModal('${item.id}', event)">+ 작업 추가</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Update Summary Cards
      document.getElementById('cnt-delay').innerText = cntDelay;
      document.getElementById('cnt-progress').innerText = cntProgress;
      document.getElementById('cnt-complete').innerText = cntComplete;
      document.getElementById('cnt-total').innerText = filtered.length;
    }

    // 3. Modal Handler
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function openTaskModal(styleId, event) {
      event.stopPropagation(); // 행 클릭 이벤트 전파 방지
      document.getElementById('taskTargetStyleId').value = styleId;
      document.getElementById('taskModalTitle').innerText = `+ 작업 추가 (${styleId})`;
      openModal('taskModal');
    }

    // 4. Save Actions
    function saveStyle() {
      const styleNo = document.getElementById('newStyleNo').value.trim();
      const name = document.getElementById('newProductName').value.trim();
      const brand = document.getElementById('newBrand').value;
      const season = document.getElementById('newSeason').value;

      if (!styleNo || !name) {
        alert('스타일 번호와 상품명을 입력해주세요.');
        return;
      }

      const styles = loadStyles();
      styles.push({
        id: styleNo,
        name: name,
        brand: brand,
        season: season,
        step: '신규 생성',
        nextDate: new Date().toISOString().split('T')[0],
        status: '🟡 진행'
      });

      localStorage.setItem('verso_styles', JSON.stringify(styles));
      closeModal('styleModal');
      
      // Reset Inputs
      document.getElementById('newStyleNo').value = '';
      document.getElementById('newProductName').value = '';

      renderTable();
    }

    function saveTask() {
      const styleId = document.getElementById('taskTargetStyleId').value;
      const type = document.getElementById('taskType').value;
      const nextDate = document.getElementById('taskDate').value;
      const status = document.getElementById('taskStatus').value;

      if (!nextDate) {
        alert('다음 일정을 선택해주세요.');
        return;
      }

      const styles = loadStyles();
      const targetIdx = styles.findIndex(s => s.id === styleId);

      if (targetIdx !== -1) {
        styles[targetIdx].step = type;
        styles[targetIdx].nextDate = nextDate;
        styles[targetIdx].status = status;
        localStorage.setItem('verso_styles', JSON.stringify(styles));
      }

      closeModal('taskModal');
      renderTable();
    }

    // Initial Load
    window.onload = renderTable;
  </script>
</body>
</html>
