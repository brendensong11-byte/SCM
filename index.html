<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPROJECT | Multi-Brand SCM</title>
  <style>
    :root {
      --navy: #17324d;
      --blue: #315d82;
      --line: #e5e9ee;
      --bg: #f5f7f9;
      --text: #18212b;
      --muted: #74808d;
      --soft: #eef3f7;
      --danger: #a33b3b;
      --ok: #356b52;
      --warn: #8a6331;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .wrap { max-width: 1500px; margin: auto; padding: 24px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .brand h1 { margin: 0; font-size: 22px; letter-spacing: -.5px; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    
    .actions { display: flex; gap: 8px; }
    .btn {
      border: 1px solid #cbd5df;
      background: #fff;
      color: var(--navy);
      border-radius: 7px;
      padding: 9px 14px;
      font-weight: 700;
    }
    .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn:hover { border-color: var(--blue); }

    .filters, .tabs, .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .filters { padding: 13px; display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters select { min-width: 150px; padding: 9px; border: 1px solid #d5dce3; border-radius: 7px; background: #fff; }
    
    .tabs { display: flex; gap: 3px; padding: 4px; margin-bottom: 14px; }
    .tab { border: 0; background: transparent; padding: 10px 18px; border-radius: 7px; color: var(--muted); font-weight: 700; }
    .tab.active { background: var(--soft); color: var(--navy); }

    .card { padding: 18px; margin-bottom: 14px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-head h2 { font-size: 15px; margin: 0; }

    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 11px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { font-size: 11px; color: var(--muted); background: #fafbfc; white-space: nowrap; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #fafcfe; }
    
    .style-no { font-weight: 800; color: var(--navy); }
    .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .badge { display: inline-block; padding: 4px 7px; border: 1px solid #d7dfe6; border-radius: 5px; font-size: 11px; font-weight: 700; background: #fff; }
    .badge.ok { color: var(--ok); border-color: #c8ddd1; background: #f4f9f6; }
    .badge.warn { color: var(--warn); border-color: #e5d5bd; background: #fdfbf7; }
    .badge.issue { color: var(--danger); border-color: #e5caca; background: #fdf6f6; }
    
    .progress { height: 7px; background: #edf1f4; border-radius: 10px; overflow: hidden; min-width: 110px; }
    .progress i { display: block; height: 100%; background: var(--blue); }
    .empty { text-align: center; padding: 40px; color: var(--muted); }

    /* 상세 화면 스타일 */
    .detail { display: none; }
    .detail.show { display: block; }
    .back { margin-bottom: 12px; }
    .detail-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .detail-title h2 { margin: 0; font-size: 21px; }

    .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .label { color: var(--muted); font-size: 12px; }

    /* 파이프라인 7단계 자동연동 카드리스트 */
    .pipeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .step { border: 1px solid var(--line); border-radius: 8px; padding: 12px 8px; background: #fff; text-align: center; }
    .step strong { display: block; font-size: 12px; margin-bottom: 4px; }
    .step .step-pct { font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
    .step.done { border-color: #bfd3c7; background: #fbfdfb; }
    .step.active { border-color: #9eb6ca; background: #f7fafc; }

    .material { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .material-head { display: flex; justify-content: space-between; gap: 8px; }
    .material h4 { margin: 0; font-size: 13px; }
    .material p { margin: 5px 0; color: var(--muted); font-size: 11px; }
    .material-actions { display: flex; gap: 6px; margin-top: 8px; }
    .small { padding: 5px 8px; font-size: 11px; }

    /* 모달 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(15,25,35,.42); align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .modal.show { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; width: min(650px, 100%); max-height: 90vh; overflow: auto; padding: 20px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-head h3 { margin: 0; }
    .x { border: 0; background: none; font-size: 22px; color: var(--muted); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .field { margin-bottom: 10px; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
    .field input, .field select, .field textarea { width: 100%; padding: 9px; border: 1px solid #d3dae1; border-radius: 7px; background: #fff; }
    .field textarea { min-height: 80px; resize: vertical; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }

    @media (max-width: 1024px) { .pipeline { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 600px) { .pipeline { grid-template-columns: repeat(2, 1fr); } .section-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="wrap">
  <!-- 상단 헤더 -->
  <header class="top">
    <div class="brand">
      <h1>JPROJECT</h1>
      <p>Multi-Brand Fashion SCM Engine</p>
    </div>
    <div class="actions">
      <button class="btn primary" onclick="openModal('style')">+ Style 등록</button>
    </div>
  </header>

  <div id="app">
    <!-- 메인 목록 화면 -->
    <section id="listView">
      <!-- 필터 바 -->
      <div class="filters">
        <select id="brandFilter" onchange="render()">
          <option value="ALL">전체 브랜드</option>
          <option>스노야</option>
          <option>모브온</option>
        </select>
        <select id="seasonFilter" onchange="render()">
          <option value="ALL">전체 시즌</option>
        </select>
        <select id="sortFilter" onchange="render()">
          <option value="progress">진행률 낮은 순</option>
          <option value="recent">최근 등록 순</option>
          <option value="style">Style No. 순</option>
        </select>
      </div>

      <!-- 탭 목록 -->
      <div class="tabs">
        <button class="tab active" data-status="ACTIVE" onclick="setStatus('ACTIVE')">진행 중</button>
        <button class="tab" data-status="DONE" onclick="setStatus('DONE')">완료 / 보관함</button>
      </div>

      <!-- 생산 진행 현황 테이블 -->
      <div class="card">
        <div class="card-head">
          <h2>생산 진행 현황</h2>
          <span class="sub">Style 행을 클릭하면 전체 생산 상세가 열립니다.</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>브랜드 / Style</th>
                <th>시즌</th>
                <th>상품명</th>
                <th>전체 진행률</th>
                <th>현재 단계</th>
                <th>납기</th>
                <th>이슈</th>
              </tr>
            </thead>
            <tbody id="styleList"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 제품 상세 화면 (아코디언/통합 영역) -->
    <section id="detailView" class="detail"></section>
  </div>
</div>

<!-- 동적 모달 팝업 -->
<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  // 로컬 스토리지 키 관리
  const KEY = 'JPROJECT_SCM_V1';
  let db = JSON.parse(localStorage.getItem(KEY) || 'null') || { styles: [] };
  let statusTab = 'ACTIVE', currentId = null;

  const stageKeys = ['design', 'sample', 'materialReady', 'productionReady', 'sewing', 'qc', 'pack'];
  const stageNames = ['디자인', '샘플', '자재 준비', '생산 준비', '봉제', 'QC/검품', '포장/입고'];

  function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(v = '') { return String(v).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])); }
  function dateDiff(d) { if (!d) return null; return Math.ceil((new Date(d) - new Date(new Date().toDateString())) / 86400000); }

  // 자동 진행률 & 단계 계산 함수 (하단 데이터 기반 자동 연동)
  function calcStageStats(s) {
    // 1. 자재준비 계산 (원단/원사 + 부자재 입고율 평균)
    const allMats = [...(s.materials || []), ...(s.trims || [])];
    let matPct = 0;
    if (allMats.length > 0) {
      const sum = allMats.reduce((acc, m) => acc + (m.orderQty ? Math.min(100, Math.round((m.receivedQty || 0) / m.orderQty * 100)) : 0), 0);
      matPct = Math.round(sum / allMats.length);
    }

    // 2. 봉제/생산 계산 (출고 수량 ÷ 목표 수량)
    const shippedQty = (s.shipments || []).reduce((sum, x) => sum + Number(x.qty || 0), 0);
    const prodPct = s.qty > 0 ? Math.min(100, Math.round((shippedQty / s.qty) * 100)) : 0;

    // 3. QC/검품 계산 (이슈 해결 비율)
    const totalIssues = (s.issues || []).length;
    const resolvedIssues = (s.issues || []).filter(x => x.done).length;
    const qcPct = totalIssues > 0 ? Math.round((resolvedIssues / totalIssues) * 100) : 100;

    return {
      design: s.design ? 100 : 0,
      sample: s.sample ? 100 : 0,
      materialReady: matPct,
      productionReady: (s.factory ? 50 : 0) + (matPct >= 100 ? 50 : 0),
      sewing: prodPct,
      qc: qcPct,
      pack: prodPct >= 100 && qcPct >= 100 ? 100 : 0
    };
  }

  function totalProgress(s) {
    const stats = calcStageStats(s);
    const values = Object.values(stats);
    return Math.round(values.reduce((a, b) => a + b, 0) / values.length);
  }

  function currentStage(s) {
    const p = totalProgress(s);
    if (p === 100) return '완료';
    const stats = calcStageStats(s);
    for (let i = stageKeys.length - 1; i >= 0; i--) {
      if (stats[stageKeys[i]] > 0) return stageNames[i];
    }
    return '디자인';
  }

  function issueCount(s) { return (s.issues || []).filter(x => !x.done).length; }
  function seasons() { return [...new Set(db.styles.map(s => s.season).filter(Boolean))].sort().reverse(); }

  function refreshSeasonFilter() {
    let el = document.getElementById('seasonFilter'), v = el.value || 'ALL';
    el.innerHTML = '<option value="ALL">전체 시즌</option>' + seasons().map(x => `<option>${esc(x)}</option>`).join('');
    if (seasons().includes(v)) el.value = v;
  }

  function setStatus(x) {
    statusTab = x;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.status === x));
    render();
  }

  // 메인 렌더링 함수
  function render() {
    refreshSeasonFilter();
    let brand = document.getElementById('brandFilter').value;
    let season = document.getElementById('seasonFilter').value;
    let sort = document.getElementById('sortFilter').value;

    let arr = db.styles.filter(s => (statusTab === 'DONE' ? s.done : s.done !== true) &&
      (brand === 'ALL' || s.brand === brand) &&
      (season === 'ALL' || s.season === season));

    if (sort === 'progress') arr.sort((a, b) => totalProgress(a) - totalProgress(b));
    if (sort === 'recent') arr.sort((a, b) => b.created - a.created);
    if (sort === 'style') arr.sort((a, b) => a.styleNo.localeCompare(b.styleNo));

    document.getElementById('styleList').innerHTML = arr.length
      ? arr.map(styleRow).join('')
      : `<tr><td colspan="7" class="empty">등록된 Style이 없습니다.</td></tr>`;
  }

  function styleRow(s) {
    let d = dateDiff(s.deadline);
    let p = totalProgress(s);
    return `
      <tr class="clickable" onclick="openDetail('${s.id}')">
        <td><span class="style-no">${esc(s.styleNo)}</span><span class="sub">${esc(s.brand)}</span></td>
        <td>${esc(s.season)}</td>
        <td>${esc(s.name)}</td>
        <td>
          <div style="display:flex;gap:8px;align-items:center">
            <div class="progress"><i style="width:${p}%"></i></div>
            <b>${p}%</b>
          </div>
        </td>
        <td>${currentStage(s)}</td>
        <td>${s.deadline ? esc(s.deadline) + ' ' + (d < 0 ? '<span class="badge issue">D+' + Math.abs(d) + '</span>' : d === 0 ? '<span class="badge warn">D-DAY</span>' : '<span class="badge">D-' + d + '</span>') : '-'}</td>
        <td>${issueCount(s) ? `<span class="badge issue">${issueCount(s)}건</span>` : '-'}</td>
      </tr>
    `;
  }

  // 상세 페이지 열기
  function openDetail(id) {
    currentId = id;
    let s = db.styles.find(x => x.id === id);
    if (!s) return;

    document.getElementById('listView').style.display = 'none';
    let d = document.getElementById('detailView');
    d.className = 'detail show';
    d.innerHTML = detailHTML(s);
    window.scrollTo(0, 0);
  }

  // 상세 페이지 HTML 구성 (자동 연동 파이프라인 7단계 포함)
  function detailHTML(s) {
    const stats = calcStageStats(s);
    const p = totalProgress(s);
    const d = dateDiff(s.deadline);

    return `
      <button class="btn back" onclick="backList()">← 목록으로</button>
      
      <!-- 제품 요약 카드 -->
      <div class="card">
        <div class="detail-title">
          <div>
            <h2>${esc(s.styleNo)} · ${esc(s.name)}</h2>
            <span class="sub">${esc(s.brand)} / ${esc(s.season)} · 목표수량 ${esc(s.qty || 0)}장 · 납기 ${esc(s.deadline || '-')}</span>
          </div>
          <div>
            ${s.done ? '<span class="badge ok">완료 / 보관</span>' : `<span class="badge">${p}% · ${currentStage(s)}</span>`}
          </div>
        </div>
        <div style="margin-top:18px">
          <div class="progress" style="height:10px"><i style="width:${p}%"></i></div>
        </div>
      </div>

      <!-- 7단계 실시간 파이프라인 (자동 계산 & D-DAY 표기) -->
      <div class="card">
        <div class="card-head">
          <h2>전체 생산 진행 단계 (자동 연동)</h2>
          <span class="sub">하단 데이터 수정을 통해 각 단계 진행률이 자동 산출됩니다.</span>
        </div>
        <div class="pipeline">
          ${stageNames.map((name, i) => {
            const k = stageKeys[i];
            const pctVal = stats[k];
            return `
              <div class="step ${pctVal >= 100 ? 'done' : pctVal > 0 ? 'active' : ''}">
                <strong>${name}</strong>
                <div class="step-pct">${pctVal}%</div>
                <div>${s.deadline ? (d < 0 ? `<span class="badge issue">D+${Math.abs(d)}</span>` : `<span class="badge">D-${d}</span>`) : ''}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <!-- 자재 / 봉제 / QC 데이터 관리 그리드 -->
      <div class="section-grid">
        <!-- 원단 / 원사 섹션 -->
        <div class="card">
          <div class="card-head">
            <h2>원단 / 원사</h2>
            <button class="btn small" onclick="openMaterialModal('fabric')">+ 추가</button>
          </div>
          ${(s.materials || []).length ? (s.materials || []).map((m, i) => materialHTML(s, m, i)).join('') : '<div class="empty">등록된 원단/원사가 없습니다.</div>'}
        </div>

        <!-- 부자재 섹션 -->
        <div class="card">
          <div class="card-head">
            <h2>부자재</h2>
            <button class="btn small" onclick="openMaterialModal('trim')">+ 추가</button>
          </div>
          ${(s.trims || []).length ? (s.trims || []).map((m, i) => materialHTML(s, m, i)).join('') : '<div class="empty">등록된 부자재가 없습니다.</div>'}
        </div>

        <!-- 봉제 / 생산 / 출고 섹션 -->
        <div class="card">
          <div class="card-head">
            <h2>봉제 / 생산 / 출고</h2>
            <button class="btn small" onclick="openProductionModal()">+ 생산정보</button>
          </div>
          <div class="row"><span class="label">봉제공장</span><span>${esc(s.factory || '-')}</span></div>
          <div class="row"><span class="label">생산 목표</span><span>${esc(s.qty || 0)} 장</span></div>
          <div class="row"><span class="label">누적 출고</span><span>${(s.shipments || []).reduce((n, x) => n + Number(x.qty || 0), 0)} 장</span></div>
          ${(s.shipments || []).map((x, i) => `
            <div class="material">
              <b>${i + 1}차 출고</b>
              <p>${esc(x.date || '-')} · ${esc(x.qty || 0)}장 · ${esc(x.note || '')}</p>
              <div class="material-actions"><button class="btn small" onclick="deleteShipment(${i})">삭제</button></div>
            </div>
          `).join('')}
        </div>

        <!-- QC / 생산 이슈 섹션 -->
        <div class="card">
          <div class="card-head">
            <h2>QC / 생산 이슈</h2>
            <button class="btn small" onclick="openIssueModal()">+ 이슈 등록</button>
          </div>
          ${(s.issues || []).length ? (s.issues || []).map((x, i) => `
            <div class="material">
              <div class="material-head">
                <h4>${esc(x.title)}</h4>
                <span class="badge ${x.done ? 'ok' : 'issue'}">${x.done ? '해결' : '진행중'}</span>
              </div>
              <p>${esc(x.note || '')} · ${esc(x.date || '-')}</p>
              <div class="material-actions">
                ${!x.done ? `<button class="btn small" onclick="resolveIssue(${i})">해결 처리</button>` : ''}
                <button class="btn small" onclick="deleteIssue(${i})">삭제</button>
              </div>
            </div>
          `).join('') : '<div class="empty">등록된 이슈가 없습니다.</div>'}
        </div>
      </div>

      <!-- 기본 정보 카드 -->
      <div class="card">
        <div class="card-head">
          <h2>기본 정보</h2>
          <div>
            <button class="btn small" onclick="openStyleEdit()">수정</button>
            <button class="btn small" onclick="toggleDone()">${s.done ? '진행으로 복귀' : '완료 / 보관'}</button>
          </div>
        </div>
        <div class="row"><span class="label">설명</span><span>${esc(s.note || '-')}</span></div>
      </div>
    `;
  }

  function materialHTML(s, m, i) {
    let ratio = m.orderQty ? Math.min(100, Math.round((m.receivedQty || 0) / m.orderQty * 100)) : 0;
    return `
      <div class="material">
        <div class="material-head">
          <h4>${esc(m.name)} <span class="badge">${m.type === 'yarn' ? '원사' : '원단'}${m.process ? ' · ' + esc(m.process) : ''}</span></h4>
          <span class="badge ${ratio >= 100 ? 'ok' : ratio ? 'warn' : ''}">${ratio >= 100 ? '입고완료' : ratio ? '부분입고' : '발주/대기'}</span>
        </div>
        <p>업체: ${esc(m.supplier || '-')} · 발주 ${esc(m.orderQty || 0)} · 입고 ${esc(m.receivedQty || 0)} · 예정일 ${esc(m.dueDate || '-')}</p>
        <div class="progress"><i style="width:${ratio}%"></i></div>
        <div class="material-actions">
          <button class="btn small" onclick="receiveMaterial(${i},'${m.type}')">입고 수량 입력</button>
          <button class="btn small" onclick="deleteMaterial(${i},'${m.type}')">삭제</button>
        </div>
      </div>
    `;
  }

  function backList() {
    currentId = null;
    document.getElementById('detailView').className = 'detail';
    document.getElementById('listView').style.display = 'block';
    render();
  }

  function closeModal() { document.getElementById('modal').classList.remove('show'); }
  function showModal(title, body) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modal').classList.add('show');
  }

  /* 신규 등록 및 수정 처리 함수들 */
  function openModal(type) {
    if (type === 'style') {
      showModal('신규 Style 등록', `
        <form onsubmit="addStyle(event)">
          <div class="form-grid">
            <div class="field"><label>브랜드</label><select name="brand"><option>스노야</option><option>모브온</option></select></div>
            <div class="field"><label>시즌</label><input name="season" placeholder="26FW" required></div>
            <div class="field"><label>Style No.</label><input name="styleNo" placeholder="ST26001" required></div>
            <div class="field"><label>상품명</label><input name="name" required></div>
            <div class="field"><label>목표수량</label><input name="qty" type="number" min="0"></div>
            <div class="field"><label>납기</label><input name="deadline" type="date"></div>
            <div class="field full"><label>메모</label><textarea name="note"></textarea></div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn" onclick="closeModal()">취소</button>
            <button class="btn primary">등록</button>
          </div>
        </form>
      `);
    }
  }

  function addStyle(e) {
    e.preventDefault();
    let f = new FormData(e.target);
    db.styles.push({
      id: uid(), brand: f.get('brand'), season: f.get('season'), styleNo: f.get('styleNo'),
      name: f.get('name'), qty: Number(f.get('qty') || 0), deadline: f.get('deadline'), note: f.get('note'),
      created: Date.now(), done: false, design: true, sample: false,
      materials: [], trims: [], shipments: [], issues: []
    });
    save(); closeModal(); render();
  }

  function openMaterialModal(type) {
    showModal(type === 'yarn' ? '원사 추가' : type === 'fabric' ? '원단 추가' : '부자재 추가', `
      <form onsubmit="addMaterial(event,'${type}')">
        <div class="form-grid">
          <div class="field"><label>자재명</label><input name="name" required></div>
          <div class="field"><label>구분</label><select name="kind"><option value="fabric">원단</option><option value="yarn">원사</option></select></div>
          <div class="field"><label>공급처</label><input name="supplier"></div>
          <div class="field"><label>발주 수량</label><input name="orderQty" type="number" min="0"></div>
          <div class="field"><label>입고 수량</label><input name="receivedQty" type="number" min="0" value="0"></div>
          <div class="field"><label>입고 예정일</label><input name="dueDate" type="date"></div>
          <div class="field full"><label>공정 / 메모</label><input name="process" placeholder="예: 편직 → 염색 → 가공"></div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn" onclick="closeModal()">취소</button>
          <button class="btn primary">저장</button>
        </div>
      </form>
    `);
  }

  function addMaterial(e, type) {
    e.preventDefault();
    let s = db.styles.find(x => x.id === currentId), f = new FormData(e.target);
    let m = {
      id: uid(), type: f.get('kind'), name: f.get('name'), supplier: f.get('supplier'),
      orderQty: Number(f.get('orderQty') || 0), receivedQty: Number(f.get('receivedQty') || 0),
      dueDate: f.get('dueDate'), process: f.get('process')
    };
    (type === 'trim' ? s.trims : s.materials).push(m);
    save(); closeModal(); openDetail(currentId);
  }

  function receiveMaterial(i, type) {
    let s = db.styles.find(x => x.id === currentId), a = type === 'trim' ? s.trims : s.materials, m = a[i];
    showModal('입고 수량 입력', `
      <form onsubmit="saveReceive(event,'${type}',${i})">
        <div class="field"><label>${esc(m.name)} / 발주 ${m.orderQty}</label><input name="qty" type="number" min="0" value="${m.receivedQty || 0}" required></div>
        <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">저장</button></div>
      </form>
    `);
  }

  function saveReceive(e, type, i) {
    e.preventDefault();
    let s = db.styles.find(x => x.id === currentId), a = type === 'trim' ? s.trims : s.materials;
    a[i].receivedQty = Number(new FormData(e.target).get('qty'));
    save(); closeModal(); openDetail(currentId);
  }

  function deleteMaterial(i, type) {
    if (!confirm('삭제할까요?')) return;
    let s = db.styles.find(x => x.id === currentId);
    (type === 'trim' ? s.trims : s.materials).splice(i, 1);
    save(); openDetail(currentId);
  }

  function openProductionModal() {
    showModal('봉제 / 생산 정보', `
      <form onsubmit="saveProduction(event)">
        <div class="form-grid">
          <div class="field full"><label>봉제 공장</label><input name="factory" value="${esc(db.styles.find(x => x.id === currentId).factory || '')}"></div>
          <div class="field"><label>출고 수량</label><input name="shipQty" type="number" min="0"></div>
          <div class="field"><label>출고일</label><input name="shipDate" type="date"></div>
          <div class="field full"><label>메모</label><input name="shipNote"></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">저장</button></div>
      </form>
    `);
  }

  function saveProduction(e) {
    e.preventDefault();
    let s = db.styles.find(x => x.id === currentId), f = new FormData(e.target);
    s.factory = f.get('factory');
    let q = Number(f.get('shipQty') || 0);
    if (q) s.shipments.push({ qty: q, date: f.get('shipDate'), note: f.get('shipNote') });
    save(); closeModal(); openDetail(currentId);
  }

  function deleteShipment(i) {
    let s = db.styles.find(x => x.id === currentId);
    if (confirm('출고 내역을 삭제할까요?')) { s.shipments.splice(i, 1); save(); openDetail(currentId); }
  }

  function openIssueModal() {
    showModal('생산 이슈 등록', `
      <form onsubmit="addIssue(event)">
        <div class="field"><label>이슈 제목</label><input name="title" required></div>
        <div class="field"><label>발생일</label><input name="date" type="date"></div>
        <div class="field"><label>내용</label><textarea name="note"></textarea></div>
        <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">등록</button></div>
      </form>
    `);
  }

  function addIssue(e) {
    e.preventDefault();
    let s = db.styles.find(x => x.id === currentId), f = new FormData(e.target);
    s.issues.push({ title: f.get('title'), date: f.get('date'), note: f.get('note'), done: false });
    save(); closeModal(); openDetail(currentId);
  }

  function resolveIssue(i) {
    let s = db.styles.find(x => x.id === currentId);
    s.issues[i].done = true;
    save(); openDetail(currentId);
  }

  function deleteIssue(i) {
    let s = db.styles.find(x => x.id === currentId);
    if (confirm('이슈를 삭제할까요?')) { s.issues.splice(i, 1); save(); openDetail(currentId); }
  }

  function openStyleEdit() {
    let s = db.styles.find(x => x.id === currentId);
    showModal('Style 정보 수정', `
      <form onsubmit="saveStyleEdit(event)">
        <div class="form-grid">
          <div class="field"><label>상품명</label><input name="name" value="${esc(s.name)}"></div>
          <div class="field"><label>목표수량</label><input name="qty" type="number" value="${s.qty || 0}"></div>
          <div class="field"><label>납기</label><input name="deadline" type="date" value="${s.deadline || ''}"></div>
          <div class="field full"><label>메모</label><textarea name="note">${esc(s.note || '')}</textarea></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">저장</button></div>
      </form>
    `);
  }

  function saveStyleEdit(e) {
    e.preventDefault();
    let s = db.styles.find(x => x.id === currentId), f = new FormData(e.target);
    s.name = f.get('name');
    s.qty = Number(f.get('qty') || 0);
    s.deadline = f.get('deadline');
    s.note = f.get('note');
    save(); closeModal(); openDetail(currentId);
  }

  function toggleDone() {
    let s = db.styles.find(x => x.id === currentId);
    s.done = !s.done;
    save(); backList();
  }

  // 초기 실행
  render();
</script>
</body>
</html>
