<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCM 통합 관리 시스템 (Multi-Brand)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding: 20px; }
    
    /* 헤더 및 브랜드 선택기 */
    header { background: #fff; padding: 20px 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 20px; }
    h1 { font-size: 20px; font-weight: 700; color: #0f172a; }
    .brand-selector { padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; font-size: 14px; background: #f1f5f9; cursor: pointer; }

    /* 탭 메뉴 */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
    .tab-btn { padding: 12px 18px; border: none; background: none; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 700; }

    /* 섹션 카드 & 테이블 */
    .section-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .section-header { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 700; padding-bottom: 12px; border-bottom: 2px solid #f1f5f9; margin-bottom: 15px; }

    .btn-add { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-add:hover { background: #1d4ed8; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f8fafc; color: #475569; font-weight: 600; padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .badge-brand { background: #e0e7ff; color: #3730a3; }
    .badge-season { background: #fef3c7; color: #d97706; }
    .badge-status { background: #dcfce7; color: #15803d; }

    /* 파이프라인 타임라인 */
    .pipeline { display: flex; gap: 10px; margin-top: 10px; }
    .pipe-step { flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; text-align: center; }
    .pipe-step.active { border-color: #2563eb; background: #eff6ff; }
    .pipe-title { font-size: 11px; font-weight: 600; color: #64748b; }
    .pipe-status { font-size: 13px; font-weight: 700; color: #1e293b; margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>🏭 SCM 통합 관리 시스템</h1>
      <select id="brandFilter" class="brand-selector" onchange="renderData()">
        <option value="ALL">전체 브랜드 보기</option>
        <option value="BRD001">브랜드 스노야 (SNOYA)</option>
        <option value="BRD002">브랜드 모브온 (MOV ON)</option>
      </select>
    </div>
    <button class="btn-add" onclick="alert('신규 Style No. 등록 모달 준비 중')">+ 신규 Style 등록</button>
  </header>

  <!-- 메인 탭 Menu -->
  <div class="nav-tabs">
    <button class="tab-btn active">📊 Style & 생산 프로젝트</button>
    <button class="tab-btn">🧵 원자재 Master</button>
    <button class="tab-btn">🏭 공장/업체 Master</button>
    <button class="tab-btn">📋 전체 일정 현황</button>
  </div>

  <!-- Style 중심 프로젝트 데이터 카드 -->
  <div class="section-card">
    <div class="section-header">
      <span>📦 브랜드별 Style No. 생산 프로젝트 파이프라인</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>브랜드</th>
          <th>시즌</th>
          <th>Style No.</th>
          <th>상품명</th>
          <th>목표 수량</th>
          <th>생산 파이프라인 현황</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody id="styleProjectList">
        <!-- JS 랜더링 영역 -->
      </tbody>
    </table>
  </div>

  <script>
    // [데이터 모델 설계]: Brand -> Season -> Style No. -> Production Pipeline Structure
    const DB = {
      brands: [
        { id: "BRD001", name: "브랜드 스노야 (SNOYA)" },
        { id: "BRD002", name: "브랜드 모브온 (MOV ON)" }
      ],
      styles: [
        {
          styleNo: "ST26001",
          brandId: "BRD001",
          season: "2026 SS",
          name: "쫀쫀 슬림 팬츠",
          targetQty: "4,000개",
          status: "봉제 진행 중",
          pipeline: { fabric: "완료", subMaterial: "완료", sewing: "진행중", qc: "대기" }
        },
        {
          styleNo: "ST26002",
          brandId: "BRD002",
          season: "2026 FW",
          name: "오버핏 에어 티셔츠",
          targetQty: "2,500개",
          status: "원단 염색 중",
          pipeline: { fabric: "진행중", subMaterial: "대기", sewing: "대기", qc: "대기" }
        }
      ]
    };

    function renderData() {
      const selectedBrand = document.getElementById("brandFilter").value;
      const tbody = document.getElementById("styleProjectList");
      tbody.innerHTML = "";

      const filteredStyles = selectedBrand === "ALL" 
        ? DB.styles 
        : DB.styles.filter(s => s.brandId === selectedBrand);

      filteredStyles.forEach(style => {
        const brandObj = DB.brands.find(b => b.id === style.brandId);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="badge badge-brand">${brandObj ? brandObj.name : style.brandId}</span></td>
          <td><span class="badge badge-season">${style.season}</span></td>
          <td><b>${style.styleNo}</b></td>
          <td>${style.name}</td>
          <td>${style.targetQty}</td>
          <td>
            <div class="pipeline">
              <div class="pipe-step ${style.pipeline.fabric === '완료' ? 'active' : ''}">
                <div class="pipe-title">원단</div>
                <div class="pipe-status">${style.pipeline.fabric}</div>
              </div>
              <div class="pipe-step ${style.pipeline.subMaterial === '완료' ? 'active' : ''}">
                <div class="pipe-title">부자재</div>
                <div class="pipe-status">${style.pipeline.subMaterial}</div>
              </div>
              <div class="pipe-step ${style.pipeline.sewing === '진행중' ? 'active' : ''}">
                <div class="pipe-title">봉제공장</div>
                <div class="pipe-status">${style.pipeline.sewing}</div>
              </div>
              <div class="pipe-step">
                <div class="pipe-title">QC/검수</div>
                <div class="pipe-status">${style.pipeline.qc}</div>
              </div>
            </div>
          </td>
          <td><span class="badge badge-status">${style.status}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 초기 실행
    window.onload = renderData;
  </script>
</body>
</html>
