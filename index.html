<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERSO SCM - 통합 공급망 관제 시스템</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --border-color: #e1e4e8;
            --primary-color: #2563eb;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --tag-urgent-bg: #fee2e2; --tag-urgent-txt: #991b1b;
            --tag-soon-bg: #fef3c7;   --tag-soon-txt: #92400e;
            --tag-normal-bg: #d1fae5; --tag-normal-txt: #065f46;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; line-height: 1.5; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; font-weight: bold; }

        /* Navigation Tabs */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .tab-btn {
            padding: 10px 20px; font-weight: bold; font-size: 0.95rem; border: none; background: none;
            cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -2px;
        }
        .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Controls & Filters */
        .controls-bar {
            display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
            background: var(--card-bg); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .filter-group { display: flex; align-items: center; gap: 6px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        select, input { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem; }
        
        .btn {
            padding: 8px 14px; background-color: var(--primary-color); color: white; border: none;
            border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background-color: #6c757d; }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
        .btn-danger { background-color: #ef4444; }

        /* Summary Cards */
        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .card .title { font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
        .card .value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }

        /* Tables & Accordion */
        .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f8fafc; font-weight: 600; color: var(--text-muted); }
        
        tr.main-row { cursor: pointer; transition: background 0.2s; }
        tr.main-row:hover { background-color: #f1f5f9; }
        tr.main-row.open { background-color: #eff6ff; }

        /* Accordion Expansion Box */
        .accordion-row { display: none; background-color: #f8fafc; }
        .accordion-row.open { display: table-row; }
        .accordion-container { padding: 16px 20px; border-left: 4px solid var(--primary-color); }

        /* Step Process Bar (진행 공정 바) */
        .step-process-bar { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .step-item {
            flex: 1; min-width: 130px; background: #e2e8f0; padding: 8px 12px; border-radius: 6px;
            font-size: 0.8rem; text-align: center; font-weight: bold; color: var(--text-muted); position: relative;
        }
        .step-item.active { background: #3b82f6; color: white; }
        .step-item.done { background: #10b981; color: white; }
        .step-item.stuck { background: #f59e0b; color: white; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* D-Day Badges */
        .dday-tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .tag-urgent { background-color: var(--tag-urgent-bg); color: var(--tag-urgent-txt); }
        .tag-soon { background-color: var(--tag-soon-bg); color: var(--tag-soon-txt); }
        .tag-normal { background-color: var(--tag-normal-bg); color: var(--tag-normal-txt); }

        /* Progress Bar (진행률 %) */
        .progress-container { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 160px; }
        .progress-bar-bg { flex: 1; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #1d4ed8); border-radius: 5px; transition: width 0.3s; }
        .progress-text { font-size: 0.8rem; font-weight: bold; min-width: 35px; text-align: right; }

        /* Sub Table */
        .sub-table { width: 100%; background: white; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); margin-top: 10px; }
        .sub-table th { background: #edf2f7; font-size: 0.8rem; }
        .sub-table td { font-size: 0.85rem; padding: 8px 12px; }

        /* Calendar View */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .cal-day-header { text-align: center; font-weight: bold; font-size: 0.85rem; color: var(--text-muted); padding: 6px 0; }
        .cal-cell { min-height: 90px; background: #fafafa; border: 1px solid #edf2f7; border-radius: 4px; padding: 4px; font-size: 0.75rem; }
        .cal-cell .date-num { font-weight: bold; color: var(--text-muted); margin-bottom: 4px; }
        .cal-event { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 2px 4px; border-radius: 3px; margin-bottom: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .cal-event.final { background: #dcfce7; color: #15803d; border-color: #bbf7d0; font-weight: bold; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; width: 90%; max-width: 450px; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .modal-body { display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    </style>
</head>
<body>

<header>
    <h1>VERSO SCM <span style="font-size: 0.9rem; color: var(--text-muted); font-weight: normal;">| 통합 관제 시스템</span></h1>
    <button class="btn" onclick="openModal('styleModal')">+ 신규 Style 등록</button>
</header>

<!-- 메인 상단 탭 -->
<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('workerTab', this)">📋 Work Management (작업 관리)</button>
    <button class="tab-btn" onclick="switchTab('executiveTab', this)">📅 Master Roadmap (통합 진행률)</button>
</div>

<!-- ================= 탭 1: Work Management (작업 관리) ================= -->
<div id="workerTab" class="tab-content active">
    <div class="controls-bar">
        <div class="filter-group">
            <label for="searchInput">검색</label>
            <input type="text" id="searchInput" placeholder="상품명 또는 스타일 번호..." onkeyup="renderWorkerTable()">
        </div>
        <div class="filter-group">
            <label for="seasonFilter">시즌</label>
            <select id="seasonFilter" onchange="renderWorkerTable()">
                <option value="ALL">전체 시즌</option> <option value="2026 FW" selected>2026 FW</option> <option value="2027 SS">2027 SS</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="brandFilter">브랜드</label>
            <select id="brandFilter" onchange="renderWorkerTable()">
                <option value="ALL">전체 브랜드</option> <option value="Brand A">Brand A</option> <option value="Brand B">Brand B</option>
            </select>
        </div>
    </div>

    <div class="summary-cards">
        <div class="card"><span class="title">입고 임박/경과 (D-Day 이하)</span><span class="value" id="cnt-urgent">0</span></div>
        <div class="card"><span class="title">3일 이내 입고 예정 (D-1~3)</span><span class="value" id="cnt-soon">0</span></div>
        <div class="card"><span class="title">여유 있음 (D-4 이상)</span><span class="value" id="cnt-normal">0</span></div>
        <div class="card"><span class="title">총 관리 스타일</span><span class="value" id="cnt-total">0</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 30px;"></th>
                    <th>스타일 번호</th>
                    <th>상품명</th>
                    <th>브랜드 / 시즌</th>
                    <th>등록 부자재</th>
                    <th>최종 입고 예정일</th>
                    <th>D-Day</th>
                    <th>진행률 (%)</th>
                </tr>
            </thead>
            <tbody id="styleTableBody"></tbody>
        </table>
    </div>
</div>

<!-- ================= 탭 2: Master Roadmap (통합 진행률) ================= -->
<div id="executiveTab" class="tab-content">
    <div class="controls-bar" style="justify-content: space-between;">
        <div style="display:flex; align-items:center; gap:12px;">
            <button class="btn btn-secondary btn-sm" onclick="changeMonth(-1)">◀ 이전달</button>
            <h3 id="calMonthTitle" style="font-size: 1.1rem;">2026년 8월</h3>
            <button class="btn btn-secondary btn-sm" onclick="changeMonth(1)">다음달 ▶</button>
        </div>
        <span style="font-size: 0.85rem; color: var(--text-muted);">* 달력 내 항목 클릭 시 Work Management 탭의 해당 항목으로 연동됩니다.</span>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <h3 style="margin: 24px 0 12px 0; font-size: 1.1rem;">📊 스타일별 전체 공정 현황</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>스타일 번호</th>
                    <th>상품명</th>
                    <th>완제품 목표 입고일</th>
                    <th>공정 진행률 (%)</th>
                    <th>상태 요약</th>
                </tr>
            </thead>
            <tbody id="execProgressTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Modal: 신규 Style 등록 -->
<div class="modal-overlay" id="styleModal">
    <div class="modal">
        <div class="modal-header">
            <h3>신규 Style 등록</h3>
            <button onclick="closeModal('styleModal')" style="border:none; background:none; cursor:pointer;">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group"><label>스타일 번호</label><input type="text" id="newStyleNo" placeholder="예: ST26005"></div>
            <div class="form-group"><label>상품명</label><input type="text" id="newProductName" placeholder="예: 쫀쫀팬츠"></div>
            <div class="form-group">
                <label>브랜드</label>
                <select id="newBrand"><option value="Brand A">Brand A</option><option value="Brand B">Brand B</option></select>
            </div>
            <div class="form-group">
                <label>시즌</label>
                <select id="newSeason"><option value="2026 FW">2026 FW</option><option value="2027 SS">2027 SS</option></select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('styleModal')">취소</button>
            <button class="btn" onclick="saveStyle()">저장하기</button>
        </div>
    </div>
</div>

<script>
// 데이터 구조
const initialData = [
    {
        id: 'ST26001', name: '쫀쫀팬츠', brand: 'Brand A', season: '2026 FW', finalDelivery: '2026-10-15',
        items: [
            { name: 'YKK 지퍼', supplier: 'YKK 코리아', qty: '1,000 EA', orderDate: '2026-08-01', dueDate: '2026-08-12', memo: '출고 준비 중', completed: false },
            { name: '메인 라벨', supplier: '태양기획', qty: '2,000 EA', orderDate: '2026-08-02', dueDate: '2026-08-15', memo: '', completed: true },
            { name: '메인 단추', supplier: '금성단추', qty: '1,000 EA', orderDate: '2026-08-03', dueDate: '2026-08-18', memo: '도금 진행중', completed: false }
        ]
    },
    {
        id: 'ST26002', name: '와이드 슬랙스', brand: 'Brand A', season: '2026 FW', finalDelivery: '2026-09-30',
        items: [
            { name: '케어 라벨', supplier: '태양기획', qty: '500 EA', orderDate: '2026-08-05', dueDate: '2026-08-10', memo: '입고 완료', completed: true }
        ]
    }
];

let expandedStyleId = null;
let currentCalDate = new Date(2026, 7, 1);

function loadStyles() {
    const stored = localStorage.getItem('verso_styles_v4');
    if (!stored) {
        localStorage.setItem('verso_styles_v4', JSON.stringify(initialData));
        return initialData;
    }
    return JSON.parse(stored);
}

function saveStylesToStorage(data) {
    localStorage.setItem('verso_styles_v4', JSON.stringify(data));
}

// D-Day 계산
function calculateDDay(targetDateStr) {
    if (!targetDateStr) return { text: '-', diffDays: 999, tagClass: 'tag-normal' };
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(targetDateStr);
    target.setHours(0, 0, 0, 0);
    
    const diffTime = target - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    if (diffDays === 0) return { text: 'D-Day', diffDays: 0, tagClass: 'tag-urgent' };
    if (diffDays < 0) return { text: `D+${Math.abs(diffDays)}`, diffDays: diffDays, tagClass: 'tag-urgent' };
    if (diffDays <= 3) return { text: `D-${diffDays}`, diffDays: diffDays, tagClass: 'tag-soon' };
    return { text: `D-${diffDays}`, diffDays: diffDays, tagClass: 'tag-normal' };
}

// 공정 진행률 (%) 자동 계산
function calculateProgress(item) {
    if (!item.items || item.items.length === 0) return 10;
    const totalItems = item.items.length;
    let completedItems = 0;
    
    item.items.forEach(sub => {
        if (sub.completed) completedItems++;
    });

    const subProgress = Math.round((completedItems / totalItems) * 70);
    const finalBonus = item.finalDelivery ? 10 : 0;
    return Math.min(100, 20 + subProgress + finalBonus);
}

// 1. 아코디언 방식의 작업 관리 테이블 랜더링
function renderWorkerTable() {
    const styles = loadStyles();
    const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
    const seasonVal = document.getElementById('seasonFilter').value;
    const brandVal = document.getElementById('brandFilter').value;
    const tbody = document.getElementById('styleTableBody');
    tbody.innerHTML = '';

    let cntUrgent = 0, cntSoon = 0, cntNormal = 0;

    const filtered = styles.filter(item => {
        const matchSearch = item.name.toLowerCase().includes(searchVal) || item.id.toLowerCase().includes(searchVal);
        const matchSeason = seasonVal === 'ALL' || item.season === seasonVal;
        const matchBrand = brandVal === 'ALL' || item.brand === brandVal;
        return matchSearch && matchSeason && matchBrand;
    });

    filtered.forEach(item => {
        let latestDueDate = '-';
        let minDiffDays = 999;
        let representativeDDay = { text: '-', tagClass: 'tag-normal' };
        let uncompletedCount = 0;

        if (item.items && item.items.length > 0) {
            item.items.forEach(sub => {
                if (!sub.completed) uncompletedCount++;
                const dday = calculateDDay(sub.dueDate);
                if (dday.diffDays < minDiffDays) {
                    minDiffDays = dday.diffDays;
                    representativeDDay = dday;
                    latestDueDate = sub.dueDate;
                }
            });
        }

        if (minDiffDays <= 0) cntUrgent++;
        else if (minDiffDays <= 3) cntSoon++;
        else cntNormal++;

        const progress = calculateProgress(item);
        const isExpanded = (expandedStyleId === item.id);

        // 메인 행
        const trMain = document.createElement('tr');
        trMain.className = `main-row ${isExpanded ? 'open' : ''}`;
        trMain.onclick = () => toggleAccordion(item.id);
        trMain.innerHTML = `
            <td style="text-align:center;">${isExpanded ? '▲' : '▼'}</td>
            <td><strong>${item.id}</strong></td>
            <td><strong>${item.name}</strong></td>
            <td>${item.brand} / ${item.season}</td>
            <td>${item.items ? item.items.length : 0}개 항목 (${item.items ? item.items.length - uncompletedCount : 0} 완료)</td>
            <td>${latestDueDate}</td>
            <td><span class="dday-tag ${representativeDDay.tagClass}">${representativeDDay.text}</span></td>
            <td>
                <div class="progress-container">
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${progress}%;"></div></div>
                    <span class="progress-text">${progress}%</span>
                </div>
            </td>
        `;
        tbody.appendChild(trMain);

        // 아코디언 펼침 행
        const trSub = document.createElement('tr');
        trSub.className = `accordion-row ${isExpanded ? 'open' : ''}`;
        trSub.innerHTML = `
            <td colspan="8" style="padding: 0;">
                <div class="accordion-container">
                    ${renderStepProcessBar(item)}
                    
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; margin-bottom:8px;">
                        <h4 style="font-size:0.95rem;">📦 부자재 세부 리스트 및 입고 관리</h4>
                        <div style="display:flex; gap:8px;">
                            <span style="font-size:0.85rem; color:var(--text-muted); align-self:center;">완제품 목표일:</span>
                            <input type="date" value="${item.finalDelivery || ''}" onchange="updateFinalDelivery('${item.id}', this.value)" style="padding:2px 6px;">
                        </div>
                    </div>

                    ${renderSubItemsTable(item)}

                    <!-- 부자재 인라인 추가 폼 -->
                    <div style="background:#fff; padding:10px; border-radius:6px; border:1px solid var(--border-color); margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                        <strong style="font-size:0.85rem;">+ 부자재 추가:</strong>
                        <input type="text" id="add-name-${item.id}" placeholder="부자재명 (예: YKK 지퍼)" style="width:140px;">
                        <input type="text" id="add-supplier-${item.id}" placeholder="거래처" style="width:110px;">
                        <input type="text" id="add-qty-${item.id}" placeholder="수량/단위" style="width:90px;">
                        <input type="date" id="add-duedate-${item.id}" style="width:130px;">
                        <input type="text" id="add-memo-${item.id}" placeholder="메모" style="flex:1; min-width:120px;">
                        <button class="btn btn-sm" onclick="addInlineSubTask('${item.id}')">등록</button>
                    </div>
                </div>
            </td>
        `;
        tbody.appendChild(trSub);
    });

    document.getElementById('cnt-urgent').innerText = cntUrgent;
    document.getElementById('cnt-soon').innerText = cntSoon;
    document.getElementById('cnt-normal').innerText = cntNormal;
    document.getElementById('cnt-total').innerText = filtered.length;
}

// 공정 단계(병목) 프로그레스 바 생성
function renderStepProcessBar(item) {
    const total = item.items ? item.items.length : 0;
    const completed = item.items ? item.items.filter(i => i.completed).length : 0;
    
    let step2Class = 'step-item';
    let step2Text = '2. 부자재 진행';
    if (total > 0 && completed === total) {
        step2Class += ' done';
        step2Text = '2. 부자재 완료 ✓';
    } else if (total > 0) {
        step2Class += ' stuck';
        step2Text = `2. 부자재 대기중 (${completed}/${total})`;
    }

    return `
        <div style="font-size:0.85rem; font-weight:bold; margin-bottom:6px; color:var(--text-muted);">
            📌 현재 진행 단계 (병목 구간 확인):
        </div>
        <div class="step-process-bar">
            <div class="step-item done">1. 샘플/기획 ✓</div>
            <div class="${step2Class}">${step2Text}</div>
            <div class="step-item ${completed === total && total > 0 ? 'active' : ''}">3. 원단/봉제</div>
            <div class="step-item">4. 검수/QC</div>
            <div class="step-item ${item.finalDelivery && completed === total ? 'done' : ''}">5. 최종 입고</div>
        </div>
    `;
}

// 하위 부자재 세부 테이블 생성
function renderSubItemsTable(item) {
    if (!item.items || item.items.length === 0) {
        return `<div style="font-size:0.85rem; color:#888; padding:8px; background:white; border-radius:4px; text-align:center;">등록된 부자재가 없습니다. 아래 입력란에서 추가하세요.</div>`;
    }

    let rows = item.items.map((sub, idx) => {
        const dday = calculateDDay(sub.dueDate);
        return `
            <tr>
                <td style="text-align:center;">
                    <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleSubTaskComplete('${item.id}', ${idx})">
                </td>
                <td><strong style="${sub.completed ? 'text-decoration:line-through; color:#888;' : ''}">${sub.name}</strong></td>
                <td>${sub.supplier || '-'}</td>
                <td>${sub.qty || '-'}</td>
                <td>${sub.dueDate || '-'}</td>
                <td><span class="dday-tag ${sub.completed ? 'tag-normal' : dday.tagClass}">${sub.completed ? '입고완료' : dday.text}</span></td>
                <td>${sub.memo || '-'}</td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteSubTask('${item.id}', ${idx})">삭제</button></td>
            </tr>
        `;
    }).join('');

    return `
        <table class="sub-table">
            <thead>
                <tr>
                    <th style="width:40px;">입고</th>
                    <th>부자재/작업명</th>
                    <th>공급/거래처</th>
                    <th>수량</th>
                    <th>입고 예정일</th>
                    <th>D-Day</th>
                    <th>비고/메모</th>
                    <th style="width:50px;">삭제</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

// 아코디언 토글
function toggleAccordion(styleId) {
    expandedStyleId = (expandedStyleId === styleId) ? null : styleId;
    renderWorkerTable();
}

// 부자재 체크박스 변경
function toggleSubTaskComplete(styleId, idx) {
    const styles = loadStyles();
    const target = styles.find(s => s.id === styleId);
    if (target && target.items[idx]) {
        target.items[idx].completed = !target.items[idx].completed;
        saveStylesToStorage(styles);
        renderWorkerTable();
        renderExecTable();
    }
}

// 완제품 목표일 변경
function updateFinalDelivery(styleId, dateVal) {
    const styles = loadStyles();
    const target = styles.find(s => s.id === styleId);
    if (target) {
        target.finalDelivery = dateVal;
        saveStylesToStorage(styles);
        renderExecTable();
    }
}

// 인라인 부자재 추가
function addInlineSubTask(styleId) {
    const name = document.getElementById(`add-name-${styleId}`).value.trim();
    if (!name) { alert('부자재명을 입력해주세요.'); return; }

    const newItem = {
        name: name,
        supplier: document.getElementById(`add-supplier-${styleId}`).value.trim(),
        qty: document.getElementById(`add-qty-${styleId}`).value.trim(),
        dueDate: document.getElementById(`add-duedate-${styleId}`).value,
        memo: document.getElementById(`add-memo-${styleId}`).value.trim(),
        completed: false
    };

    const styles = loadStyles();
    const target = styles.find(s => s.id === styleId);
    if (target) {
        if (!target.items) target.items = [];
        target.items.push(newItem);
        saveStylesToStorage(styles);
        renderWorkerTable();
        renderCalendar();
    }
}

function deleteSubTask(styleId, idx) {
    if (!confirm('이 부자재 항목을 삭제하시겠습니까?')) return;
    const styles = loadStyles();
    const target = styles.find(s => s.id === styleId);
    if (target) {
        target.items.splice(idx, 1);
        saveStylesToStorage(styles);
        renderWorkerTable();
        renderCalendar();
    }
}

// 2. 달력 관제 랜더링
function renderCalendar() {
    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    document.getElementById('calMonthTitle').innerText = `${year}년 ${month + 1}월`;

    const calGrid = document.getElementById('calendarGrid');
    calGrid.innerHTML = '';

    const days = ['일', '월', '화', '수', '목', '금', '토'];
    days.forEach(d => calGrid.innerHTML += `<div class="cal-day-header">${d}</div>`);

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        calGrid.innerHTML += `<div class="cal-cell" style="background:#f1f5f9;"></div>`;
    }

    const styles = loadStyles();

    for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let eventsHtml = '';

        styles.forEach(s => {
            if (s.items) {
                s.items.forEach(sub => {
                    if (sub.dueDate === dateStr) {
                        eventsHtml += `<div class="cal-event" onclick="jumpToStyle('${s.id}')">[${s.name}] ${sub.name}</div>`;
                    }
                });
            }
            if (s.finalDelivery === dateStr) {
                eventsHtml += `<div class="cal-event final" onclick="jumpToStyle('${s.id}')">🏁 [${s.name}] 완제품 입고</div>`;
            }
        });

        calGrid.innerHTML += `<div class="cal-cell"><div class="date-num">${day}</div>${eventsHtml}</div>`;
    }
}

function jumpToStyle(styleId) {
    switchTab('workerTab', document.querySelectorAll('.tab-btn')[0]);
    expandedStyleId = styleId;
    renderWorkerTable();
}

// 3. 하단 전체 공정 진행률 랜더링
function renderExecTable() {
    const styles = loadStyles();
    const tbody = document.getElementById('execProgressTableBody');
    tbody.innerHTML = '';

    styles.forEach(item => {
        const progress = calculateProgress(item);
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.onclick = () => jumpToStyle(item.id);
        tr.innerHTML = `
            <td><strong>${item.id}</strong></td>
            <td><strong>${item.name}</strong></td>
            <td>${item.finalDelivery || '미설정'}</td>
            <td>
                <div class="progress-container">
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${progress}%;"></div></div>
                    <span class="progress-text">${progress}%</span>
                </div>
            </td>
            <td>${progress >= 90 ? '🏁 완제품 입고 단계' : progress >= 50 ? '🟡 봉제/생산 진행 중' : '⚪ 부자재 입고 대기'}</td>
        `;
        tbody.appendChild(tr);
    });
}

function changeMonth(delta) {
    currentCalDate.setMonth(currentCalDate.getMonth() + delta);
    renderCalendar();
}

function switchTab(tabId, btnEl) {
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnEl.classList.add('active');
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function saveStyle() {
    const styleNo = document.getElementById('newStyleNo').value.trim();
    const name = document.getElementById('newProductName').value.trim();
    if (!styleNo || !name) { alert('스타일 번호와 상품명을 입력하세요.'); return; }

    const styles = loadStyles();
    styles.push({
        id: styleNo,
        name: name,
        brand: document.getElementById('newBrand').value,
        season: document.getElementById('newSeason').value,
        items: []
    });
    saveStylesToStorage(styles);

    closeModal('styleModal');
    document.getElementById('newStyleNo').value = '';
    document.getElementById('newProductName').value = '';
    renderWorkerTable();
    renderExecTable();
}

window.onload = () => {
    renderWorkerTable();
    renderCalendar();
    renderExecTable();
};
</script>
</body>
</html>
