<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J PROJECT · SCM </title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#FAFAFA; --paper:#FFFFFF; --ink:#111111; --ink-soft:#6B6B6B; --line:#ECECEC;
  --accent:#C4372B; --accent-soft:#FBEAE8; --soon:#946200; --soon-soft:#FBF2E0;
  --ok:#1E7A46; --ok-soft:#E6F4EC;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
  --sans: 'Pretendard', -apple-system, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
::selection{background:var(--accent-soft);}

header{
  padding:32px 40px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
  position:sticky; top:0; background:rgba(250,250,250,.86); backdrop-filter:blur(14px); z-index:10;
  border-bottom:1px solid var(--line);
}
.brandmark{display:flex; align-items:center; gap:12px;}
.brandmark .mark{ font-weight:800; font-size:13px; background:var(--ink); color:#fff; padding:6px 10px; border-radius:8px;}
.brandmark h1{font-size:19px; margin:0; font-weight:800; letter-spacing:-0.02em;}
.brandmark .sub{font-size:12px; color:var(--ink-soft); font-weight:500; margin-top:1px;}
.stats{display:flex; gap:32px; font-size:11px; color:var(--ink-soft); font-weight:600;}
.stats b{font-size:22px; display:block; font-weight:800; color:var(--ink); letter-spacing:-0.02em;}

.toolbar{ padding:16px 40px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
select, input[type=text], input[type=number], input[type=date], textarea{
  font-family:var(--sans); font-size:13px; border:1px solid var(--line);
  background:var(--paper); padding:9px 14px; color:var(--ink); border-radius:20px; transition:.15s var(--ease);
}
textarea{border-radius:12px;}
select:focus, input:focus, textarea:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(17,17,17,.06);}
.btn{
  font-weight:700; font-size:13px; cursor:pointer; border:1px solid var(--ink); background:var(--ink); color:#fff;
  padding:10px 20px; border-radius:24px; transition:.15s var(--ease);
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(17,17,17,.18);}
.btn.ghost{background:transparent; color:var(--ink);}
.btn.ghost:hover{background:var(--paper); box-shadow:0 2px 8px rgba(0,0,0,.06);}
.btn.danger{border-color:var(--accent); color:var(--accent); background:transparent;}
.btn.danger:hover{background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(196,55,43,.25);}
.spacer{flex:1;}

main{padding:8px 40px 80px;}
.section-heading{
  display:flex; align-items:center; gap:10px; margin:26px 0 10px;
  font-size:13px; font-weight:800; color:var(--ink-soft); letter-spacing:.02em;
}
.section-heading .line{flex:1; height:1px; background:var(--line);}
.list{display:flex; flex-direction:column; gap:8px;}
.row-item{
  display:grid; grid-template-columns:56px 1.6fr 1fr 140px 90px 1.4fr; align-items:center; gap:16px;
  padding:18px 20px; border-radius:16px; background:var(--paper); cursor:pointer; transition:.18s var(--ease);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.row-item:hover{transform:translateY(-2px) scale(1.002); box-shadow:0 10px 28px rgba(0,0,0,.09);}
.row-item.issue{box-shadow:0 1px 2px rgba(0,0,0,.04), inset 3px 0 0 var(--accent);}
.row-item.issue:hover{box-shadow:0 10px 28px rgba(196,55,43,.14), inset 3px 0 0 var(--accent);}
.row-item.done{opacity:.8;}
.row-item .rowno{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink-soft);}
.row-item .thumb-mini{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--bg);}
.row-item .namewrap{display:flex; align-items:center; gap:10px;}
.row-item .stagepill{
  font-size:10.5px; font-weight:700; color:var(--ink-soft); background:var(--bg);
  padding:3px 9px; border-radius:20px; white-space:nowrap; width:max-content; margin-top:6px;
}
.row-item .stagepill.done{background:var(--ok-soft); color:var(--ok);}
.row-item .name{font-weight:700; font-size:15px; letter-spacing:-0.01em;}
.row-item .styleno{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:3px;}
.row-item .brand-season{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
.row-item .progress-row{display:flex; align-items:center; gap:8px;}
.progress-bar{flex:1; height:4px; background:var(--line); border-radius:4px; position:relative; overflow:hidden;}
.progress-bar i{position:absolute; left:0; top:0; bottom:0; background:var(--ink); display:block; border-radius:4px; transition:width .3s var(--ease);}
.progress-pct{font-family:var(--mono); font-size:11px; width:30px; text-align:right; color:var(--ink-soft);}
.dday{font-family:var(--mono); font-size:12.5px; font-weight:700; text-align:right;}
.dday.ok{color:var(--ink-soft);} .dday.soon{color:var(--soon);} .dday.over{color:var(--accent); font-weight:800;} .dday.none{color:var(--line);}
.row-item .issue-note{ font-size:12px; color:var(--accent); font-weight:600; display:flex; gap:5px; align-items:flex-start; line-height:1.4;}
.row-item .colorinfo{font-size:12.5px; color:var(--ink-soft);}
.empty{padding:60px; text-align:center; color:var(--ink-soft); font-size:14px; border-radius:16px; background:var(--paper);}
@media (max-width:900px){ .row-item{grid-template-columns:40px 1fr; grid-template-areas:"no name" ". meta"; row-gap:6px;} }

.archive-group{margin-bottom:18px;}
.archive-group h4{font-size:13px; font-weight:800; margin:0 0 8px;}
.archive-group h5{font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:10px 0 6px;}

.overlay{
  position:fixed; inset:0; background:rgba(17,17,17,.42); display:none;
  align-items:flex-start; justify-content:center; padding:48px 20px; z-index:50; overflow-y:auto; backdrop-filter:blur(3px);
}
.overlay.show{display:flex;}
.modal{ background:var(--paper); width:100%; max-width:900px; border-radius:24px; margin-bottom:48px; box-shadow:0 30px 80px rgba(0,0,0,.25); overflow:hidden; }
.modal-head{
  padding:22px 30px; display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); z-index:2; border-bottom:1px solid var(--line);
}
.modal-head h2{margin:0; font-size:18px; font-weight:800; letter-spacing:-0.01em;}
.modal-head .sub{font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
.modal-head .close{cursor:pointer; font-size:14px; background:var(--bg); border:none; color:var(--ink-soft); width:30px; height:30px; border-radius:50%; transition:.15s;}
.modal-head .close:hover{background:var(--line); color:var(--ink);}
.modal-body{padding:24px 30px 4px;}
.section{margin-bottom:30px;}
.section-title{ font-size:12px; font-weight:800; letter-spacing:.02em; color:var(--ink); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
.field-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.field-grid.two{grid-template-columns:repeat(2,1fr);}
.field-grid.four{grid-template-columns:repeat(4,1fr);}
.field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field select, .field input, .field textarea{width:100%;}
.field textarea{resize:vertical; min-height:44px;}

table.dyn{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px;}
table.dyn th, table.dyn td{border-bottom:1px solid var(--line); padding:8px 8px;}
table.dyn th{background:transparent; font-weight:700; font-size:10.5px; color:var(--ink-soft); text-align:center;}
table.dyn th:first-child{text-align:left;}
table.dyn input, table.dyn select{border:none; width:100%; padding:4px; font-size:12.5px; background:transparent; text-align:center; border-radius:6px;}
table.dyn input:focus, table.dyn select:focus{outline:none; background:var(--bg);}
table.dyn input.colorname, table.dyn input.leftalign{text-align:left;}
table.dyn td.total{font-family:var(--mono); font-weight:800; text-align:center;}
.row-actions{margin-top:10px; display:flex; gap:8px;}
.small-btn{ font-size:12px; font-weight:700; border:1px solid var(--line); background:var(--paper); padding:6px 12px; cursor:pointer; border-radius:16px; transition:.15s var(--ease);}
.small-btn:hover{border-color:var(--ink); background:var(--bg);}
.small-btn.mini{padding:3px 9px; font-size:11px;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

.stage-pills{display:flex; gap:6px; padding:14px 30px 0;}
.pill{ font-size:12px; font-weight:700; padding:7px 14px; border:1px solid var(--line); cursor:pointer; background:var(--paper); border-radius:20px; transition:.15s var(--ease);}
.pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.pill:not(.active):hover{border-color:var(--ink);}

.context-line{ padding:10px 30px 0; font-size:12.5px; color:var(--ink-soft); font-weight:600; display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
.context-line b{color:var(--ink); font-weight:700;}
.context-line .completed-badge{background:var(--ok-soft); color:var(--ok); font-family:var(--mono); font-size:11px; font-weight:800; padding:2px 9px; border-radius:20px;}

.issue-item{background:var(--bg); padding:11px 14px; margin-bottom:8px; font-size:12.5px; border-radius:12px;}
.issue-item .meta{color:var(--ink-soft); font-size:11px; margin-top:4px;}
.modal-foot{padding:18px 30px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px;}

.filebox{ border:1.5px dashed var(--line); border-radius:16px; padding:18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.filebox .thumb{ width:84px; height:84px; border-radius:12px; object-fit:cover; cursor:zoom-in; background:var(--bg); border:1px solid var(--line);}
.filebox .doc-icon{ width:84px; height:84px; border-radius:12px; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--ink-soft); text-align:center; padding:6px;}
.filebox .info{flex:1; min-width:160px;}
.filebox .fname{font-weight:700; font-size:13px; word-break:break-all;}
.filebox .fmeta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.filebox .actions{display:flex; gap:8px;}

.lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:100; flex-direction:column; gap:14px;}
.lightbox.show{display:flex;}
.lightbox img{max-width:88vw; max-height:76vh; transition:transform .15s var(--ease); border-radius:6px;}
.lightbox .lbtools{display:flex; gap:8px;}
.lightbox .lbtools button{ font-family:var(--mono); font-size:13px; font-weight:700; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; padding:8px 14px; border-radius:20px; cursor:pointer;}
.lightbox .lbtools button:hover{background:rgba(255,255,255,.18);}

.badge{font-family:var(--mono); font-size:11px; font-weight:800; padding:3px 9px; border-radius:20px;}
.badge.pass{background:var(--ok-soft); color:var(--ok);}
.badge.fail{background:var(--accent-soft); color:var(--accent);}

.matcard{ border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
.matcard-head{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.matcard-head .grow{flex:1; min-width:120px;}
.matcard .fields{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px;}
.matcard .fields .field label{font-size:10px;}
.matcard .receiptbox{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:none;}
.matcard .receiptbox.open{display:block;}
.matcard .totals{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:8px;}
.matcard .totals b{color:var(--ink);}

.doclist{display:flex; flex-direction:column; gap:8px;}
.docrow{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:9px 12px;}
.docrow select{width:120px;}
.docrow .grow{flex:1;}
</style>
</head>
<body>

<header>
  <div class="brandmark">
    <span class="mark">JP</span>
    <div><h1>JPROJECT</h1><div class="sub">생산 관제</div></div>
  </div>
  <div class="stats" id="statsBar"></div>
</header>

<div class="toolbar">
  <select id="fBrand"><option value="">전체 브랜드</option></select>
  <select id="fSeason"><option value="">전체 시즌</option></select>
  <select id="fStage">
    <option value="">전체 단계</option>
    <option value="기획">기획</option>
    <option value="작지서">작업지시서</option>
    <option value="생산">생산</option>
    <option value="물류통관">물류·통관</option>
  </select>
  <input type="text" id="fSearch" placeholder="아이템명 · 스타일번호 검색" style="width:200px;">
  <div class="spacer"></div>
  <button class="btn ghost" id="btnSeed">테스트 데이터 넣기</button>
  <button class="btn ghost" id="btnBulkPlan">기획 엑셀 일괄 업로드</button>
  <input type="file" id="bulkPlanInput" accept=".xlsx,.xls,.csv" style="display:none;">
  <button class="btn" id="btnNew">+ 기획 아이템 등록</button>
</div>

<main id="main"></main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div><h2 id="modalTitle">아이템</h2><div class="sub" id="modalSub"></div></div>
      <button class="close" id="modalClose">✕ 닫기</button>
    </div>
    <div class="stage-pills" id="stagePills"></div>
    <div class="context-line" id="contextLine"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn danger" id="btnDelete">삭제</button>
      <div><button class="btn ghost" id="btnCancel">취소</button><button class="btn" id="btnSave">저장</button></div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="">
  <div class="lbtools">
    <button id="lbZoomOut">－</button><button id="lbZoomReset">100%</button><button id="lbZoomIn">＋</button><button id="lbClose">✕ 닫기</button>
  </div>
</div>

<script>
let DATA = JSON.parse(localStorage.getItem('jproject_data') || '[]');
let editingId = null;
let workingCopy = null;

function saveAll(){ localStorage.setItem('jproject_data', JSON.stringify(DATA)); render(); }
function uid(){ return 'S' + Math.random().toString(36).slice(2,9); }
function esc(v){ return (v===undefined||v===null) ? '' : String(v).replace(/"/g,'&quot;'); }

const STAGES = ['기획','작지서','생산','물류통관'];
const STAGE_LABEL = {기획:'기획', 작지서:'작업지시서', 생산:'생산', 물류통관:'물류·통관'};

function newStyle(){
  return {
    id: uid(), brand:'', season:'', styleNo:'',
    itemName:'', composition:'', colorComposition:'', planQty:'', totalQty:'', price:'',
    sizeRange:'', material:'', origin:'', dueInDate:'', launchDate:'',
    planImageDataUrl:'',
    stage:'기획',
    workOrder:{ fileDataUrl:'', fileName:'', factory:'', writtenDate:'', dueDate:'', manager:'', memo:'',
      colorSizeMatrix:[], materials:[] },
    production:{
      materials:[],
      qc:{ date:'', fullInspection:true, totalQty:'', failQty:'', passQty:'', inspector:'', note:'', files:[] }
    },
    logistics:{
      containerDate:'', shipDate:'', blNo:'', portArrival:'', customsDate:'', dispatchDate:'', logisticsCompany:'',
      docs:[], shipments:[]
    },
    issues:[]
  };
}

/* ---------- seed ---------- */
function seedData(){
  const s1 = newStyle();
  Object.assign(s1, { brand:'스노야', season:'26FW', itemName:'베스트 판초', composition:'베스트+판초',
    colorComposition:'그레이/네이비', planQty:3400, totalQty:169000, price:99000,
    sizeRange:'FREE', material:'wool55% acrylic28% nylon17%', origin:'한국(역외)', launchDate:'2026-08-24', stage:'기획' });

  const s2 = newStyle();
  Object.assign(s2, { brand:'스노야', season:'26FW', styleNo:'6FW-HD-D02', itemName:'패딩베스트',
    planQty:3000, totalQty:3000, sizeRange:'S/M/L', stage:'작지서' });
  s2.workOrder = Object.assign(s2.workOrder, {
    factory:'현송', writtenDate:'2026-08-13', dueDate:'2026-09-25', manager:'곽동혁 / 김혜연',
    colorSizeMatrix:[
      {color:'카키/오렌지(45%)', qtyBySize:{S:378,M:540,L:432}},
      {color:'블루/스카이블루(35%)', qtyBySize:{S:294,M:420,L:336}}
    ],
    materials:[
      {item:'겉감', spec:'', content:'폴리100%', qty:'3000Y', note:''},
      {item:'충전재', spec:'', content:'덕다운90%', qty:'', note:''}
    ]
  });

  const s3 = newStyle();
  Object.assign(s3, { brand:'모브온', season:'26FW', styleNo:'6FW-MO-P02', itemName:'기모 세미플레어 팬츠',
    colorComposition:'베이지/네이비/블랙', planQty:97200, totalQty:97200,
    sizeRange:'55/66/77/88/99', material:'F-92/8% Poly/Span', stage:'생산' });
  s3.workOrder = Object.assign(s3.workOrder, {
    factory:'', writtenDate:'2026-06-30', dueDate:'2026-09-20', manager:'임소연 / 백수연',
    colorSizeMatrix:[
      {color:'베이지', qtyBySize:{'55':7452,'66':12312,'77':8100,'88':2916,'99':1620}},
      {color:'네이비', qtyBySize:{'55':7452,'66':12312,'77':8100,'88':2916,'99':1620}},
      {color:'블랙', qtyBySize:{'55':7452,'66':12312,'77':8100,'88':2916,'99':1620}}
    ],
    materials:[
      {item:'겉감', spec:'58"', content:'F-92/8% Poly/Span 220G/Y', qty:'32000Y', note:''},
      {item:'밴드', spec:'70MM', content:'COMEZ 중간직밴드', qty:'', note:''}
    ]
  });
  s3.production.materials = [
    {id:uid(), type:'원단', name:'겉감 F-92', supplier:'COMEZ', factory:'', orderDate:'2026-07-01', expectedInDate:'2026-08-10',
      totalQty:'32000', receipts:[{date:'2026-08-05',qty:'20000',location:'본사창고',note:'1차 입고'}], inspected:true, sewingInDate:'', note:''},
    {id:uid(), type:'부자재', name:'밴드', supplier:'COMEZ', factory:'', orderDate:'2026-07-05', expectedInDate:'2026-08-15',
      totalQty:'5000', receipts:[], inspected:false, sewingInDate:'', note:'입고 지연'}
  ];
  s3.production.qc = {date:'2026-09-05', fullInspection:true, totalQty:97200, failQty:1700, passQty:95500, inspector:'QC팀', note:'봉제선 불량 일부', files:[]};
  s3.logistics.shipments = [
    {date:'2026-09-10', color:'베이지', size:'전체', qty:30000, box:120, logisticsCompany:'', receivedYn:false, receivedDate:'', note:'1차 출고'}
  ];
  s3.issues.push({stage:'생산', content:'밴드 원단 입고 지연 - 공장 확인 필요', company:'COMEZ', date:'2026-08-15', resolved:false});
  DATA = [s1, s2, s3];
  saveAll();
}

/* ---------- completion / progress / dday ---------- */
function totalPlannedQty(s){
  const wm = s.workOrder.colorSizeMatrix||[];
  if(wm.length){
    let t = 0;
    wm.forEach(r=> Object.values(r.qtyBySize||{}).forEach(v=> t += Number(v)||0));
    if(t>0) return t;
  }
  return Number(s.totalQty)||0;
}
function totalReceivedQty(s){
  return (s.logistics.shipments||[]).filter(sh=>sh.receivedYn).reduce((a,sh)=>a+(Number(sh.qty)||0),0);
}
function isCompleted(s){
  const total = totalPlannedQty(s);
  if(total<=0) return false;
  return totalReceivedQty(s) >= total;
}
function stageProgress(s){
  if(isCompleted(s)) return 100;
  if(s.stage==='기획') return 8;
  if(s.stage==='작지서') return 25;
  if(s.stage==='생산'){
    const mats = s.production.materials||[];
    if(mats.length===0) return 40;
    const inspected = mats.filter(m=>m.inspected).length;
    return Math.min(72, Math.round(42 + (inspected/mats.length)*28));
  }
  if(s.stage==='물류통관'){
    const total = totalPlannedQty(s), rec = totalReceivedQty(s);
    const ratio = total>0 ? rec/total : 0;
    return Math.min(96, Math.round(74 + ratio*22));
  }
  return 50;
}
function ddayInfo(dateStr){
  if(!dateStr) return {label:'-', cls:'none'};
  const d = new Date(dateStr); const now = new Date();
  d.setHours(0,0,0,0); now.setHours(0,0,0,0);
  const diff = Math.round((d-now)/86400000);
  if(diff<0) return {label:`D+${-diff}`, cls:'over'};
  if(diff===0) return {label:'D-DAY', cls:'over'};
  if(diff<=7) return {label:`D-${diff}`, cls:'soon'};
  return {label:`D-${diff}`, cls:'ok'};
}

const PLAN_FIELD_ALIASES = {
  styleNo: ['STYLE','스타일','스타일번호','스타일넘버'],
  itemName: ['아이템/용도','아이템명','아이템','품목','상품명'],
  composition: ['구성'],
  colorComposition: ['컬러구성','컬러'],
  planQty: ['기획수량'],
  totalQty: ['총수량'],
  price: ['판매가','가격'],
  sizeRange: ['사이즈'],
  material: ['소재'],
  origin: ['원산지','생산처'],
  dueInDate: ['입고예정일','입고일'],
  launchDate: ['런칭희망일','런칭일','런칭 희망일'],
  brand: ['브랜드'],
  season: ['시즌']
};
const MULTILINE_FIELDS = ['colorComposition','sizeRange','composition','material'];
function normalizeCellValue(v, field){
  let s = String(v).trim();
  if(MULTILINE_FIELDS.includes(field)){
    s = s.replace(/\r\n/g,'\n').split('\n').map(x=>x.trim()).filter(Boolean).join('/');
  } else {
    s = s.replace(/\r\n/g,' ').replace(/\n/g,' ').replace(/\s+/g,' ').trim();
  }
  return s;
}
function normLabel(s){ return String(s||'').replace(/\s/g,''); }
function buildHeaderColumnMap(headerRow){
  const colMap = {};
  (headerRow||[]).forEach((cell, idx)=>{
    const label = normLabel(cell);
    if(!label) return;
    Object.entries(PLAN_FIELD_ALIASES).forEach(([field, aliases])=>{
      if(colMap[field]!==undefined) return;
      if(aliases.some(a=> label===normLabel(a))) colMap[field] = idx;
    });
  });
  return colMap;
}
function findHeaderRowIndex(rows){
  let bestIdx = 0, bestScore = -1;
  for(let i=0;i<Math.min(rows.length,8);i++){
    const score = Object.keys(buildHeaderColumnMap(rows[i])).length;
    if(score>bestScore){ bestScore=score; bestIdx=i; }
  }
  return {idx:bestIdx, score:bestScore};
}
function guessBrandSeasonFromContext(sheetName, titleRowText){
  const text = (sheetName||'') + ' ' + (titleRowText||'');
  let brand = '';
  if(text.includes('스노야')) brand = '스노야';
  else if(text.includes('모브온') || text.includes('모브앤타임') || text.includes('모브')) brand = '모브온';
  let season = '';
  const m = text.match(/(\d{2}(FW|SS))/i);
  if(m) season = m[1].toUpperCase();
  return {brand, season};
}
function rowArrayToStyle(row, colMap, defaultBrand, defaultSeason){
  const st = newStyle();
  st.brand = defaultBrand || ''; st.season = defaultSeason || '';
  Object.entries(colMap).forEach(([field, idx])=>{
    const raw = row[idx];
    if(raw===undefined || raw===null || String(raw).trim()==='') return;
    st[field] = normalizeCellValue(raw, field);
  });
  return st;
}
async function extractExcelRowImagesForSheet(arrayBuffer, targetSheetName){
  const rowToImage = {};
  try{
    const zip = await JSZip.loadAsync(arrayBuffer);
    if(!zip.files['xl/workbook.xml']) return rowToImage;
    const wbXml = await zip.files['xl/workbook.xml'].async('text');
    const wbDoc = new DOMParser().parseFromString(wbXml, 'application/xml');
    let targetRId = null;
    Array.from(wbDoc.getElementsByTagName('sheet')).forEach(sh=>{
      if(sh.getAttribute('name')===targetSheetName){
        targetRId = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
      }
    });
    if(!targetRId) return rowToImage;
    const relsXml = await zip.files['xl/_rels/workbook.xml.rels'].async('text');
    const relsDoc = new DOMParser().parseFromString(relsXml, 'application/xml');
    let sheetPath = null;
    Array.from(relsDoc.getElementsByTagName('Relationship')).forEach(r=>{
      if(r.getAttribute('Id')===targetRId) sheetPath = 'xl/' + r.getAttribute('Target').replace(/^\/?xl\//,'');
    });
    if(!sheetPath || !zip.files[sheetPath]) return rowToImage;
    const sheetFile = sheetPath.split('/').pop();
    const sheetRelsPath = sheetPath.replace(sheetFile, '_rels/' + sheetFile) + '.rels';
    if(!zip.files[sheetRelsPath]) return rowToImage;
    const sheetRelsXml = await zip.files[sheetRelsPath].async('text');
    const sheetRelsDoc = new DOMParser().parseFromString(sheetRelsXml, 'application/xml');
    let drawingPath = null;
    Array.from(sheetRelsDoc.getElementsByTagName('Relationship')).forEach(r=>{
      if((r.getAttribute('Type')||'').indexOf('drawing')>-1) drawingPath = 'xl/drawings/' + r.getAttribute('Target').split('/').pop();
    });
    if(!drawingPath || !zip.files[drawingPath]) return rowToImage;

    const mediaFiles = {};
    for(const name of Object.keys(zip.files)){
      if(!/^xl\/media\//.test(name)) continue;
      const ext = name.split('.').pop().toLowerCase();
      const mime = ext==='png'?'image/png':(ext==='jpg'||ext==='jpeg')?'image/jpeg':null;
      if(!mime) continue;
      const base64 = await zip.files[name].async('base64');
      mediaFiles[name] = `data:${mime};base64,${base64}`;
    }
    const drawingRelsPath = drawingPath.replace('drawings/', 'drawings/_rels/') + '.rels';
    let relsMap = {};
    if(zip.files[drawingRelsPath]){
      const drRelsText = await zip.files[drawingRelsPath].async('text');
      const drRelsDoc = new DOMParser().parseFromString(drRelsText, 'application/xml');
      Array.from(drRelsDoc.getElementsByTagName('Relationship')).forEach(r=>{
        relsMap[r.getAttribute('Id')] = 'xl/media/' + r.getAttribute('Target').split('/').pop();
      });
    }
    const xmlText = await zip.files[drawingPath].async('text');
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    const anchors = [...doc.getElementsByTagName('xdr:twoCellAnchor'), ...doc.getElementsByTagName('xdr:oneCellAnchor')];
    anchors.forEach(anchor=>{
      const fromEls = anchor.getElementsByTagName('xdr:from');
      if(!fromEls.length) return;
      const rowEls = fromEls[0].getElementsByTagName('xdr:row');
      if(!rowEls.length) return;
      const rowIdx = parseInt(rowEls[0].textContent, 10);
      const blipEls = anchor.getElementsByTagName('a:blip');
      if(!blipEls.length) return;
      const rId = blipEls[0].getAttribute('r:embed');
      const mediaPath = relsMap[rId];
      if(mediaPath && mediaFiles[mediaPath]) rowToImage[rowIdx] = mediaFiles[mediaPath];
    });
  }catch(err){ console.error('이미지 추출 실패(무시하고 진행):', err); }
  return rowToImage;
}

function pickSheetName(sheetNames){
  if(sheetNames.length===1) return sheetNames[0];
  const listText = sheetNames.map((n,i)=>`${i+1}. ${n}`).join('\n');
  const answer = prompt(`이 파일에는 시트가 ${sheetNames.length}개 있습니다. 등록할 시트 번호를 입력해주세요:\n\n${listText}`, '1');
  if(answer===null) return null;
  const n = parseInt(answer.trim(), 10);
  if(n>=1 && n<=sheetNames.length) return sheetNames[n-1];
  alert('올바른 번호를 입력하지 않아 취소되었습니다.');
  return null;
}

document.getElementById('btnBulkPlan').addEventListener('click', ()=> document.getElementById('bulkPlanInput').click());
document.getElementById('bulkPlanInput').addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    let created = 0, withImage = 0, skipped = 0;
    try{
      const buf = reader.result;
      const wb = XLSX.read(buf, { type:'array' });
      const sheetName = pickSheetName(wb.SheetNames);
      if(!sheetName){ e.target.value=''; return; }
      const ws = wb.Sheets[sheetName];
      const rawRows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
      if(!rawRows.length){ alert('선택한 시트에서 데이터를 찾지 못했습니다.'); e.target.value=''; return; }

      const {idx: headerIdx, score} = findHeaderRowIndex(rawRows);
      if(score < 2){
        alert('이 시트에서 "아이템명", "컬러구성" 같은 항목 제목 줄을 찾지 못했습니다. 시트 구성을 확인해주세요.');
        e.target.value=''; return;
      }
      const colMap = buildHeaderColumnMap(rawRows[headerIdx]);
      const titleRowText = rawRows.slice(0, headerIdx).map(r=>r.join(' ')).join(' ');
      const {brand: defaultBrand, season: defaultSeason} = guessBrandSeasonFromContext(sheetName, titleRowText);

      let rowToImage = {};
      try{ rowToImage = await extractExcelRowImagesForSheet(buf.slice(0), sheetName); }catch(err){ console.error(err); }

      const dataRows = rawRows.slice(headerIdx+1);
      dataRows.forEach((row, i)=>{
        try{
          const isEmpty = row.every(c=> String(c||'').trim()==='');
          if(isEmpty){ return; }
          const st = rowArrayToStyle(row, colMap, defaultBrand, defaultSeason);
          if(!st.itemName && !st.styleNo){ skipped++; return; }
          const sheetRowIdx = headerIdx + 1 + i;
          const img = rowToImage[sheetRowIdx];
          if(img){ st.planImageDataUrl = img; withImage++; }
          DATA.push(st);
          created++;
        }catch(rowErr){ console.error('행 처리 실패(건너뜀):', rowErr); skipped++; }
      });

      if(created===0){
        alert('등록할 수 있는 항목을 찾지 못했습니다. 시트 구성을 확인해주세요.');
      } else {
        saveAll();
        alert(`"${sheetName}" 시트에서 기획 아이템 ${created}건을 등록했습니다.${withImage?` (이미지 자동 매칭 ${withImage}건)`:''}${skipped?` (건너뛴 빈 행 ${skipped}건)`:''}\n내용을 확인하고 필요하면 각 아이템 상세에서 수정해주세요.`);
      }
    }catch(err){
      console.error(err);
      alert('엑셀 파일을 읽는 중 문제가 발생했습니다: ' + (err && err.message ? err.message : '알 수 없는 오류') + '\n파일 형식을 확인해주세요.');
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(f);
});

/* ---------- matrix (color x size) ---------- */
let currentSizes = [];
function matrixHeadHtml(sizes){ return `<th>컬러</th>` + sizes.map(sz=>`<th>${sz}</th>`).join('') + `<th>합계</th><th></th>`; }
function matrixRowHtml(row, sizes){
  const cells = sizes.map(sz=>`<td><input class="mCell" data-size="${sz}" value="${row.qtyBySize && row.qtyBySize[sz]!==undefined ? row.qtyBySize[sz] : ''}"></td>`).join('');
  const total = sizes.reduce((a,sz)=> a + (Number(row.qtyBySize && row.qtyBySize[sz]) || 0), 0);
  return `<tr><td><input class="mColor colorname" value="${esc(row.color)}"></td>${cells}<td class="total">${total || ''}</td><td><button type="button" class="small-btn delRow">삭제</button></td></tr>`;
}
function matRowHtml(row){
  return `<tr>
    <td><input class="matItem leftalign" value="${esc(row.item)}"></td>
    <td><input class="matSpec" value="${esc(row.spec)}"></td>
    <td><input class="matContent leftalign" value="${esc(row.content)}"></td>
    <td><input class="matQty" value="${esc(row.qty)}"></td>
    <td><input class="matNote leftalign" value="${esc(row.note)}"></td>
    <td><button type="button" class="small-btn delRow">삭제</button></td>
  </tr>`;
}
function readMatrixRowsFromDOM(sizes){
  const rows = [];
  document.querySelectorAll('#matrixBody tr').forEach(tr=>{
    const color = tr.querySelector('.mColor').value;
    const qtyBySize = {};
    tr.querySelectorAll('.mCell').forEach(inp=>{ if(inp.value!=='') qtyBySize[inp.dataset.size] = inp.value; });
    rows.push({color, qtyBySize});
  });
  return rows;
}
function readMatRowsFromDOM(){
  const rows = [];
  document.querySelectorAll('#matBody tr').forEach(tr=>{
    rows.push({ item: tr.querySelector('.matItem').value, spec: tr.querySelector('.matSpec').value,
      content: tr.querySelector('.matContent').value, qty: tr.querySelector('.matQty').value, note: tr.querySelector('.matNote').value });
  });
  return rows;
}
function rebuildMatrix(sizes, colorNames){
  const existing = readMatrixRowsFromDOM(currentSizes);
  const byColor = {}; existing.forEach(r=>{ if(r.color) byColor[r.color] = r.qtyBySize; });
  currentSizes = sizes;
  let rows;
  if(colorNames && colorNames.length) rows = colorNames.map(c=> ({ color:c, qtyBySize: byColor[c] || {} }));
  else rows = existing.length ? existing : [{color:'', qtyBySize:{}}];
  document.getElementById('matrixHeadRow').innerHTML = matrixHeadHtml(currentSizes);
  document.getElementById('matrixBody').innerHTML = rows.map(r=>matrixRowHtml(r, currentSizes)).join('');
  bindMatrixRowEvents();
}
function bindMatrixRowEvents(){
  document.querySelectorAll('#matrixBody .delRow').forEach(btn=> btn.addEventListener('click', (e)=>{ e.target.closest('tr').remove(); recalcTotals(); }));
  document.querySelectorAll('#matrixBody .mCell').forEach(inp=> inp.addEventListener('input', recalcTotals));
}
function recalcTotals(){
  document.querySelectorAll('#matrixBody tr').forEach(tr=>{
    let total = 0; tr.querySelectorAll('.mCell').forEach(inp=> total += Number(inp.value)||0 );
    tr.querySelector('.total').textContent = total || '';
  });
}
function bindMatRowEvents(){ document.querySelectorAll('#matBody .delRow').forEach(btn=> btn.addEventListener('click', (e)=> e.target.closest('tr').remove())); }
function bindShipRowEvents(){ document.querySelectorAll('#shipBody .delRow').forEach(btn=> btn.addEventListener('click', (e)=> e.target.closest('tr').remove())); }
function readShipRowsFromDOM(){
  const rows = [];
  document.querySelectorAll('#shipBody tr').forEach(tr=>{
    rows.push({
      seqLabel: tr.querySelector('.shipSeq').value, date: tr.querySelector('.shipDate').value,
      color: tr.querySelector('.shipColor').value, size: tr.querySelector('.shipSize').value,
      qty: tr.querySelector('.shipQty').value, box: tr.querySelector('.shipBox').value,
      logisticsCompany: tr.querySelector('.shipCompany').value, receivedYn: tr.querySelector('.shipReceived').checked,
      receivedDate: tr.querySelector('.shipReceivedDate').value, note: tr.querySelector('.shipNote').value
    });
  });
  return rows.filter(r=>r.qty||r.date||r.note||r.color);
}

function refreshMatCardTotals(card){
  const total = Number(card.querySelector('.pm_totalQty').value)||0;
  let totalIn = 0;
  card.querySelectorAll('.receiptBody .rc_qty').forEach(inp=> totalIn += Number(inp.value)||0);
  const remain = Math.max(0, total-totalIn);
  card.querySelector('.totals').innerHTML = `전체 <b>${total||0}</b> · 입고 <b>${totalIn}</b> · 미입고 <b>${remain}</b>`;
}
function bindMatCardEvents(){
  document.querySelectorAll('#prodMatList .matcard').forEach(card=>{
    card.querySelector('.toggleReceipt').addEventListener('click', ()=> card.querySelector('.receiptbox').classList.toggle('open'));
    card.querySelector('.delMat').addEventListener('click', ()=> card.remove());
    card.querySelector('.addReceipt').addEventListener('click', ()=>{
      const tbody = card.querySelector('.receiptBody');
      tbody.insertAdjacentHTML('beforeend', receiptRowHtml({date:'',qty:'',location:'',note:''}));
      bindReceiptRowEvents(card);
      card.querySelector('.receiptbox').classList.add('open');
    });
    card.querySelector('.pm_totalQty').addEventListener('input', ()=> refreshMatCardTotals(card));
    bindReceiptRowEvents(card);
  });
}
function bindReceiptRowEvents(card){

}

/* ---------- file upload (작업지시서, excel only) ---------- */
function fileBoxInnerHtml(s){
  const wo = s.workOrder;
  if(!wo.fileDataUrl){
    return `<div class="doc-icon">EXCEL<br>없음</div>
      <div class="info"><div class="fname">작업지시서 엑셀 파일이 없습니다</div><div class="fmeta">xlsx/xls/csv 파일을 올려주세요</div></div>
      <div class="actions"><button type="button" class="small-btn" id="btnUploadFile">파일 선택</button></div>`;
  }
  return `<div class="doc-icon">EXCEL</div>
    <div class="info"><div class="fname">${esc(wo.fileName)}</div><div class="fmeta">엑셀 작업지시서 - 아래 항목에 자동 반영을 시도했습니다</div></div>
    <div class="actions"><button type="button" class="small-btn" id="btnUploadFile">다시 업로드</button><button type="button" class="small-btn" id="btnDownloadFile">다운로드</button></div>`;
}
const WO_FIELD_ALIASES = {
  factory: ['작업처','생산공장','공장'], writtenDate:['작성일'], dueDate:['납기일'], manager:['담당자'], styleNo:['스타일넘버','스타일번호']
};
function scanWorkOrderLabels(wb){
  const result = {};
  wb.SheetNames.forEach(name=>{
    const ws = wb.Sheets[name];
    const ref = ws['!ref']; if(!ref) return;
    const range = XLSX.utils.decode_range(ref);
    for(let R=range.s.r; R<=range.e.r; R++){
      for(let C=range.s.c; C<=range.e.c; C++){
        const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
        if(!cell || typeof cell.v !== 'string') continue;
        const label = cell.v.trim();
        Object.entries(WO_FIELD_ALIASES).forEach(([field, aliases])=>{
          if(result[field]) return;
          if(aliases.some(a=> label.replace(/\s/g,'')===a.replace(/\s/g,''))){
            const next = ws[XLSX.utils.encode_cell({r:R,c:C+1})];
            if(next && next.v!=='') result[field] = String(next.v);
          }
        });
      }
    }
  });
  return result;
}
function wireFileUpload(s){
  const fileInput = document.getElementById('fileInput');
  const rewire = ()=>{
    const btnUp = document.getElementById('btnUploadFile');
    if(btnUp) btnUp.addEventListener('click', ()=> fileInput.click());
    const btnDown = document.getElementById('btnDownloadFile');
    if(btnDown) btnDown.addEventListener('click', ()=>{
      const a = document.createElement('a'); a.href = s.workOrder.fileDataUrl; a.download = s.workOrder.fileName || 'file';
      document.body.appendChild(a); a.click(); a.remove();
    });
  };
  rewire();
  fileInput.addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      s.workOrder.fileName = f.name;
      try{
        const wb = XLSX.read(reader.result, {type:'array'});
        const fields = scanWorkOrderLabels(wb);
        if(fields.factory) document.getElementById('w_factory').value = fields.factory;
        if(fields.writtenDate) document.getElementById('w_writtenDate').value = fields.writtenDate;
        if(fields.dueDate) document.getElementById('w_dueDate').value = fields.dueDate;
        if(fields.manager) document.getElementById('w_manager').value = fields.manager;
        // also convert to dataURL for storage/download
        const b64Reader = new FileReader();
        b64Reader.onload = ()=>{ s.workOrder.fileDataUrl = b64Reader.result; document.getElementById('fileBox').innerHTML = fileBoxInnerHtml(s); rewire(); };
        b64Reader.readAsDataURL(f);
        alert('엑셀에서 작업처/작성일/납기일/담당자 정보를 최대한 자동으로 찾아 채웠습니다. 확인 후 필요하면 수정해주세요.');
      }catch(err){
        console.error(err);
        const b64Reader = new FileReader();
        b64Reader.onload = ()=>{ s.workOrder.fileDataUrl = b64Reader.result; document.getElementById('fileBox').innerHTML = fileBoxInnerHtml(s); rewire(); };
        b64Reader.readAsDataURL(f);
      }
    };
    reader.readAsArrayBuffer(f);
  });
}

/* ---------- generic doc upload (QC files, logistics docs) ---------- */
function wireQcDocUpload(s){
  const rebind = ()=>{
    document.querySelectorAll('#qcDocList .viewDoc').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const idx = +e.target.closest('.docrow').dataset.idx;
        const d = s.production.qc.files[idx];
        if(d.fileType && d.fileType.startsWith('image/')) openLightbox(d.fileDataUrl);
        else window.open(d.fileDataUrl, '_blank');
      });
    });
    document.querySelectorAll('#qcDocList .delDoc').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const idx = +e.target.closest('.docrow').dataset.idx;
        s.production.qc.files.splice(idx,1);
        document.getElementById('qcDocList').innerHTML = s.production.qc.files.map((d,i)=>qcDocRowHtml(d,i)).join('');
        rebind();
      });
    });
  };
  rebind();
  document.getElementById('addQcDoc').addEventListener('click', ()=> document.getElementById('qcDocInput').click());
  document.getElementById('qcDocInput').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      s.production.qc.files = s.production.qc.files || [];
      s.production.qc.files.push({ fileDataUrl:reader.result, fileName:f.name, fileType:f.type });
      document.getElementById('qcDocList').innerHTML = s.production.qc.files.map((d,i)=>qcDocRowHtml(d,i)).join('');
      rebind();
    };
    reader.readAsDataURL(f);
    e.target.value='';
  });
}

  s.logistics.docs = s.logistics.docs || [];
  const rebind = ()=>{

/* ---------- lightbox ---------- */
let lbScale = 1;
function openLightbox(src){
  lbScale = 1; document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxImg').style.transform = 'scale(1)';
  document.getElementById('lightbox').classList.add('show');
}
document.getElementById('lbClose').addEventListener('click', ()=> document.getElementById('lightbox').classList.remove('show'));
document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') document.getElementById('lightbox').classList.remove('show'); });
document.getElementById('lbZoomIn').addEventListener('click', ()=>{ lbScale=Math.min(4,lbScale+.25); document.getElementById('lightboxImg').style.transform=`scale(${lbScale})`; });
document.getElementById('lbZoomOut').addEventListener('click', ()=>{ lbScale=Math.max(.4,lbScale-.25); document.getElementById('lightboxImg').style.transform=`scale(${lbScale})`; });
document.getElementById('lbZoomReset').addEventListener('click', ()=>{ lbScale=1; document.getElementById('lightboxImg').style.transform='scale(1)'; });

/* ---------- wire per-stage widgets ---------- */
function wireStageWidgets(s){
  if(s.stage==='기획'){
    const thumb = document.getElementById('planImgThumb');
    if(thumb) thumb.addEventListener('click', ()=> openLightbox(s.planImageDataUrl));
    wireIssueAdd(s);
    return;
  }
  if(s.stage==='작지서'){
    let sizes = (s.sizeRange||'').split('/').map(x=>x.trim()).filter(Boolean);
    if(sizes.length===0 && s.workOrder.colorSizeMatrix.length){
      const keySet = new Set(); s.workOrder.colorSizeMatrix.forEach(r=> Object.keys(r.qtyBySize||{}).forEach(k=>keySet.add(k)));
      sizes = [...keySet];
    }
    currentSizes = sizes;
    document.getElementById('matrixHeadRow').innerHTML = matrixHeadHtml(currentSizes);
    document.getElementById('matrixBody').innerHTML = (s.workOrder.colorSizeMatrix||[]).map(r=>matrixRowHtml(r, currentSizes)).join('');
    bindMatrixRowEvents();
    document.getElementById('matBody').innerHTML = (s.workOrder.materials||[]).map(matRowHtml).join('');
    bindMatRowEvents();
    document.getElementById('applySizes').addEventListener('click', ()=>{
      const sizes2 = (document.getElementById('f_sizeRange').value||'').split('/').map(x=>x.trim()).filter(Boolean);
      const colors2 = (document.getElementById('f_colorComposition').value||'').split('/').map(x=>x.trim()).filter(Boolean);
      rebuildMatrix(sizes2, colors2);
    });
    document.getElementById('addMatrixRow').addEventListener('click', ()=>{
      const existing = readMatrixRowsFromDOM(currentSizes); existing.push({color:'', qtyBySize:{}});
      document.getElementById('matrixBody').innerHTML = existing.map(r=>matrixRowHtml(r, currentSizes)).join(''); bindMatrixRowEvents();
    });
    document.getElementById('addMatRow').addEventListener('click', ()=>{
      const existing = readMatRowsFromDOM(); existing.push({item:'', spec:'', content:'', qty:'', note:''});
      document.getElementById('matBody').innerHTML = existing.map(matRowHtml).join(''); bindMatRowEvents();
    });
    wireFileUpload(s);
    wireIssueAdd(s);
    return;
  }
  if(s.stage==='생산'){
    bindMatCardEvents();
    document.getElementById('addProdMat').addEventListener('click', ()=>{
      const newMat = {id:uid(), type:'기타', name:'', supplier:'', factory:'', orderDate:'', expectedInDate:'', totalQty:'', receipts:[], inspected:false, sewingInDate:'', note:''};
      document.getElementById('prodMatList').insertAdjacentHTML('beforeend', matCardHtml(newMat));
      bindMatCardEvents();
    });
    ['qc_total','qc_fail'].forEach(id=>{
      document.getElementById(id).addEventListener('input', ()=>{
        document.getElementById('qcBadge').innerHTML = qcBadgeHtml({
          totalQty: document.getElementById('qc_total').value, failQty: document.getElementById('qc_fail').value
        });
      });
    });
    wireQcDocUpload(s);
    wireIssueAdd(s);
    return;
  }
  if(s.stage==='물류통관'){
    bindShipRowEvents();
    document.getElementById('addShipRow').addEventListener('click', ()=>{
      const existing = readShipRowsFromDOM();
      existing.push({seqLabel:(existing.length+1)+'차', date:'', color:'', size:'', qty:'', box:'', logisticsCompany:'', receivedYn:false, receivedDate:'', note:''});
      document.getElementById('shipBody').innerHTML = existing.map(shipRowHtml).join(''); bindShipRowEvents();
    });
    wireLogDocUpload(s);
    wireIssueAdd(s);
    return;
  }
}
function wireIssueAdd(s){
  const btn = document.getElementById('addIssue'); if(!btn) return;
  btn.addEventListener('click', ()=>{
    const inp = document.getElementById('newIssueContent'); const val = inp.value.trim(); if(!val) return;
    s.issues = s.issues || [];
    s.issues.push({stage:s.stage, content:val, company:'', date:new Date().toISOString().slice(0,10), resolved:false});
    document.getElementById('issueList').innerHTML = s.issues.map(issueHtml).join('');
    inp.value='';
  });
}

/* ---------- stage pill switching (event delegation) ---------- */
document.getElementById('stagePills').addEventListener('click', (e)=>{
  const p = e.target.closest('.pill'); if(!p || !workingCopy) return;
  try{ syncCurrentSectionIntoWorkingCopy(); }catch(err){ console.error('sync error (ignored):', err); }
  workingCopy.stage = p.dataset.stage;
  renderModalStage();
});

/* ---------- save / delete ---------- */
document.getElementById('btnSave').addEventListener('click', ()=>{
  try{ syncCurrentSectionIntoWorkingCopy(); }catch(err){ console.error(err); }
  const s = workingCopy;
  if(editingId){ const idx = DATA.findIndex(d=>d.id===editingId); DATA[idx] = s; } else { DATA.push(s); }
  saveAll(); closeModal();
});
document.getElementById('btnDelete').addEventListener('click', ()=>{
  if(!editingId) return;
  if(!confirm('이 스타일을 삭제하시겠습니까?')) return;
  DATA = DATA.filter(d=>d.id!==editingId); saveAll(); closeModal();
});
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
document.getElementById('btnNew').addEventListener('click', ()=> openModal(null));
document.getElementById('btnSeed').addEventListener('click', ()=>{
  if(DATA.length && !confirm('기존 데이터가 있습니다. 테스트 데이터를 추가하시겠습니까?')) return;
  seedData();
});
['fBrand','fSeason','fStage','fSearch'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

render();
