<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERSO | Multi-Brand SCM Engine</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f5f7fa;
    color: #172033;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   HEADER
========================= */

.header {
    background: #ffffff;
    border-bottom: 1px solid #dfe5ec;
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #172b4d;
}

.logo-sub {
    font-size: 11px;
    color: #7b8798;
    border-left: 1px solid #d8dee7;
    padding-left: 14px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

/* =========================
   BUTTON
========================= */

.btn {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
    padding: 9px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
}

.btn:hover {
    border-color: #486581;
    background: #f8fafc;
}

.btn-primary {
    border-color: #243b5a;
    background: #243b5a;
    color: #ffffff;
}

.btn-primary:hover {
    background: #1d304a;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px 28px 50px;
}

/* =========================
   FILTER
========================= */

.filter-area {
    background: #ffffff;
    border: 1px solid #dfe5ec;
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.filter-label {
    font-size: 12px;
    color: #64748b;
    font-weight: 700;
}

select {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #1e293b;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    min-width: 130px;
    outline: none;
}

select:focus,
input:focus,
textarea:focus {
    border-color: #4c6a89;
    box-shadow: 0 0 0 2px rgba(76,106,137,0.08);
}

/* =========================
   SUMMARY
========================= */

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.summary-card {
    background: #ffffff;
    border: 1px solid #dfe5ec;
    border-radius: 10px;
    padding: 18px;
}

.summary-title {
    font-size: 12px;
    color: #718096;
    margin-bottom: 8px;
}

.summary-value {
    font-size: 26px;
    font-weight: 800;
    color: #172b4d;
}

.summary-desc {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 5px;
}

/* =========================
   SECTION
========================= */

.section {
    background: #ffffff;
    border: 1px solid #dfe5ec;
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
}

.section-header {
    padding: 16px 18px;
    border-bottom: 1px solid #e5eaf0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.section-title {
    font-size: 15px;
    font-weight: 800;
    color: #172b4d;
}

.section-desc {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
}

/* =========================
   STYLE TABLE
========================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1050px;
}

th {
    background: #f8fafc;
    color: #64748b;
    font-size: 11px;
    font-weight: 700;
    padding: 12px 14px;
    border-bottom: 1px solid #e5eaf0;
    text-align: left;
    white-space: nowrap;
}

td {
    padding: 14px;
    border-bottom: 1px solid #edf1f5;
    font-size: 12px;
    color: #334155;
    vertical-align: middle;
}

.style-row {
    cursor: pointer;
    transition: background 0.15s;
}

.style-row:hover {
    background: #f8fafc;
}

.style-number {
    color: #263f61;
    font-weight: 800;
}

.style-name {
    font-weight: 700;
    color: #172033;
}

.brand-text {
    color: #64748b;
    font-size: 11px;
}

/* =========================
   PROGRESS
========================= */

.progress-box {
    min-width: 150px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
}

.progress-percent {
    font-size: 12px;
    font-weight: 800;
    color: #243b5a;
}

.progress-bar {
    width: 100%;
    height: 6px;
    background: #e8edf2;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #405a78;
    border-radius: 20px;
}

/* =========================
   STATUS
========================= */

.status-text {
    font-size: 12px;
    font-weight: 700;
    color: #405a78;
}

.deadline {
    font-weight: 700;
    color: #334155;
}

.d-day {
    font-size: 11px;
    color: #64748b;
    margin-top: 3px;
}

.d-day.overdue {
    color: #7f1d1d;
    font-weight: 800;
}

/* =========================
   DETAIL PANEL
========================= */

.detail-panel {
    display: none;
    background: #f8fafc;
    border-top: 1px solid #dfe5ec;
    border-bottom: 1px solid #dfe5ec;
    padding: 24px;
}

.detail-panel.active {
    display: block;
}

.detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 22px;
}

.detail-title {
    font-size: 20px;
    font-weight: 800;
    color: #172b4d;
}

.detail-subtitle {
    margin-top: 5px;
    font-size: 12px;
    color: #64748b;
}

.detail-deadline {
    text-align: right;
}

.detail-deadline-label {
    font-size: 11px;
    color: #94a3b8;
}

.detail-deadline-date {
    font-size: 15px;
    font-weight: 800;
    color: #334155;
    margin-top: 4px;
}

.detail-dday {
    font-size: 12px;
    color: #405a78;
    font-weight: 800;
    margin-top: 3px;
}

/* =========================
   DETAIL PROGRESS
========================= */

.detail-progress {
    background: #ffffff;
    border: 1px solid #dfe5ec;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 18px;
}

.detail-progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 9px;
}

.detail-progress-title {
    font-size: 13px;
    font-weight: 800;
}

.detail-progress-number {
    font-size: 18px;
    font-weight: 800;
    color: #243b5a;
}

.large-progress {
    height: 10px;
}

/* =========================
   PIPELINE
========================= */

.pipeline {
    display: grid;
    grid-template-columns: repeat(11, minmax(95px, 1fr));
    gap: 7px;
    margin-bottom: 18px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.pipeline-step {
    background: #ffffff;
    border: 1px solid #dfe5ec;
    border-radius: 8px;
    padding: 11px 8px;
    min-height: 78px;
    text-align: center;
    cursor: pointer;
    transition: 0.15s;
}

.pipeline-step:hover {
    border-color: #536d8a;
    transform: translateY(-1px);
}

.pipeline-step.active {
    border-color: #405a78;
    background: #f1f5f9;
}

.pipeline-name {
    font-size: 11px;
    font-weight: 800;
    color: #475569;
}

.pipeline-status {
    font-size: 11px;
    margin-top: 9px;
    color: #243b5a;
    font-weight: 700;
}

.pipeline-date {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 4px;
}

/* =========================
   DETAIL CONTENT
========================= */

.detail-content {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 15px;
}

.detail-card {
    background: #ffffff;
    border: 1px solid #dfe5ec;
    border-radius: 8px;
    padding: 18px;
}

.detail-card-title {
    font-size: 13px;
    font-weight: 800;
    color: #243b5a;
    padding-bottom: 11px;
    border-bottom: 1px solid #edf1f5;
    margin-bottom: 12px;
}

.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.info-item {
    border-bottom: 1px solid #f0f2f5;
    padding-bottom: 8px;
}

.info-label {
    font-size: 10px;
    color: #94a3b8;
    margin-bottom: 4px;
}

.info-value {
    font-size: 12px;
    font-weight: 700;
    color: #334155;
}

/* =========================
   MATERIAL LIST
========================= */

.material-list {
    display: flex;
    flex-direction: column;
}

.material-item {
    display: grid;
    grid-template-columns: 1.2fr 0.7fr 0.7fr 0.8fr;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #edf1f5;
    align-items: center;
}

.material-item:last-child {
    border-bottom: none;
}

.material-name {
    font-size: 12px;
    font-weight: 700;
}

.material-meta {
    font-size: 11px;
    color: #64748b;
}

.material-status {
    font-size: 11px;
    font-weight: 700;
    color: #405a78;
}

/* =========================
   DOCUMENTS
========================= */

.document-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.document-item {
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 9px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.document-name {
    font-size: 11px;
    font-weight: 700;
}

.document-type {
    font-size: 10px;
    color: #94a3b8;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.38);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width: 620px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid #dfe5ec;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid #e5eaf0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title {
    font-size: 16px;
    font-weight: 800;
    color: #172b4d;
}

.close-btn {
    border: none;
    background: none;
    font-size: 22px;
    color: #94a3b8;
}

.modal-body {
    padding: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-group {
    margin-bottom: 13px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #475569;
    margin-bottom: 5px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 12px;
    outline: none;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

.modal-footer {
    padding: 15px 20px;
    border-top: 1px solid #e5eaf0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;
    padding: 45px 20px;
    color: #94a3b8;
    font-size: 13px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .header {
        padding: 15px;
    }

    .container {
        padding: 15px;
    }

    .summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .detail-content {
        grid-template-columns: 1fr;
    }

    .detail-header {
        flex-direction: column;
        gap: 12px;
    }

    .detail-deadline {
        text-align: left;
    }
}

@media (max-width: 600px) {

    .logo-sub {
        display: none;
    }

    .filter-area {
        flex-wrap: wrap;
    }

    .summary-grid {
        grid-template-columns: 1fr 1fr;
    }

    .summary-value {
        font-size: 21px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo-area">
        <div class="logo">VERSO</div>
        <div class="logo-sub">Multi-Brand SCM Engine</div>
    </div>

    <div class="header-actions">
        <button class="btn" onclick="openStyleModal()">+ Style 등록</button>
    </div>

</header>


<main class="container">

    <!-- =========================
         BRAND / SEASON FILTER
    ========================= -->

    <div class="filter-area">

        <span class="filter-label">BRAND</span>

        <select id="brandFilter" onchange="renderDashboard()">
            <option value="ALL">전체 브랜드</option>
            <option value="SNOWYA">스노야</option>
            <option value="MOVON">모브온</option>
        </select>

        <span class="filter-label">SEASON</span>

        <select id="seasonFilter" onchange="renderDashboard()">
            <option value="ALL">전체 시즌</option>
            <option value="26SS">26SS</option>
            <option value="26FW">26FW</option>
            <option value="27SS">27SS</option>
            <option value="27FW">27FW</option>
        </select>

    </div>


    <!-- =========================
         SUMMARY
    ========================= -->

    <div class="summary-grid">

        <div class="summary-card">
            <div class="summary-title">전체 STYLE</div>
            <div class="summary-value" id="summaryTotal">0</div>
            <div class="summary-desc">현재 선택 조건 기준</div>
        </div>

        <div class="summary-card">
            <div class="summary-title">생산 진행중</div>
            <div class="summary-value" id="summaryProgress">0</div>
            <div class="summary-desc">현재 진행 중인 스타일</div>
        </div>

        <div class="summary-card">
            <div class="summary-title">납기 임박</div>
            <div class="summary-value" id="summaryDeadline">0</div>
            <div class="summary-desc">D-7 이내</div>
        </div>

        <div class="summary-card">
            <div class="summary-title">평균 진행률</div>
            <div class="summary-value" id="summaryAverage">0%</div>
            <div class="summary-desc">전체 스타일 평균</div>
        </div>

    </div>


    <!-- =========================
         STYLE BOARD
    ========================= -->

    <section class="section">

        <div class="section-header">

            <div>
                <div class="section-title">Production Board</div>
                <div class="section-desc">
                    Style을 클릭하면 전체 생산 과정과 상세 정보를 확인할 수 있습니다.
                </div>
            </div>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>BRAND</th>
                        <th>SEASON</th>
                        <th>STYLE NO.</th>
                        <th>상품명</th>
                        <th>전체 진행률</th>
                        <th>현재 단계</th>
                        <th>최종 납기</th>
                        <th>D-DAY</th>
                    </tr>

                </thead>

                <tbody id="styleTableBody"></tbody>

            </table>

        </div>

    </section>

</main>


<!-- =========================
     STYLE MODAL
========================= -->

<div class="modal-overlay" id="styleModal">

    <div class="modal">

        <div class="modal-header">

            <div class="modal-title">신규 Style 등록</div>

            <button class="close-btn" onclick="closeStyleModal()">×</button>

        </div>


        <div class="modal-body">

            <div class="form-grid">

                <div class="form-group">

                    <label class="form-label">브랜드</label>

                    <select id="newBrand">
                        <option value="SNOWYA">스노야</option>
                        <option value="MOVON">모브온</option>
                    </select>

                </div>


                <div class="form-group">

                    <label class="form-label">시즌</label>

                    <select id="newSeason">
                        <option value="26SS">26SS</option>
                        <option value="26FW">26FW</option>
                        <option value="27SS">27SS</option>
                        <option value="27FW">27FW</option>
                    </select>

                </div>


                <div class="form-group">

                    <label class="form-label">Style No.</label>

                    <input id="newStyleNo" placeholder="예: ST26005">

                </div>


                <div class="form-group">

                    <label class="form-label">상품명</label>

                    <input id="newStyleName" placeholder="예: 쫀쫀슬림팬츠">

                </div>


                <div class="form-group">

                    <label class="form-label">최종 납기일</label>

                    <input type="date" id="newDeadline">

                </div>


                <div class="form-group">

                    <label class="form-label">생산수량</label>

                    <input type="number" id="newQuantity" placeholder="예: 10000">

                </div>


                <div class="form-group full">

                    <label class="form-label">메모</label>

                    <textarea id="newMemo" placeholder="생산 관련 메모"></textarea>

                </div>

            </div>

        </div>


        <div class="modal-footer">

            <button class="btn" onclick="closeStyleModal()">취소</button>

            <button class="btn btn-primary" onclick="addStyle()">Style 등록</button>

        </div>

    </div>

</div>

/* =========================================================
   DATE FUNCTIONS
========================================================= */

function getDDay(dateString) {

    if (!dateString) return "-";

    const today = new Date();
    today.setHours(0,0,0,0);

    const target = new Date(dateString);
    target.setHours(0,0,0,0);

    const diff = target - today;
    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));

    if (days > 0) return "D-" + days;
    if (days === 0) return "D-DAY";
    return "D+" + Math.abs(days);
}


function formatDate(dateString) {

    if (!dateString) return "-";

    const date = new Date(dateString);

    if (isNaN(date.getTime())) return dateString;

    return date.getFullYear() + "." +
        String(date.getMonth()+1).padStart(2,"0") + "." +
        String(date.getDate()).padStart(2,"0");
}


/* =========================================================
   PROGRESS
========================================================= */

function getStyleProgress(style) {

    if (!style.pipeline || style.pipeline.length === 0) return 0;

    const total = style.pipeline.reduce((sum, step) => {
        return sum + Number(step.progress || 0);
    }, 0);

    return Math.round(total / style.pipeline.length);
}


function getCurrentStep(style) {

    if (!style.pipeline) return "-";

    const active = style.pipeline.find(step => {
        return Number(step.progress) > 0 && Number(step.progress) < 100;
    });

    if (active) return active.name;

    const waiting = style.pipeline.find(step => {
        return Number(step.progress) === 0;
    });

    if (waiting) return waiting.name + " 대기";

    return "완료";
}

function renderDashboard() {

    const brand = document.getElementById("brandFilter").value;

    let filtered = styles.filter(style => {

        return brandMatch && seasonMatch;

    const tbody = document.getElementById("styleTableBody");

    tbody.innerHTML = "";


    if (filtered.length === 0) {

        tbody.innerHTML = `

    } else {

        filtered.forEach(style => {

            const progress = getStyleProgress(style);

            const tr = document.createElement("tr");

                            </div>

                        </div>

                    </div>

                </td>

                <td>

                    </span>
                </td>

                <td>
                    <span class="deadline">
                        ${formatDate(style.deadline)}
                    </span>
                </td>

                <td>

                        dday.startsWith("D+")

                        : ""

            tr.addEventListener("click", () => {

/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(list) {

    document.getElementById("summaryTotal").textContent =
        list.length;


    document.getElementById("summaryProgress").textContent =
        list.filter(style => {

            const progress = getStyleProgress(style);

            return progress > 0 && progress < 100;

        }).length;


    document.getElementById("summaryDeadline").textContent =
        list.filter(style => {

            const dday = getDDay(style.deadline);

            if (!dday.startsWith("D-")) return false;

            const days = Number(dday.replace("D-", ""));

            return days <= 7;

        }).length;


    if (list.length === 0) {

        document.getElementById("summaryAverage").textContent =
            "0%";

    } else {

        const avg =
            list.reduce((sum, style) => {

                return sum + getStyleProgress(style);

            }, 0) / list.length;

        document.getElementById("summaryAverage").textContent =
            Math.round(avg) + "%";

    }

}

========================================================= */

function saveData() {

    localStorage.setItem(
        "verso_scm_styles",
        JSON.stringify(styles)
    );

}


function loadData() {

    const saved =
        localStorage.getItem("verso_scm_styles");

    if (!saved) return;

    try {

        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {

            styles = parsed;

        }

    } catch(error) {

        console.log("저장된 데이터를 불러오지 못했습니다.");

    }

}
