<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPROJECT SCM System</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --border-color: #e5e7eb;
      --bg-light: #f9fafb;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f3f4f6; color: #1f2937; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    /* Header & Controls */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; font-weight: bold; margin: 0; }
    .controls { display: flex; gap: 10px; }
    select, button, input { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 14px; }
    .btn-primary { background: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: 600; }
    .btn-primary:hover { background: #1d4ed8; }
    
    /* Main Table */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
    th { background: #f8fafc; text-align: left; padding: 12px; font-size: 13px; color: #64748b; border-bottom: 2px solid var(--border-color); }
    td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    
    /* Accordion Row Styles */
    .summary-row { cursor: pointer; transition: background 0.2s; }
    .summary-row:hover { background: #f1f5f9; }
    .arrow-icon { display: inline-block; transition: transform 0.2s; margin-right: 8px; font-size: 10px; }
    .summary-row.open .arrow-icon { transform: rotate(180deg); }
    
    /* Detail Expansion Area */
    .detail-row { display: none; background: #f8fafc; }
    .detail-row.open { display: table-row; }
    .detail-container { padding: 20px; border-bottom: 2px solid #cbd5e1; }
    
    .section-title { font-weight: bold; font-size: 15px; margin: 16px 0 8px 0; display: flex; justify-content: space-between; align-items: center; }
    .sub-table { margin-bottom: 20px; }
    .sub-table th { background: #edf2f7; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-ongoing { background: #dcfce7; color: #166534; }
    .badge-type { background: #e0f2fe; color: #0369a1; }
    .badge-sub { background: #f3e8ff; color: #6b21a8; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 24px; border-radius: 8px; width: 400px; display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>JPROJECT SCM</h1>
    <div class="controls">
      <!-- 브랜드 필터링 드롭다운 -->
      <select id="brandFilter" onchange="filterByBrand()">
        <option value="ALL">전체 브랜드</option>
        <option value="스노야">스노야</option>
        <option value="모브온">모브온</option>
      </select>
      <button class="btn-primary" onclick="openModal()">+ 신규 Style 등록</button>
    </div>
  </div>

  <!-- 메인 요약 테이블 -->
  <table>
    <thead>
      <tr>
        <th style="width: 40px;"></th>
        <th>브랜드</th>
        <th>시즌</th>
        <th>Style No.</th>
        <th>상품명</th>
        <th>목표일</th>
        <th>상태</th>
      </tr>
    </thead>
    <tbody id="styleList">
      <!-- JavaScript 동적 생성 위치 -->
    </tbody>
  </table>
</div>

<!-- 신규 등록 모달 -->
<div class="modal" id="registerModal">
  <div class="modal-content">
    <h3>신규 Style 등록</h3>
    <label>브랜드 선택</label>
    <select id="newBrand">
      <option value="스노야">스노야</option>
      <option value="모브온">모브온</option>
    </select>
    <input type="text" id="newSeason" placeholder="시즌 (예: 26SS)" value="26SS">
    <input type="text" id="newStyleNo" placeholder="Style No. (예: ST26002)">
    <input type="text" id="newTitle" placeholder="상품명 (예: 쫀득슬림팬츠)">
    <input type="date" id="newTargetDate">
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px;">
      <button onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="addStyle()">등록하기</button>
    </div>
  </div>
</div>

<script>
  // 초기 데이터베이스 (40~50개 확장 가능 구조)
  let stylesData = [
    {
      id: 1,
      brand: "스노야",
      season: "26SS",
      styleNo: "ST26001",
      title: "쫀득슬림팬츠",
      targetDate: "2026-08-25",
      status: "진행 중",
      fabrics: [
        { type: "원사", name: "30수 코튼 면사", spec: "컬러: 백아이 / 규격: 30s", vendor: "중국 A 방적사", date: "2026-07-20", qty: "5,000 / 5,000 kg", status: "입고완료" }
      ],
      subs: [
        { name: "YKK 지퍼 5호", spec: "컬러: 블랙, 실버 / 규격: 15cm, 20cm", vendor: "중국 C 지퍼사", date: "2026-08-10", qty: "10,000 / 10,000 개", status: "입고완료" }
      ]
    }
  ];

  // DOM 로드 완료 후 초기 렌더링
  document.addEventListener('DOMContentLoaded', () => {
    renderStyles();
  });

  // 브랜드 필터 및 목록 렌더링
  function renderStyles() {
    const filterValue = document.getElementById('brandFilter').value;
    const tbody = document.getElementById('styleList');
    tbody.innerHTML = '';

    const filteredData = filterValue === 'ALL' 
      ? stylesData 
      : stylesData.filter(item => item.brand === filterValue);

    filteredData.forEach(item => {
      // 1. 요약 행 (Summary Row)
      const summaryTr = document.createElement('tr');
      summaryTr.className = 'summary-row';
      summaryTr.onclick = () => toggleAccordion(item.id);
      summaryTr.innerHTML = `
        <td style="text-align:center;"><span class="arrow-icon" id="arrow-${item.id}">▲</span></td>
        <td><b>${item.brand}</b></td>
        <td>${item.season}</td>
        <td><span style="color:var(--primary-color); font-weight:bold;">${item.styleNo}</span></td>
        <td><b>${item.title}</b></td>
        <td>${item.targetDate}</td>
        <td><span class="badge badge-ongoing">${item.status}</span></td>
      `;

      // 2. 펼침 상세 행 (Detail Row)
      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.id = `detail-${item.id}`;
      
      let fabricsHtml = item.fabrics.map(f => `
        <tr>
          <td><span class="badge badge-type">${f.type}</span></td>
          <td><b>${f.name}</b></td>
          <td>${f.spec}</td>
          <td>${f.vendor}</td>
          <td>${f.date}</td>
          <td>${f.qty}</td>
          <td><span class="badge badge-ongoing">${f.status}</span></td>
        </tr>
      `).join('');

      let subsHtml = item.subs.map(s => `
        <tr>
          <td><span class="badge badge-sub">부자재</span></td>
          <td><b>${s.name}</b></td>
          <td>${s.spec}</td>
          <td>${s.vendor}</td>
          <td>${s.date}</td>
          <td>${s.qty}</td>
          <td><span class="badge badge-ongoing">${s.status}</span></td>
        </tr>
      `).join('');

      detailTr.innerHTML = `
        <td colspan="7" style="padding:0;">
          <div class="detail-container">
            <!-- 완제품 상세 영역 -->
            <div class="section-title">📦 완제품 상세내역</div>
            <p style="font-size:13px; color:#666; margin-top:0;">스타일 번호: ${item.styleNo} | 생산 수량 및 포장 스펙 관리 영역</p>

            <!-- 원사 및 원단 관리 -->
            <div class="section-title">🧵 원사 및 원단 관리</div>
            <table class="sub-table">
              <thead>
                <tr><th>구분</th><th>자재/품목명</th><th>자재 컬러/규격</th><th>공급업체</th><th>약속납기일</th><th>발주/입고 수량</th><th>상태</th></tr>
              </thead>
              <tbody>${fabricsHtml || '<tr><td colspan="7" style="text-align:center; color:#999;">등록된 원단 자재가 없습니다.</td></tr>'}</tbody>
            </table>

            <!-- 부자재 관리 -->
            <div class="section-title">✂️ 부자재 관리</div>
            <table class="sub-table">
              <thead>
                <tr><th>구분</th><th>부자재명</th><th>부자재 컬러/사이즈(규격)</th><th>공급업체</th><th>약속납기일</th><th>발주/입고 수량</th><th>상태</th></tr>
              </thead>
              <tbody>${subsHtml || '<tr><td colspan="7" style="text-align:center; color:#999;">등록된 부자재가 없습니다.</td></tr>'}</tbody>
            </table>
          </div>
        </td>
      `;

      tbody.appendChild(summaryTr);
      tbody.appendChild(detailTr);
    });
  }

  // 아코디언 토글 제어 (가로 전체 터치 시 동작)
  function toggleAccordion(id) {
    const detailRow = document.getElementById(`detail-${id}`);
    const arrowIcon = document.getElementById(`arrow-${id}`);
    const summaryRow = arrowIcon.closest('tr');

    const isOpen = detailRow.classList.contains('open');

    if (isOpen) {
      detailRow.classList.remove('open');
      summaryRow.classList.remove('open');
      arrowIcon.textContent = '▲';
    } else {
      detailRow.classList.add('open');
      summaryRow.classList.add('open');
      arrowIcon.textContent = '▼';
    }
  }

  // 브랜드 필터 변경 시
  function filterByBrand() {
    renderStyles();
  }

  // 모달 제어
  function openModal() { document.getElementById('registerModal').classList.add('active'); }
  function closeModal() { document.getElementById('registerModal').classList.remove('active'); }

  // 신규 Style 동적 추가 (데이터 Push)
  function addStyle() {
    const brand = document.getElementById('newBrand').value;
    const season = document.getElementById('newSeason').value;
    const styleNo = document.getElementById('newStyleNo').value;
    const title = document.getElementById('newTitle').value;
    const targetDate = document.getElementById('newTargetDate').value;

    if (!styleNo || !title) {
      alert('Style No와 상품명을 입력해주세요.');
      return;
    }

    const newEntry = {
      id: Date.now(),
      brand,
      season,
      styleNo,
      title,
      targetDate: targetDate || '2026-09-01',
      status: '진행 중',
      fabrics: [],
      subs: []
    };

    stylesData.unshift(newEntry); // 상단에 새 스타일 추가
    renderStyles();
    closeModal();

    // 입력 필드 초기화
    document.getElementById('newStyleNo').value = '';
    document.getElementById('newTitle').value = '';
  }
</script>
</body>
</html>
