<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VERSO | Multi-Brand SCM Engine</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        sans-serif;
    }

    body {
      background: #f5f6f8;
      color: #1f2937;
      padding: 24px;
    }

    /* =========================
       전체 기본
    ========================= */

    button,
    select {
      font-family: inherit;
    }

    /* =========================
       헤더
    ========================= */

    header {
      background: #ffffff;
      padding: 18px 22px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      margin-bottom: 18px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    h1 {
      font-size: 19px;
      font-weight: 750;
      color: #111827;
      letter-spacing: -0.3px;
    }

    .brand-selector {
      min-width: 180px;
      padding: 9px 12px;

      border: 1px solid #d1d5db;
      border-radius: 7px;

      background: #ffffff;
      color: #374151;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
      outline: none;
    }

    .brand-selector:hover {
      border-color: #9ca3af;
    }

    .brand-selector:focus {
      border-color: #64748b;
      box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.10);
    }

    /* =========================
       버튼
    ========================= */

    .btn-add {
      background: #111827;
      color: #ffffff;

      border: 1px solid #111827;
      border-radius: 7px;

      padding: 9px 15px;

      font-size: 13px;
      font-weight: 650;

      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn-add:hover {
      background: #374151;
      border-color: #374151;
    }

    /* =========================
       탭 메뉴
    ========================= */

    .nav-tabs {
      display: flex;
      gap: 6px;

      margin-bottom: 18px;

      border-bottom: 1px solid #dfe3e8;
      padding-bottom: 0;

      overflow-x: auto;
    }

    .tab-btn {
      position: relative;

      padding: 10px 15px;

      border: 1px solid transparent;
      border-bottom: none;

      background: transparent;

      color: #6b7280;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      border-radius: 7px 7px 0 0;

      white-space: nowrap;

      transition: 0.15s ease;
    }

    .tab-btn:hover {
      color: #374151;
      background: #f9fafb;
    }

    .tab-btn.active {
      color: #111827;

      background: #ffffff;

      border-color: #dfe3e8;

      font-weight: 700;

      margin-bottom: -1px;
    }

    .tab-btn.active::after {
      content: "";

      position: absolute;

      left: 12px;
      right: 12px;
      bottom: -1px;

      height: 2px;

      background: #111827;
    }

    /* =========================
       카드
    ========================= */

    .section-card {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 10px;

      padding: 20px;

      margin-bottom: 18px;

      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.035);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 15px;
      font-weight: 700;

      color: #111827;

      padding-bottom: 13px;
      border-bottom: 1px solid #edf0f2;

      margin-bottom: 14px;
    }

    /* =========================
       테이블
    ========================= */

    table {
      width: 100%;

      border-collapse: collapse;

      font-size: 13px;
    }

    th {
      background: #f8f9fa;

      color: #6b7280;

      font-size: 11px;
      font-weight: 700;

      padding: 10px;

      border-bottom: 1px solid #e5e7eb;

      text-align: left;

      white-space: nowrap;
    }

    td {
      padding: 13px 10px;

      border-bottom: 1px solid #f0f1f3;

      vertical-align: middle;

      color: #374151;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* =========================
       배지
       - 색을 최소화
    ========================= */

    .badge {
      display: inline-flex;
      align-items: center;

      padding: 4px 8px;

      border-radius: 5px;

      font-size: 11px;
      font-weight: 650;

      white-space: nowrap;
    }

    .badge-brand {
      background: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .badge-season {
      background: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .badge-status {
      background: #f8fafc;
      color: #374151;
      border: 1px solid #cbd5e1;
    }

    /* =========================
       Style No.
    ========================= */

    .style-no {
      font-weight: 750;
      color: #111827;
      letter-spacing: 0.2px;
    }

    /* =========================
       파이프라인
    ========================= */

    .pipeline {
      display: flex;

      gap: 6px;

      min-width: 470px;
    }

    .pipe-step {
      flex: 1;

      min-width: 95px;

      background: #ffffff;

      border: 1px solid #e2e5e9;

      border-radius: 6px;

      padding: 8px 9px;

      text-align: center;

      transition: 0.15s ease;
    }

    .pipe-step:hover {
      border-color: #b8bec7;
      background: #fafafa;
    }

    .pipe-step.active {
      border-color: #64748b;
      background: #f8fafc;
    }

    .pipe-title {
      font-size: 10px;

      font-weight: 650;

      color: #6b7280;

      margin-bottom: 3px;
    }

    .pipe-status {
      font-size: 12px;

      font-weight: 700;

      color: #1f2937;

      margin-top: 2px;
    }

    /* =========================
       상태별 텍스트
       색상 대신 기호와 굵기로 구분
    ========================= */

    .status-done {
      color: #374151;
    }

    .status-progress {
      color: #111827;
      font-weight: 750;
    }

    .status-wait {
      color: #9ca3af;
    }

    /* =========================
       반응형
    ========================= */

    @media (max-width: 900px) {

      body {
        padding: 12px;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
      }

      .header-left {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .brand-selector {
        width: 100%;
      }

      .btn-add {
        width: 100%;
      }

      .section-card {
        padding: 14px;
        overflow-x: auto;
      }

      table {
        min-width: 950px;
      }

      .nav-tabs {
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-left">

      <h1>VERSO | Multi-Brand SCM Engine</h1>

      <select
        id="brandFilter"
        class="brand-selector"
        onchange="renderData()"
      >
        <option value="ALL">전체 브랜드</option>

        <option value="BRD001">
          스노야 (SNOYA)
        </option>

        <option value="BRD002">
          모브온 (MOV ON)
        </option>
      </select>

    </div>

    <button
      class="btn-add"
      onclick="alert('신규 Style No. 등록 기능은 다음 단계에서 연결합니다.')"
    >
      + 신규 Style 등록
    </button>

  </header>


  <!-- =========================
       TAB MENU
  ========================= -->

  <div class="nav-tabs">

    <button class="tab-btn active">
      Style & 생산 프로젝트
    </button>

    <button class="tab-btn">
      원자재 Master
    </button>

    <button class="tab-btn">
      공장 / 업체 Master
    </button>

    <button class="tab-btn">
      전체 일정 현황
    </button>

  </div>


  <!-- =========================
       STYLE PROJECT
  ========================= -->

  <div class="section-card">

    <div class="section-header">

      <span>
        Style No. 생산 프로젝트
      </span>

    </div>


    <table>

      <thead>

        <tr>

          <th>브랜드</th>

          <th>시즌</th>

          <th>Style No.</th>

          <th>상품명</th>

          <th>목표 수량</th>

          <th>생산 파이프라인</th>

          <th>현재 상태</th>

        </tr>

      </thead>


      <tbody id="styleProjectList">

        <!-- JS 렌더링 -->

      </tbody>

    </table>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /*
      VERSO DATA MODEL

      Brand
        ↓
      Season
        ↓
      Style No.
        ↓
      Production Pipeline
    */

    const DB = {

      brands: [

        {
          id: "BRD001",
          name: "스노야 (SNOYA)"
        },

        {
          id: "BRD002",
          name: "모브온 (MOV ON)"
        }

      ],


      styles: [

        {
          styleNo: "ST26001",

          brandId: "BRD001",

          season: "2026 SS",

          name: "쫀쫀 슬림 팬츠",

          targetQty: "4,000개",

          status: "봉제 진행 중",

          pipeline: {

            fabric: "완료",

            subMaterial: "완료",

            sewing: "진행중",

            qc: "대기"

          }

        },


        {

          styleNo: "ST26002",

          brandId: "BRD002",

          season: "2026 FW",

          name: "오버핏 에어 티셔츠",

          targetQty: "2,500개",

          status: "원단 염색 중",

          pipeline: {

            fabric: "진행중",

            subMaterial: "대기",

            sewing: "대기",

            qc: "대기"

          }

        }

      ]

    };


    /* =========================
       STYLE DATA RENDER
    ========================= */

    function renderData() {

      const selectedBrand =
        document.getElementById("brandFilter").value;

      const tbody =
        document.getElementById("styleProjectList");

      tbody.innerHTML = "";


      const filteredStyles =
        selectedBrand === "ALL"

          ? DB.styles

          : DB.styles.filter(
              style =>
                style.brandId === selectedBrand
            );


      filteredStyles.forEach(style => {

        const brandObj =
          DB.brands.find(
            brand =>
              brand.id === style.brandId
          );


        const tr =
          document.createElement("tr");


        tr.innerHTML = `

          <td>

            <span class="badge badge-brand">

              ${
                brandObj
                  ? brandObj.name
                  : style.brandId
              }

            </span>

          </td>


          <td>

            <span class="badge badge-season">

              ${style.season}

            </span>

          </td>


          <td>

            <span class="style-no">

              ${style.styleNo}

            </span>

          </td>


          <td>

            ${style.name}

          </td>


          <td>

            ${style.targetQty}

          </td>


          <td>

            <div class="pipeline">


              <div
                class="pipe-step ${
                  style.pipeline.fabric === "완료"
                    ? "active"
                    : ""
                }"
              >

                <div class="pipe-title">
                  원단
                </div>

                <div class="pipe-status">
                  ${style.pipeline.fabric}
                </div>

              </div>


              <div
                class="pipe-step ${
                  style.pipeline.subMaterial === "완료"
                    ? "active"
                    : ""
                }"
              >

                <div class="pipe-title">
                  부자재
                </div>

                <div class="pipe-status">
                  ${style.pipeline.subMaterial}
                </div>

              </div>


              <div
                class="pipe-step ${
                  style.pipeline.sewing === "진행중"
                    ? "active"
                    : ""
                }"
              >

                <div class="pipe-title">
                  봉제공장
                </div>

                <div class="pipe-status">
                  ${style.pipeline.sewing}
                </div>

              </div>


              <div class="pipe-step">

                <div class="pipe-title">
                  QC / 검수
                </div>

                <div class="pipe-status">
                  ${style.pipeline.qc}
                </div>

              </div>


            </div>

          </td>


          <td>

            <span class="badge badge-status">

              ${style.status}

            </span>

          </td>

        `;


        tbody.appendChild(tr);

      });

    }


    /* =========================
       초기 실행
    ========================= */

    window.onload = function() {

      renderData();

    };

  </script>

</body>
</html>
