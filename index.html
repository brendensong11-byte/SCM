<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPROJECT | Multi-Brand SCM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
    .accordion-content { transition: all 0.3s ease-in-out; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- GNB -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-bold tracking-tight text-indigo-400">JPROJECT</span>
        <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">Multi-Brand SCM</span>
      </div>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition-all flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> 신규 스타일 등록
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- 탭 메뉴 -->
    <div class="flex border-b border-slate-200 mb-6 bg-white rounded-t-lg px-4 pt-2 shadow-sm">
      <button id="tab-active" onclick="switchTab('active')" class="px-6 py-3 font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2">
        <i class="fa-solid fa-spinner"></i> 진행 중 스타일 (<span id="count-active">0</span>)
      </button>
      <button id="tab-completed" onclick="switchTab('completed')" class="px-6 py-3 font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent flex items-center gap-2">
        <i class="fa-solid fa-box-archive"></i> 완료된 스타일 (영구보관) (<span id="count-completed">0</span>)
      </button>
    </div>

    <!-- 스타일 목록 (아코디언 구조) -->
    <div id="style-list" class="space-y-4">
      <!-- JavaScript로 동적 생성 -->
    </div>
  </main>

  <!-- 신규 등록 모달 -->
  <div id="modal-new" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-900 mb-4">신규 생산 스타일 등록</h3>
      <form onsubmit="handleCreateStyle(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">브랜드</label>
          <select id="new-brand" class="w-full border rounded-lg p-2.5 text-sm bg-slate-50">
            <option value="스노야">스노야</option>
            <option value="모브온">모브온</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">시즌</label>
            <input type="text" id="new-season" value="26FW" class="w-full border rounded-lg p-2.5 text-sm" required>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">스타일 코드</label>
            <input type="text" id="new-code" placeholder="ST260025" class="w-full border rounded-lg p-2.5 text-sm" required>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">스타일명</label>
          <input type="text" id="new-name" placeholder="상품명 입력" class="w-full border rounded-lg p-2.5 text-sm" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">사이즈 체계 선택</label>
          <select id="new-sizetype" class="w-full border rounded-lg p-2.5 text-sm bg-slate-50">
            <option value="NUM">숫자 사이즈 (55, 66, 77, 88, 99)</option>
            <option value="ALPHA">영문 사이즈 (S, M, L)</option>
            <option value="FREE">프리 사이즈 (FREE)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">납기일</label>
          <input type="date" id="new-date" class="w-full border rounded-lg p-2.5 text-sm" required>
        </div>
        <div class="flex justify-end gap-2 pt-4">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm font-semibold text-slate-600">취소</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 기본 샘플 데이터
    let stylesData = [
      {
        id: "ST260024",
        brand: "스노야",
        season: "26FW",
        name: "더블레이어드양말",
        dueDate: "2026-10-22",
        status: "active", // active | completed
        sizeType: "NUM", // NUM (55~99) | ALPHA (S,M,L) | FREE
        sizes: ["55", "66", "77", "88"],
        colors: ["핑크/옐로우", "블루/네이비", "퍼플/브라운"],
        matrix: {
          "핑크/옐로우": { "55": 1500, "66": 1500, "77": 1000, "88": 1000 },
          "블루/네이비": { "55": 1500, "66": 1500, "77": 1000, "88": 1000 },
          "퍼플/브라운": { "55": 1500, "66": 1500, "77": 1000, "88": 1000 }
        },
        steps: {
          design: { fileUploaded: false },
          sample: { proto: false, fit: false, cf: false },
          materials: { fabricIn: 0, subIn: 0 },
          sewing: { output: 0 },
          qc: { passed: false },
          shipping: { shipped: 0 }
        },
        fabrics: [
          { name: "면100%", type: "원단", process: "나염 수축가공", vendor: "중국 A 원단공장", order: 5000 }
        ],
        subs: []
      }
    ];

    let currentTab = 'active';
    let openStyleId = null;

    // 초기화
    function render() {
      const listContainer = document.getElementById('style-list');
      listContainer.innerHTML = '';

      const filtered = stylesData.filter(s => s.status === currentTab);

      document.getElementById('count-active').innerText = stylesData.filter(s => s.status === 'active').length;
      document.getElementById('count-completed').innerText = stylesData.filter(s => s.status === 'completed').length;

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="bg-white p-12 text-center rounded-xl border text-slate-400 font-medium">등록된 스타일이 없습니다.</div>`;
        return;
      }

      filtered.forEach(style => {
        const totalQty = calculateTotalQty(style);
        const progress = calculateProgress(style);
        const isOpen = openStyleId === style.id;

        const card = document.createElement('div');
        card.className = "bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden transition-all";

        card.innerHTML = `
          <!-- 아코디언 헤더 (터치/클릭 시 열림/닫힘) -->
          <div onclick="toggleAccordion('${style.id}')" class="p-5 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition-colors">
            <div class="flex items-center space-x-4">
              <span class="px-3 py-1 text-xs font-bold rounded-full ${style.brand === '스노야' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">${style.brand}</span>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-mono text-sm text-slate-500 font-bold">${style.id}</span>
                  <span class="font-bold text-slate-900 text-base">${style.name}</span>
                  <span class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-500 font-semibold">${style.season}</span>
                </div>
                <div class="text-xs text-slate-500 mt-1 flex gap-4">
                  <span>목표 수량: <strong>${totalQty.toLocaleString()} 장</strong></span>
                  <span>납기일: <strong>${style.dueDate}</strong></span>
                </div>
              </div>
            </div>

            <div class="flex items-center gap-6">
              <div class="text-right">
                <div class="text-xs font-semibold text-slate-500 mb-1">전체 진행률</div>
                <div class="flex items-center gap-2">
                  <div class="w-24 bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div class="bg-indigo-600 h-full" style="width: ${progress}%"></div>
                  </div>
                  <span class="text-xs font-bold text-indigo-600">${progress}%</span>
                </div>
              </div>
              <i class="fa-solid fa-chevron-down text-slate-400 transition-transform ${isOpen ? 'rotate-180' : ''}"></i>
            </div>
          </div>

          <!-- 아코디언 상세 내역 (펼쳐짐) -->
          ${isOpen ? renderDetailView(style) : ''}
        `;

        listContainer.appendChild(card);
      });
    }

    // 아코디언 토글
    function toggleAccordion(id) {
      openStyleId = openStyleId === id ? null : id;
      render();
    }

    // 탭 전환
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-active').className = tab === 'active' 
        ? "px-6 py-3 font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2"
        : "px-6 py-3 font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent flex items-center gap-2";
      document.getElementById('tab-completed').className = tab === 'completed'
        ? "px-6 py-3 font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2"
        : "px-6 py-3 font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent flex items-center gap-2";
      render();
    }

    // 상세 내역 UI 생성
    function renderDetailView(style) {
      const totalQty = calculateTotalQty(style);
      return `
        <div class="border-t border-slate-100 bg-slate-50/50 p-6 space-y-6">
          
          <!-- 7단계 진행 카드 -->
          <div class="grid grid-cols-7 gap-2 text-center text-xs">
            <div class="bg-white p-3 rounded-lg border shadow-sm">
              <div class="text-slate-400 font-semibold mb-1">디자인</div>
              <div class="font-bold text-indigo-600 text-sm">${style.steps.design.fileUploaded ? '100%' : '0%'}</div>
              <div class="text-[10px] text-slate-400 mt-1">${style.steps.design.fileUploaded ? '작지등록' : '미등록'}</div>
            </div>
            <div class="bg-white p-3 rounded-lg border shadow-sm">
              <div class="text-slate-400 font-semibold mb-1">샘플</div>
              <div class="font-bold text-indigo-600 text-sm">${style.steps.sample.cf ? '100%' : style.steps.sample.fit ? '66%' : style.steps.sample.proto ? '33%' : '0%'}</div>
              <div class="text-[10px] text-slate-400 mt-1">${style.steps.sample.cf ? 'CF승인' : '진행중'}</div>
            </div>
            <div class="bg-white p-3 rounded-lg border shadow-sm">
              <div class="text-slate-400 font-semibold mb-1">자재 준비</div>
              <div class="font-bold text-indigo-600 text-sm">0%</div>
              <div class="text-[10px] text-slate-400 mt-1">자재 관리</div>
            </div>
            <div class="bg-white p-3 rounded-lg border shadow-sm">
              <div class="text-slate-400 font-semibold mb-1">생산 준비</div>
              <div class="font-bold text-indigo-600 text-sm">0%</div>
              <div class="text-[10px] text-slate-400 mt-1">투입 대기</div>
            </div>
            <div class="bg-white p-3 rounded-lg border shadow-sm">
              <div class="text-slate-400 font-semibold mb-1">봉제</div>
              <div class="font-bold text-indigo-600 text-sm">0%</div>
              <div class="text-[10px] text-slate-400 mt-1">${style.steps.sewing.output} / ${totalQty}</div>
            </div>
            <div class="bg-white p-3 rounded-lg border shadow-sm">
              <div class="text-slate-400 font-semibold mb-1">QC/검품</div>
              <div class="font-bold text-indigo-600 text-sm">${style.steps.qc.passed ? '100%' : '0%'}</div>
              <div class="text-[10px] text-slate-400 mt-1">${style.steps.qc.passed ? '합격' : '대기'}</div>
            </div>
            <div class="bg-white p-3 rounded-lg border shadow-sm">
              <div class="text-slate-400 font-semibold mb-1">포장/출고</div>
              <div class="font-bold text-indigo-600 text-sm">${Math.round((style.steps.shipping.shipped/totalQty)*100 || 0)}%</div>
              <div class="text-[10px] text-slate-400 mt-1">${style.steps.shipping.shipped} / ${totalQty}</div>
            </div>
          </div>

          <!-- 상세 섹션 GRID -->
          <div class="grid grid-cols-2 gap-6">
            <!-- 1. 디자인/샘플 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
              <h4 class="font-bold text-sm text-slate-800 border-b pb-2"><i class="fa-solid fa-pencil text-indigo-500 mr-2"></i>1. 디자인 & 샘플 관리</h4>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">작업지시서 (작지)</label>
                <input type="file" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
              </div>
              <div class="space-y-2 pt-2">
                <label class="flex items-center gap-2 text-xs font-medium text-slate-700">
                  <input type="checkbox" ${style.steps.sample.proto ? 'checked' : ''} onchange="updateSample('${style.id}', 'proto', this.checked)" class="rounded text-indigo-600"> 1차 샘플 (Proto) 제작 완료
                </label>
                <label class="flex items-center gap-2 text-xs font-medium text-slate-700">
                  <input type="checkbox" ${style.steps.sample.fit ? 'checked' : ''} onchange="updateSample('${style.id}', 'fit', this.checked)" class="rounded text-indigo-600"> 2차 샘플 (Fit) 수정 완료
                </label>
                <label class="flex items-center gap-2 text-xs font-medium text-slate-700">
                  <input type="checkbox" ${style.steps.sample.cf ? 'checked' : ''} onchange="updateSample('${style.id}', 'cf', this.checked)" class="rounded text-indigo-600"> 최종 메인 샘플 (CF) 승인 완료
                </label>
              </div>
            </div>

            <!-- 2. 완제품 컬러/사이즈별 목표 수량 매트릭스 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
              <div class="flex justify-between items-center border-b pb-2 mb-3">
                <h4 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-layer-group text-indigo-500 mr-2"></i>2. 완제품 컬러 / 사이즈별 목표 수량</h4>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-xs text-center border-collapse">
                  <thead>
                    <tr class="bg-slate-50 text-slate-600 border-b">
                      <th class="p-2 text-left">컬러 / 사이즈</th>
                      ${style.sizes.map(sz => `<th class="p-2">${sz}</th>`).join('')}
                      <th class="p-2 font-bold text-indigo-600">컬러별 합계</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${style.colors.map(col => {
                      let rowSum = 0;
                      const cells = style.sizes.map(sz => {
                        const val = style.matrix[col]?.[sz] || 0;
                        rowSum += val;
                        return `<td class="p-2"><input type="number" value="${val}" onchange="updateMatrix('${style.id}', '${col}', '${sz}', this.value)" class="w-16 border rounded text-center p-1 font-mono"></td>`;
                      }).join('');
                      return `
                        <tr class="border-b">
                          <td class="p-2 text-left font-semibold text-slate-700">${col}</td>
                          ${cells}
                          <td class="p-2 font-bold font-mono text-indigo-600">${rowSum.toLocaleString()}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 하단 동작 버튼 (완료 / 리오더) -->
          <div class="flex justify-end gap-3 pt-4 border-t">
            ${style.status === 'active' ? `
              <button onclick="changeStatus('${style.id}', 'completed')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-check"></i> 최종 완료 처리 (완료 탭 이동)
              </button>
            ` : `
              <button onclick="reorderStyle('${style.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-repeat"></i> 리오더(재생산) 생성
              </button>
            `}
          </div>

        </div>
      `;
    }

    // 계산 및 업데이트 로직들
    function calculateTotalQty(style) {
      let total = 0;
      style.colors.forEach(col => {
        style.sizes.forEach(sz => {
          total += Number(style.matrix[col]?.[sz] || 0);
        });
      });
      return total;
    }

    function calculateProgress(style) {
      let p = 0;
      if (style.steps.sample.cf) p += 30;
      else if (style.steps.sample.fit) p += 20;
      else if (style.steps.sample.proto) p += 10;
      if (style.status === 'completed') return 100;
      return p;
    }

    function updateMatrix(id, col, sz, val) {
      const s = stylesData.find(x => x.id === id);
      if (s) {
        if (!s.matrix[col]) s.matrix[col] = {};
        s.matrix[col][sz] = Number(val);
        render();
      }
    }

    function updateSample(id, type, checked) {
      const s = stylesData.find(x => x.id === id);
      if (s) {
        s.steps.sample[type] = checked;
        render();
      }
    }

    function changeStatus(id, newStatus) {
      const s = stylesData.find(x => x.id === id);
      if (s) {
        s.status = newStatus;
        openStyleId = null;
        render();
      }
    }

    function reorderStyle(id) {
      const orig = stylesData.find(x => x.id === id);
      if (orig) {
        const newId = orig.id + "-RE";
        const copy = JSON.parse(JSON.stringify(orig));
        copy.id = newId;
        copy.name = orig.name + " (리오더)";
        copy.status = 'active';
        stylesData.unshift(copy);
        currentTab = 'active';
        openStyleId = newId;
        render();
      }
    }

    // 모달 제어
    function openModal() { document.getElementById('modal-new').classList.remove('hidden'); document.getElementById('modal-new').classList.add('flex'); }
    function closeModal() { document.getElementById('modal-new').classList.add('hidden'); document.getElementById('modal-new').classList.remove('flex'); }

    function handleCreateStyle(e) {
      e.preventDefault();
      const brand = document.getElementById('new-brand').value;
      const season = document.getElementById('new-season').value;
      const code = document.getElementById('new-code').value;
      const name = document.getElementById('new-name').value;
      const sizeType = document.getElementById('new-sizetype').value;
      const dueDate = document.getElementById('new-date').value;

      let sizes = ["55", "66", "77", "88"];
      if (sizeType === 'ALPHA') sizes = ["S", "M", "L"];
      if (sizeType === 'FREE') sizes = ["FREE"];

      const colors = ["기본컬러"];
      const matrix = { "기본컬러": {} };
      sizes.forEach(sz => matrix["기본컬러"][sz] = 1000);

      stylesData.unshift({
        id: code,
        brand: brand,
        season: season,
        name: name,
        dueDate: dueDate,
        status: "active",
        sizeType: sizeType,
        sizes: sizes,
        colors: colors,
        matrix: matrix,
        steps: {
          design: { fileUploaded: false },
          sample: { proto: false, fit: false, cf: false },
          materials: { fabricIn: 0, subIn: 0 },
          sewing: { output: 0 },
          qc: { passed: false },
          shipping: { shipped: 0 }
        },
        fabrics: [],
        subs: []
      });

      closeModal();
      openStyleId = code;
      render();
    }

    // 실행
    render();
  </script>
</body>
</html>
